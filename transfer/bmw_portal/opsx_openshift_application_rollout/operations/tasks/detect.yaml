# detect.yaml — HER uygulamanin tipini AYRI AYRI tespit eder ve uc listeye ayirir.
#
# NEDEN (2026-09-09 bulgusu): tip tespiti tek seferde, TUM parti icin yapiliyordu ve
# dongu ilk uygulamada `exit` ettigi icin sonrakilere HIC bakilmiyordu. Cikan tek rc
# butun partiyi tek bir dala yonlendiriyordu:
#     uygulama-bir (Deployment)   -> Exist,Success
#     uygulama-iki (Argo Rollout) -> "Not Exist,Failed"   <-- restart hic denenmedi
# rollout.yaml'daki `oc patch ... restartAt` komutu DOGRUYDU; komuta sira gelmiyordu.
# (Ters yon de gecerliydi: parti bir Rollout ile baslarsa Deployment'lar "Not Exist" olurdu.)
#
# COZUM: dongude `exit` YERINE `continue`; her uygulama kendi satirini uretir. Ardindan
# uygulamalar tipe gore ayrilir ve HER dosya YALNIZ KENDI listesini isler.
#
# CIKTI SATIRI: <tip>,<namespace>,<application>   (tip: deployment|rollout|dc|none)
# Teshis satirlari STDERR'e gider - stdout ayristiriliyor, oraya yazmak listeyi bozardi.

- name: --- [Task] Her uygulamanin tipini AYRI AYRI tespit et ---
  shell: |
    export KUBECONFIG="/tmp/kubeconfig_opsxdetect_$$"
    LOGIN=$(oc login --server={{ url }} --username="{{ username }}" --password="{{ password }}" 2>&1)
    IFS=';' read -ra input <<< "{{ oc_input }}"

    for i in "${input[@]}";do
      namespace=$(echo $i | awk -NF "," '{print $1}')
      application=$(echo $i | awk -NF "," '{print $2}')
      [[ -z "$namespace" || -z "$application" ]] && continue

      if oc get deployments -n "$namespace" "$application" --no-headers >/dev/null 2>&1;then
        echo "deployment,$namespace,$application"
        continue
      fi
      if oc get rollouts -n "$namespace" "$application" --no-headers >/dev/null 2>&1;then
        echo "rollout,$namespace,$application"
        continue
      fi
      if oc get dc -n "$namespace" "$application" --no-headers >/dev/null 2>&1;then
        echo "dc,$namespace,$application"
        continue
      fi
      echo "none,$namespace,$application"
      echo "TESPIT-YOK $namespace/$application: deployment/rollout/dc hicbirinde bulunamadi (login=$LOGIN)" >&2
    done

    oc logout --server="{{ url }}" > /dev/null 2>&1
    rm -f "$KUBECONFIG"
  register: app_types
  failed_when: false

- name: --- [Task] Uygulamalari tipe gore ayir ---
  ansible.builtin.set_fact:
    # Her liste "namespace,application" ogelerinden olusur - yani oc_input ile AYNI
    # sekilde; ilgili gorev dosyasi kendi listesini `target_input` olarak alir.
    apps_deployment: "{{ app_types.stdout_lines | default([]) | select('match', '^deployment,') | map('regex_replace', '^deployment,', '') | list }}"
    apps_rollout: "{{ app_types.stdout_lines | default([]) | select('match', '^rollout,') | map('regex_replace', '^rollout,', '') | list }}"
    apps_dc: "{{ app_types.stdout_lines | default([]) | select('match', '^dc,') | map('regex_replace', '^dc,', '') | list }}"
    apps_none: "{{ app_types.stdout_lines | default([]) | select('match', '^none,') | map('regex_replace', '^none,', '') | list }}"

- name: --- [Task] Tespit ozeti (AWX ciktisinda gorunur) ---
  ansible.builtin.debug:
    msg: >-
      deployment={{ apps_deployment | length }} rollout={{ apps_rollout | length }}
      dc={{ apps_dc | length }} bulunamadi={{ apps_none | length }}
      {{ ('| ' ~ (app_types.stderr_lines | default([]) | join(' | '))) if (app_types.stderr | default('')) | trim | length > 0 else '' }}
