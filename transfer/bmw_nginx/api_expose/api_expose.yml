---
# api_expose.yml — TEST ortamindaki bir API tanimini internete acik sunucuya (GBNGXT07)
# BIREBIR kopyalar.
#
# Girdi sozlesmesi, guvenlik kontrolleri ve Portal entegrasyonu: README.md
#
# NEDEN KOPYALAMA, YENIDEN URETME DEGIL: api_generator/create.yaml konfigurasyon blogunu
# disaridan alir (`location_append`, base64). O blok hicbir envanterde saklanmiyor -
# yalnizca kaynak sunucudaki dosyanin KENDISINDE var. Parametrelerden yeniden uretmeye
# calismak, kaynaktakinden farkli bir tanim uretme riski tasirdi; bu yuzden dosya
# oldugu gibi OKUNUP tasiniyor.

- name: --- [Play] Kaynak sunucudan API tanimini oku ---
  hosts: "{{ source_host }}"
  gather_facts: no
  tasks:
    - name: --- [Task] Girdileri dogrula ---
      ansible.builtin.assert:
        that:
          - (api | default('') | trim | length) > 0
          - (env | default('') | trim | lower) == 'test'
          - (source_host | default('') | trim | length) > 0
        fail_msg: >-
          api/source_host bos olamaz ve env yalnizca 'test' olabilir
          (verilen env: '{{ env | default("") }}'). Bu akis SADECE test ortami icindir.

    # CHANNEL KESFEDILIR, ISTENMEZ.
    # NginxRateLimitInventory yalnizca `basename` sakliyor (bkz. ratelimit_loader.py) -
    # yani dizin adindaki channel bilgisi envanterde YOK. Portal'in tahmin etmesi
    # yanlis dosyayi tasima riski dogururdu; bu yuzden kaynak sunucuda ARANIR.
    # `channel` yine de disaridan verilebilir (verilirse kesif atlanir).
    - name: --- [Task] API hangi channel dizininde - KESFET ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.shell: |
        for d in /usr/nginx/conf.d/*-{{ env }}-apis; do
          [ -f "$d/{{ api }}.conf" ] || continue
          basename "$d" | sed 's/-{{ env }}-apis$//'
        done
      register: chan_hits
      changed_when: false
      when: (channel | default('') | trim | length) == 0

    - name: --- [Task] Kullanilacak channel ---
      ansible.builtin.set_fact:
        channel_n: >-
          {{ (channel | trim) if (channel | default('') | trim | length) > 0
             else (chan_hits.stdout_lines | default([]) | first | default('')) }}
        chan_count: >-
          {{ 1 if (channel | default('') | trim | length) > 0
             else (chan_hits.stdout_lines | default([]) | length) }}

    - name: --- [Task] Channel bulunamadi ya da BIRDEN FAZLA - DURDUR ---
      ansible.builtin.fail:
        msg: >-
          {{ api }}.conf icin {{ inventory_hostname }} uzerinde
          {{ 'hicbir' if (chan_count | int) == 0 else (chan_count ~ ' ayri') }} channel
          dizini bulundu{{ ': ' ~ (chan_hits.stdout_lines | default([]) | join(', '))
                            if (chan_count | int) > 1 else '' }}.
          Tek bir dosya tasinabilir; `channel` degiskenini acikca verin.
      when: (chan_count | int) != 1

    - name: --- [Task] Kaynak API konfigurasyonu var mi ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.stat:
        path: "/usr/nginx/conf.d/{{ channel_n }}-{{ env }}-apis/{{ api }}.conf"
      register: src_stat

    - name: --- [Task] Kaynak tanim YOK - DURDUR ---
      ansible.builtin.fail:
        msg: >-
          {{ channel_n }}-{{ env }}-apis/{{ api }}.conf sunucu {{ inventory_hostname }} uzerinde BULUNAMADI.
          Envanterdeki kayit bayat olabilir; nginx_ratelimit_inventory job'ini
          calistirip tekrar deneyin.
      when: not src_stat.stat.exists

    - name: --- [Task] API konfigurasyonunu oku ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.slurp:
        src: "/usr/nginx/conf.d/{{ channel_n }}-{{ env }}-apis/{{ api }}.conf"
      register: src_conf

    # Bu API'ye ait zone TANIMLARI ayri dosyada (limit-zones.conf). Adlari tahmin
    # etmek yerine GERCEK satirlar cekilir - create.yaml'in urettigi bicim neyse o
    # tasinir, boylece hedefte farkli bir rate olusmaz.
    - name: --- [Task] Bu API'ye ait limit zone satirlarini oku ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.shell: |
        grep -E "zone={{ api }}_(rate|location)_limit:" /usr/nginx/conf.d/limit-zones.conf || true
      register: src_zones
      changed_when: false

    - name: --- [Task] Okunanlari sonraki play'e tasi ---
      ansible.builtin.set_fact:
        expose_conf_b64: "{{ src_conf.content }}"
        expose_zone_lines: "{{ src_zones.stdout_lines | default([]) }}"
        expose_channel: "{{ channel_n }}"

- name: --- [Play] Internete acik sunucuya uygula ---
  hosts: "{{ target_host | default('GBNGXT07') }}"
  gather_facts: no
  vars:
    api_dir: "/usr/nginx/conf.d/{{ channel_n }}-{{ env }}-apis"
    api_conf: "/usr/nginx/conf.d/{{ channel_n }}-{{ env }}-apis/{{ api }}.conf"
    zones_conf: "/usr/nginx/conf.d/limit-zones.conf"
    src_facts: "{{ hostvars[source_host] }}"
    channel_n: "{{ hostvars[source_host].expose_channel }}"
  tasks:
    # KRITIK: dosyayi yazmak YETMEZ - bir server blogu onu include ETMIYORSA tanim
    # yuklenmez ve is "basarili" gorunurken API internete ACILMAZ. Sessiz basari yerine
    # ACIK hata: include eksikse burada durulur.
    - name: --- [Task] Hedefte bu apis dizinini include eden bir vhost var mi ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.shell: |
        grep -rlE "include[[:space:]]+.*{{ channel_n }}-{{ env }}-apis/\*?\.conf" \
          /usr/nginx/conf.d/*.conf 2>/dev/null || true
      register: include_owner
      changed_when: false

    - name: --- [Task] include YOK - DURDUR ---
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} uzerinde hicbir vhost {{ api_dir }}/*.conf dizinini
          include ETMIYOR. Dosya yazilsaydi nginx onu HIC yuklemezdi ve API internete
          acilmis GORUNUP acilmamis olurdu. Once bu sunucuda
          "{{ channel_n }}-{{ env }}" vhost'unu ve include satirini olusturun.
      when: (include_owner.stdout | default('') | trim) == ''

    - name: --- [Task] apis dizinini olustur (yoksa) ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.file:
        path: "{{ api_dir }}"
        state: directory
        mode: '0750'
        owner: www
        group: was

    - name: --- [Task] Hedefte tanim zaten var mi ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.stat:
        path: "{{ api_conf }}"
      register: dst_stat

    - name: --- [Task] Zaman damgasi ---
      ansible.builtin.shell: date +%Y%m%d%H%M%S
      register: ts
      changed_when: false

    # create.yaml ile AYNI temkinlilik: uzerine yazmadan once yedek.
    - name: --- [Task] Mevcut tanimi yedekle ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.copy:
        src: "{{ api_conf }}"
        dest: "{{ api_conf }}.backup.{{ ts.stdout }}"
        remote_src: yes
        mode: '0640'
        owner: www
        group: was
      when: dst_stat.stat.exists

    - name: --- [Task] API konfigurasyonunu yaz ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.copy:
        content: "{{ src_facts.expose_conf_b64 | b64decode }}"
        dest: "{{ api_conf }}"
        mode: '0640'
        owner: www
        group: was

    # Zone satirlari ADIYLA eslestirilip guncellenir. `lineinfile` regexp TUTMAZSA
    # satiri dosyanin SONUNA EKLER - burada bu istenen davranistir (zone yoksa
    # eklenmeli), ama regexp'in zone ADINI hedeflemesi sart: aksi halde her kosuda
    # yeni bir kopya birikirdi.
    - name: --- [Task] Limit zone satirlarini tasi ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.lineinfile:
        path: "{{ zones_conf }}"
        regexp: "zone={{ (item | regex_search('zone=([^:]+):', '\\1') | first) | regex_escape }}:"
        line: "{{ item }}"
        create: yes
        mode: '0640'
        owner: www
        group: was
      loop: "{{ src_facts.expose_zone_lines }}"
      when: (src_facts.expose_zone_lines | length) > 0

    - name: --- [Task] nginx -t ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.shell: /usr/nginx/sbin/nginx -t
      register: ngx_test
      changed_when: false
      failed_when: false

    - name: --- [Task] Test BASARISIZ - geri al ---
      when: ngx_test.rc != 0
      block:
        - name: --- [Task] Yeni yazilan dosyayi kaldir (bizden ONCE yoktu) ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.file:
            path: "{{ api_conf }}"
            state: absent
          when: not dst_stat.stat.exists

        - name: --- [Task] Yedegi geri yukle (bizden ONCE vardi) ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.copy:
            src: "{{ api_conf }}.backup.{{ ts.stdout }}"
            dest: "{{ api_conf }}"
            remote_src: yes
            mode: '0640'
            owner: www
            group: was
          when: dst_stat.stat.exists

        - name: --- [Task] Geri alma sonrasi nginx -t ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.shell: /usr/nginx/sbin/nginx -t
          register: ngx_test_after
          changed_when: false
          failed_when: false

        - name: --- [Task] DURDUR ---
          ansible.builtin.fail:
            msg: >-
              nginx -t BASARISIZ, degisiklik geri alindi.
              Hata: {{ ngx_test.stderr | default(ngx_test.stdout) }}
              Geri alma sonrasi test: {{ 'TEMIZ' if ngx_test_after.rc == 0 else 'HALA BOZUK - ELLE BAKIN' }}

    - name: --- [Task] Nginx reload ---
      become: true
      become_method: dzdo
      become_user: www
      ansible.builtin.shell: /usr/nginx/sbin/nginx -s reload
      register: ngx_reload
      changed_when: true

    - name: --- [Task] Sonuc ---
      ansible.builtin.debug:
        msg: >-
          {{ api }} ({{ channel_n }}-{{ env }}) {{ source_host }} -> {{ inventory_hostname }}
          kopyalandi. Zone satiri: {{ src_facts.expose_zone_lines | length }}.
          Onceden {{ 'VARDI (yedeklendi)' if dst_stat.stat.exists else 'YOKTU (yeni)' }}.
