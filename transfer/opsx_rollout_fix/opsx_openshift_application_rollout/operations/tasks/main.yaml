---
- name: --- [Task] Paylasilan sonuc CSV'sini TEK SEFER temizle (coklu cluster race'ini onler) ---
  ansible.builtin.copy:
    content: ""
    dest: /sw/WAS_IMAGES/Ansible/Openshift/application_rollout.csv
    mode: 0777
  run_once: true
  delegate_to: localhost

# TIP TESPITI ARTIK UYGULAMA BASINA (2026-09-09).
#
# Onceki hal: tek bir shell gorevi TUM parti icin tip tespit ediyor, cikan rc'ye gore
# (0/44/55/66) parti KOMPLE tek bir dala yonlendiriliyordu. Tespit dongusu ilk
# uygulamada `exit` ettigi icin sonraki uygulamalara HIC bakilmiyordu:
#     uygulama-bir (Deployment)   -> Exist,Success
#     uygulama-iki (Argo Rollout) -> "Not Exist,Failed"   <-- restart hic denenmedi
# Argo Rollout'un `oc patch ... restartAt` komutu DOGRUYDU; komuta sira gelmiyordu.
#
# Artik her uygulama kendi tipine gore isleniyor (restart_all.yaml). Bu, deployment.yaml
# / rollout.yaml / deploymentconfig.yaml dosyalarini gereksiz kildi - ayni mantik uc kez
# kopyalanmisti, ucu de kaldirildi.
#
# ARK/non-ARK ayrimi da kalkti: tespit zaten "once deployment, sonra rollouts, sonra dc"
# sirasiyla calisiyor. Argo CRD'si olmayan bir cluster'da `oc get rollouts` hata verir ve
# akis bir sonraki tipe gecer - non-ARK'ta bugunku davranis (deployment restart) AYNEN
# korunur, ustelik oradaki bir DC de artik dogru islenir.
- name: --- [Task] Uygulamalari yeniden baslat (tip uygulama basina tespit edilir) ---
  include_tasks: restart_all.yaml

- name: --- [Task] Read application_rollout.csv ---
  read_csv:
    path: /sw/WAS_IMAGES/Ansible/Openshift/application_rollout.csv
    fieldnames: application,namespace,cluster,existence,status
    delimiter: ','
  register: rows
  run_once: true
  delegate_to: localhost
  ignore_errors: true

- name: --- [Task] Her satira basari isareti ekle (Teams karti icin - cluster basina tik/X/O) ---
  ansible.builtin.set_fact:
    marked_rows: >-
      {{
        marked_rows | default([]) + [
          item | combine({
            'mark': ('✅' if (item.existence == 'Exist' and item.status == 'Success')
                      else ('⭕' if item.existence == 'Not Exist' else '❌'))
          })
        ]
      }}
  loop: "{{ rows.list | default([]) }}"
  loop_control:
    label: "{{ item.application }}/{{ item.cluster }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Istekte bulunan kisiyi hesapla ---
  ansible.builtin.set_fact:
    requester_name: >-
      {{
        (email.split('@')[0] | replace('.', ' ') | replace('_', ' ') | title)
        if (email is defined and (email | trim | length) > 0)
        else 'Kullanıcı'
      }}
  delegate_to: localhost
  run_once: true

- name: --- [Task] Benzersiz uygulama+namespace ciftlerini cikar ---
  ansible.builtin.set_fact:
    unique_apps: "{{ marked_rows | default([]) | map(attribute='application') | zip(marked_rows | default([]) | map(attribute='namespace')) | unique | list }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Her uygulama+namespace cifti icin TUM cluster sonuclarini birlestir ---
  ansible.builtin.set_fact:
    group_rows: >-
      {{
        group_rows | default([]) + [{
          'application': item.0,
          'namespace': item.1,
          'total': (matching | length),
          'success': (matching | selectattr('status', 'equalto', 'Success') | list | length),
          'is_success_full': ((matching | selectattr('status', 'equalto', 'Success') | list | length) == (matching | length)),
          'is_notfound_full': ((matching | selectattr('existence', 'equalto', 'Not Exist') | list | length) == (matching | length)),
          'clusters_display': (
            (matching | sort(attribute='cluster') | map(attribute='cluster'))
            | zip(matching | sort(attribute='cluster') | map(attribute='mark'))
            | map('join', ' ')
            | join('   ')
          )
        }]
      }}
  vars:
    matching: "{{ marked_rows | default([]) | selectattr('application', 'equalto', item.0) | selectattr('namespace', 'equalto', item.1) | list }}"
  loop: "{{ unique_apps }}"
  loop_control:
    label: "{{ item.0 }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Teams karti icin ozeti (uygulama+namespace grubu basina) hesapla ---
  ansible.builtin.set_fact:
    teams_total: "{{ group_rows | default([]) | length }}"
    teams_success: "{{ group_rows | default([]) | selectattr('is_success_full', 'equalto', true) | list | length }}"
    teams_not_found: "{{ group_rows | default([]) | selectattr('is_notfound_full', 'equalto', true) | list | length }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Teams karti icin basarisiz sayisini hesapla ---
  ansible.builtin.set_fact:
    teams_failed: "{{ (teams_total | int) - (teams_success | int) - (teams_not_found | int) }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Teams karti icin uygulama satirlarini olustur (baslik + cluster basina kucuk puntolu tik/X/O satiri) ---
  ansible.builtin.set_fact:
    teams_rows: >-
      {{
        teams_rows | default([]) + [{
          'type': 'Container',
          'spacing': 'small',
          'items': [
            {
              'type': 'TextBlock',
              'text': ((
                  '✅ ' if item.is_success_full
                  else ('⭕ ' if item.is_notfound_full else '❌ ')
                ) ~ item.application ~ '   ·   ' ~ item.namespace),
              'wrap': true,
              'weight': 'Bolder',
              'size': 'Small'
            },
            {
              'type': 'TextBlock',
              'text': item.clusters_display,
              'wrap': true,
              'isSubtle': true,
              'size': 'Small',
              'spacing': 'none'
            }
          ]
        }]
      }}
  loop: "{{ group_rows | default([]) }}"
  loop_control:
    label: "{{ item.application }}"
  delegate_to: localhost
  run_once: true

- name: --- [Task] Sending information to Teams ---
  ansible.builtin.uri:
    url: "https://defaulte2d1902ef9f94297ba327ca093233a.a7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/f138bf582f1445a2b62a9d22ed250130/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=op9EergLGLOwi5F_gnrhltamqqJOJnVREdEXx1Y65PY"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      type: message
      attachments:
        - contentType: application/vnd.microsoft.card.adaptive
          content:
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json"
            type: AdaptiveCard
            version: "1.4"
            # DUZELTME: "requester_name" hicbir yerde default() ile korunmuyordu — Portal
            # bu degiskeni gondermeden ONCE (runner.cjs'e requester_email/requester_name
            # enjeksiyonu eklenmeden once) bu task "requester_name is undefined" ile HATA
            # VERIYORDU. Ayrica "id" alani "email" (bu playbook'un KENDI bilgilendirme maili
            # icin ayrica kullandigi degisken) yerine artik standart "requester_email"
            # kullanıyor.
            msteams:
              width: "Full"
              entities:
                - type: mention
                  text: "<at>{{ requester_name | default('Onur Demir') }}</at>"
                  mentioned:
                    id: "{{ requester_email | default('onurdemir3@garantibbva.com.tr') }}"
                    name: "{{ requester_name | default('Onur Demir') }}"
            body:
              - type: Container
                style: accent
                bleed: true
                items:
                  - type: ColumnSet
                    columns:
                      - type: Column
                        width: auto
                        verticalContentAlignment: Center
                        items:
                          - type: TextBlock
                            text: "🚀"
                            size: ExtraLarge
                      - type: Column
                        width: stretch
                        verticalContentAlignment: Center
                        items:
                          - type: TextBlock
                            text: "OpenShift Application Rollout"
                            weight: Bolder
                            size: Large
                            wrap: true
                          - type: TextBlock
                            text: "{{ oc_environment | default(env | default('')) }} ortamı"
                            isSubtle: true
                            spacing: none
                            wrap: true
              - type: TextBlock
                wrap: true
                spacing: Medium
                text: "İsteği açan: <at>{{ requester_name | default('Onur Demir') }}</at>"
              - type: ColumnSet
                spacing: Medium
                columns:
                  - type: Column
                    width: stretch
                    style: emphasis
                    items:
                      - type: TextBlock
                        text: "{{ teams_total }}"
                        weight: Bolder
                        size: ExtraLarge
                        horizontalAlignment: Center
                      - type: TextBlock
                        text: "Toplam"
                        horizontalAlignment: Center
                        isSubtle: true
                        spacing: none
                  - type: Column
                    width: stretch
                    style: good
                    items:
                      - type: TextBlock
                        text: "{{ teams_success }}"
                        weight: Bolder
                        size: ExtraLarge
                        horizontalAlignment: Center
                        color: good
                      - type: TextBlock
                        text: "Başarılı"
                        horizontalAlignment: Center
                        isSubtle: true
                        spacing: none
                  - type: Column
                    width: stretch
                    style: attention
                    items:
                      - type: TextBlock
                        text: "{{ teams_failed }}"
                        weight: Bolder
                        size: ExtraLarge
                        horizontalAlignment: Center
                        color: attention
                      - type: TextBlock
                        text: "Başarısız"
                        horizontalAlignment: Center
                        isSubtle: true
                        spacing: none
              - type: TextBlock
                text: "Detaylar"
                weight: Bolder
                size: Medium
                spacing: Medium
              - type: Container
                items: "{{ teams_rows | default([]) }}"
              - type: TextBlock
                text: "İşlem yapılan cluster'lar"
                weight: Bolder
                size: Medium
                spacing: Medium
              - type: TextBlock
                text: "{{ (rows.list | default([]) | map(attribute='cluster') | unique | list | join(', ')) if (rows.list | default([]) | length) > 0 else '(yok)' }}"
                wrap: true
                isSubtle: true
                spacing: none
              - type: TextBlock
                text: "✅ Başarılı  ·  ❌ Başarısız  ·  ⭕ Uygulama bulunamadı"
                isSubtle: true
                size: Small
                spacing: Medium
              - type: TextBlock
                text: "Job No: {{ tower_job_id | default('N/A') }} · {{ now(fmt='%d.%m.%Y %H:%M') }}"
                isSubtle: true
                size: Small
                spacing: Medium
    status_code:
      - 200
      - 202
  delegate_to: localhost
  run_once: true
  failed_when: false
  environment:
    http_proxy: "http://tekprxv2.fw.garanti.com.tr:80"
    https_proxy: "http://tekprxv2.fw.garanti.com.tr:80"
    HTTP_PROXY: "http://tekprxv2.fw.garanti.com.tr:80"
    HTTPS_PROXY: "http://tekprxv2.fw.garanti.com.tr:80"
    no_proxy: "localhost,127.0.0.1"
    NO_PROXY: "localhost,127.0.0.1"