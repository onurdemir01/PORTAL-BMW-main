log_format  bmw        'client_ip=$remote_addr '
                       'client_port=$remote_port '
                       'time=$time_local '
                       'method=$request_method '
                       'status=$status '
                       'request=$request_uri '
                       'upstream_addr=$upstream_addr '
                       'upstream_status=$upstream_status '
                       'request_time=$request_time '
                       'upstream_response_time=$upstream_response_time '
                       'upstream_connect_time=$upstream_connect_time '
                       'upstream_header_time=$upstream_header_time '
                       'request_length=$request_length '
                       'response_lenght=$body_bytes_sent '
                       'user-agent=$http_user_agent '
                       'xff=$http_x_forwarded_for '
                       'xffp=$http_remoteport '
                       'cache_status=$upstream_cache_status '
                       'connection_request=$connection_requests '
                       'referer=$http_referer '
                       'host=$http_host '
                       'ssl_protocol=$ssl_protocol '
                       'ssl_server_name=$ssl_server_name '
                       'host=$http_host '
                       'guid=$http_guid '
                       'customer_type=$http_customer_type '
                       'source_application=$http_source_application '
                       'client_platform=$http_client_platform '
                       'opaque_id=$http_opaque_id '
                       'sub_application=$http_sub_application '
                       'device_id=$http_device_id '
                       'device_model=$http_device_model '
                       'os_version=$http_os_version '
                       'gb_version=$http_gb_version '
                       'trace_id=$http_trace_id '
                       'cookie=$http_cookie '
                       'response_set_cookie=$sent_http_set_cookie '
                       'response_location=$sent_http_location '
                       'upstream_location=$upstream_http_location ';

log_format  serverpush  'client_ip=$remote_addr  '
                        'client_port=$remote_port  '
                        'time=$time_local  '
                        'method=$request_method  '
                        'status=$status  '
                        'request=$request  '
                        'upstream_addr=$upstream_addr  '
                        'upstream_status=$upstream_status  '
                        'request_time=$request_time  '
                        'upstream_response_time=$upstream_response_time  '
                        'upstream_connect_time=$upstream_connect_time  '
                        'upstream_header_time=$upstream_header_time  '
                        'request_length=$request_length  '
                        'response_lenght=$body_bytes_sent  '
                        'referer=$http_referer  '
                        'user-agent=$http_user_agent  '
                        'xff=$http_x_forwarded_for  '
                        'xffp=$http_remoteport '
                        'cache_status=$upstream_cache_status  '
                        'device_id=$http_device_id  '
                        'dialect=$http_dialect  '
                        'channel=$http_channel  '
                        'guid=$http_guid  '
                        'tenant-company-id=$http_tenant_company_id  '
                        'tenant-geolocation=$http_tenant_geolocation  '
                        'tenant-app-id=$http_tenant_app_id '
                        'customer-type=$http_customer_type  '
                        'device-model=$http_device_model  '
                        'client-platform=$http_client_platform  '
                        'opaque-id=$http_opaque_id  '
                        'client-application-name=$http_client_application_name  '
                        'gb-version=$http_gb_version  '
