location = /locales/locales.json {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header Cache-Control 'no-cache';
  alias /usr/nginx/applications/$namespace/$application/locales/locales.json;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }
}

location ~* .(js|json|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf|xml|pdf|xls|xlsx|doc|docx|map|lottie)$ {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header expires '10y';
  add_header Pragma 'public';
  add_header Cache-Control 'public, max-age=315360000, immutable';
  root /usr/nginx/applications/$namespace/$application/;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }
}

location /live {
  access_log off;
  return 200 'healthy\n';
}

location /ready {
  access_log off;
  alias /usr/nginx/applications/$namespace/$application/;
  try_files $uri $uri/ '/config.json' =404;
}

location = /config {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header Cache-Control 'no-cache';
  alias /usr/nginx/applications/$namespace/$application/config.json;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }
}

location / {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header Cache-Control 'no-cache';
  alias /usr/nginx/applications/$namespace/$application/;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }

  index index.html index.htm;
  try_files $uri $uri/ /index.html =404;
}

location ~* \.wasm\.br$ {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header expires '10y';
  add_header Pragma 'public';
  add_header Cache-Control 'public, max-age=315360000, immutable';
  alias /usr/nginx/applications/$namespace/$application/;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }

  if ($http_accept_encoding !~* br) {
    rewrite ^(.*)\.br$ $1.gz last;
  }

  add_header Content-Encoding br;
  types { application/wasm wasm.br; }
  default_type application/wasm;
}

location ~* \.wasm\.gz$ {

  add_header Access-Control-Allow-Origin $allowed_origin_$cors_application_$cors_namespace always;
  add_header Access-Control-Max-Age $max_age_$cors_application_$cors_namespace;
  add_header Access-Control-Allow-Credentials $allowed_credentials_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Headers $allowed_headers_$cors_application_$cors_namespace always;
  add_header Access-Control-Allow-Methods $allowed_methods_$cors_application_$cors_namespace always;
  add_header expires '10y';
  add_header Pragma 'public';
  add_header Cache-Control 'public, max-age=315360000, immutable';
  alias /usr/nginx/applications/$namespace/$application/;

  if ($request_method ~* ^(OPTIONS|POST)$) {
    return 200;
  }

  add_header Content-Encoding gzip;
  gzip_static always;
  types { application/wasm wasm.gz; }
  default_type application/wasm;
}

