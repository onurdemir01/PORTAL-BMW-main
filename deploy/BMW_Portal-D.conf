# deploy/BMW_Portal-D.conf — REFERANS kopya.
# Canli dosya: /usr/nginx/conf.d/BMW_Portal-D.conf (kurumsal nginx, DEGISTIRILMEZ —
# ana nginx.conf'un include zinciri: mime.types, custom.conf, bmw_defaults.conf,
# proxy_settings.conf, rate_limits.conf, log_format.conf, conf.d/*.conf).
#
# Portal calisma modeli: node production modda :3000'de dinler; dist/ statik dosyalari
# VE /api ayni porttan servis edilir (vite dev prod'da CALISTIRILMAZ). Bu yuzden
# kurumsal conf'taki tek `location / { proxy_pass ...:3000; }` yeterlidir.
#
# Asagidaki eklemeler MEVCUT yapiyi bozmaz — yalnizca proxy header'lari ve uzun
# sureli istekler (LogX indirme, AWX long-poll, AI SSE) icin timeout'lari tamamlar.

server {
    listen 10.151.162.147:443 ssl;
    http2 on;
    server_name bmwportal-d.fw.garanti.com.tr;
    ssl_certificate     /usr/nginx/ssl/wildcard.fw.garantibbva.com.tr.crt;
    ssl_certificate_key /usr/nginx/ssl/wildcard.fw.garantibbva.com.tr.key;

    access_log /portal-bmw-nginx.log bmw;
    error_log  /web_log/portal-error.log;

    # LogX v2 buyuk zip indirme/upload'lari icin (varsayilan 1m yetmez)
    client_max_body_size 210m;

    location / {
        proxy_pass http://10.151.162.147:3000/;

        # Secure session cookie'nin set edilebilmesi icin zorunlu
        # (server/index.cjs: app.set('trust proxy', 1) + cookie.secure NODE_ENV=production)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;

        # LogX indirmeleri + AWX long-poll + AI Analist SSE akisi icin
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}
