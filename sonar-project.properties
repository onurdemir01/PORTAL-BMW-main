# Kurumsal SonarQube proje yapilandirmasi (bmw-portal)
# NOT: Coverage orani yalnızca gercek test ciktisindan (coverage/lcov.info) hesaplanir;
# uretim koduna yapay sonar.coverage.exclusions KOYULMAZ.

sonar.projectKey=JAVASCRIPT:GAR_BMW_PORTAL
sonar.projectName=BMW Portal
sonar.sourceEncoding=UTF-8

sonar.sources=src,server,shared
sonar.tests=src,server
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.cjs,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=node_modules/**,dist/**,dist_prev/**,coverage/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.cjs,**/*.spec.ts,**/*.spec.tsx,sunum/**,docs/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.server-check.json
sonar.python.version=3.11
