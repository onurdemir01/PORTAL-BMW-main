# Kurumsal SonarQube proje yapilandirmasi (bmw-portal)
# NOT: Coverage orani yalnızca gercek test ciktisindan (coverage/lcov.info) hesaplanir;
# uretim koduna yapay sonar.coverage.exclusions KOYULMAZ.

sonar.projectKey=JAVASCRIPT:GAR_BMW_PORTAL
sonar.projectName=BMW Portal
sonar.sourceEncoding=UTF-8

sonar.sources=src,server,shared
sonar.tests=src,server
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=node_modules/**,dist/**,dist_prev/**,coverage/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts,**/*.spec.tsx,sunum/**,docs/**

# kalite/kapsam/lcov.info: repoda tasinan rapor (kurumsal pipeline testleri kosturamiyor;
# docs/adr/0004-kapsam-raporu-repoda.md). coverage/lcov.info: pipeline kendisi uretirse.
sonar.javascript.lcov.reportPaths=kalite/kapsam/lcov.info,coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.server-check.json
# Hedef makineler: RHEL 8 (Python 3.6) ve RHEL 9 (3.9); betikler oralarda Ansible ile kosar.
sonar.python.version=3.6, 3.9

# Kopya (CPD) disi: YALNIZ bildirimsel veri dosyalari. CPD dizgi degismezlerini ayni belirtec
# sayar; ayni bicimdeki veri girdileri (sema / katalog / kiraci listesi) birbirinin kopyasi gibi
# gorunur, tekrar eden mantik yoktur. Gerekceler ve liste: kalite/esikler.json `sonar.cpdHaric`
# (iki liste birebir ayni olmali; server/__tests__/kalite-kapilari.test.js). Kod dosyasi eklenmez.
sonar.cpd.exclusions=server/db/mssql-setup.cjs,src/components/admin/tabs/sistem/ortamDegiskenleri.ts,server/server-hub/kural-katalogu.cjs,shared/cryptoHubTenants.cjs
