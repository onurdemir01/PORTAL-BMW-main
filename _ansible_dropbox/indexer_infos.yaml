          loop:
            - { uri: '{{ digital_assets_prod_api }}', token: '{{ digital_assets_prod_token }}', cluster: 'daocpprod1', namespace: 'harmonize-prod', prefix: 'hmz'}
            - { uri: '{{ bank_prod_api }}', token: '{{ bank_prod_token }}', cluster: 'gbocp3rdcwprod1', namespace: 'harmonize-prod', prefix: 'hmzbank'}
            
