- name: Metaco Indexer Information Playbook
  hosts: daocptest1
  gather_facts: no
  vars_files:
    - vars/token_and_apis.yaml
  tasks:
    - name: --- Block tasks for Metaco Test Environment ---
      block:
        - name: --- Truncate output file ---
          shell: |
              truncate -s0 /sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv
          delegate_to: localhost
          run_once: true
          ignore_errors: true

        - name: --- Trigger execution ---
          become: true
          become_user: was
          become_method: dzdo
          shell: |
            export KUBECONFIG="/tmp/kubeconfig_metaco_indexer_$$"
            LOGIN=$(oc login --server={{ item.uri }} --token={{ item.token }} 2>&1)
            LOGIN_RC=$?
            if [ $LOGIN_RC -ne 0 ]; then
              echo "{{ item.cluster }},{{ item.namespace }},LOGIN_FAILED,ERROR,${LOGIN//,/ }"
              rm -f "$KUBECONFIG"
              exit 0
            fi

                SOLRPC=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-solana-mainnet | grep -i SOLRPC | awk '{print $2}')
                SOLWSRPC=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-solana-mainnet | grep -i SOLWSRPC | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-solana-mainnet,SOLRPC,${SOLRPC}"
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-solana-mainnet,SOLWSRPC,${SOLWSRPC}"

                NBXPLORER_BTCNODEENDPOINT=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-mainnet| grep -i NBXPLORER_BTCNODEENDPOINT | awk '{print $2}')
                NBXPLORER_BTCRPCURL=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-mainnet | grep -i NBXPLORER_BTCRPCURL | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-mainnet,NBXPLORER_BTCNODEENDPOINT,${NBXPLORER_BTCNODEENDPOINT}"
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-mainnet,NBXPLORER_BTCRPCURL,${NBXPLORER_BTCRPCURL}"

                NBXPLORER_LTCNODEENDPOINT=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-mainnet | grep -i NBXPLORER_LTCNODEENDPOINT | awk '{print $2}')
                NBXPLORER_LTCRPCURL=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-mainnet | grep -i NBXPLORER_LTCRPCURL | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-mainnet,NBXPLORER_LTCNODEENDPOINT,${NBXPLORER_LTCNODEENDPOINT}"
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-mainnet,NBXPLORER_LTCRPCURL,${NBXPLORER_LTCRPCURL}"

                NBXPLORER_BTCNODEENDPOINT=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-testnet | grep -i NBXPLORER_BTCNODEENDPOINT | awk '{print $2}')
                NBXPLORER_BTCRPCURL=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-nbxplorer-testnet | grep -i NBXPLORER_BTCRPCURL | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-testnet,NBXPLORER_BTCNODEENDPOINT,${NBXPLORER_BTCNODEENDPOINT}"
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-nbxplorer-testnet,NBXPLORER_BTCRPCURL,${NBXPLORER_BTCRPCURL}"

                ETH_INDEXER_NODE_URI=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-ethereum-mainnet | grep -i ETH_INDEXER_NODE_URI | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-ethereum-mainnet,ETH_INDEXER_NODE_URI,${ETH_INDEXER_NODE_URI}"

                ETH_INDEXER_NODE_URI=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-ethereum-testnet-sepolia | grep -i ETH_INDEXER_NODE_URI | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-ethereum-testnet-sepolia,ETH_INDEXER_NODE_URI,${ETH_INDEXER_NODE_URI}"

                ETH_INDEXER_NODE_URI=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-avalanche-c-chain-mainnet | grep -i ETH_INDEXER_NODE_URI | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-avalanche-c-chain-mainnet,ETH_INDEXER_NODE_URI,${ETH_INDEXER_NODE_URI}"

                OGMIOS=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-cardano-mainnet | grep -i OGMIOS | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-cardano-mainnet,OGMIOS,${OGMIOS}"

                XRP_INDEXER_SERVER_URI=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-xrpl-mainnet | grep -i XRP_INDEXER_SERVER_URI | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-xrpl-mainnet,XRP_INDEXER_SERVER_URI,${XRP_INDEXER_SERVER_URI}"

                SIDECAR_URL=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-substrate-polkadot-assethub | grep -i SIDECAR_URL | awk '{print $2}')
                SIDECAR_AUTH_VALUE=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-substrate-polkadot-assethub | grep -i SIDECAR_AUTH_VALUE | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-substrate-polkadot-assethub,SIDECAR_URL,${SIDECAR_URL}"
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-substrate-polkadot-assethub,SIDECAR_AUTH_VALUE,${SIDECAR_AUTH_VALUE}"

                ETH_INDEXER_NODE_URI=$(oc describe deployment -n {{ item.namespace }} {{ item.prefix }}-harmonize-polygon-mainnet | grep -i ETH_INDEXER_NODE_URI | awk '{print $2}')
                echo "{{ item.cluster }},{{ item.namespace }},{{ item.prefix }}-harmonize-polygon-mainnet ,ETH_INDEXER_NODE_URI,${ETH_INDEXER_NODE_URI}"

            oc logout --server={{ item.uri }} > /dev/null
            rm -f "$KUBECONFIG"
          register: output
          loop:
            - { uri: '{{ digital_assets_non_prod_api }}', token: '{{ digital_assets_non_prod_token }}', cluster: 'daocptest1', namespace: 'harmonize-test', prefix: 'hmz'}
            - { uri: '{{ bank_non_prod_api }}', token: '{{ bank_non_prod_token }}', cluster: 'gbocp3rdcwtest1', namespace: 'harmonize-test', prefix: 'hmzbank'}
            
        - name: --- Ensure output file exist ---
          copy:
            content: ""
            dest: /sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv
            force: false
            mode: 0777
          run_once: true
          delegate_to: localhost

        - name: --- Append results ---
          lineinfile:
            insertafter: EOF
            path: /sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv
            line: "{{ item.stdout }}"
            create: yes
            mode: 0777
          delegate_to: localhost
          loop:  "{{ output.results }}"
          throttle: 1
          no_log: true
          ignore_errors: true

