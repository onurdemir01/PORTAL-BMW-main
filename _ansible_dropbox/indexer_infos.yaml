            create: yes
            mode: 0777
          delegate_to: localhost
          loop:  "{{ output.results }}"
          throttle: 1
          no_log: true
          ignore_errors: true

        # DUZELTME: bu task delegate_to: localhost OLMADAN calisiyordu, yani dosyayi
        # (localhost'a yazilan CSV'yi) uzak jump server'da (daocpprod1/gbocp3rdcwprod1)
        # aramaya calisiyordu — orada boyle bir dosya olmadigindan task HATA VERIYOR ve
        # block burada duruyordu; bu yuzden asagidaki mail/Teams task'lari HIC calismiyordu.
        # become/dzdo de gereksizdi (kardes task'larin hicbiri kullanmiyor, dosya zaten
        # controller'da normal izinlerle yaziliyor).
        - name: --- Read output-prod.csv ---
          read_csv:
            path: /sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv
            fieldnames: cluster,namespace,application,variable,value
            delimiter: ','
          register: rows
          delegate_to: localhost
          run_once: true

        # 2026-08-18: "Trigger execution" artik oc login basarisiz olunca (ag/timeout vb.)
        # sessizce bos degerli satirlar YAZMIYOR — LOGIN_FAILED,ERROR satiri yazip o
        # cluster'i atliyor. Bu satirlari burada AYIRT ediyoruz ki Teams karti "basarili"
        # gibi gorunup asagida hangi cluster'in taranamadigini GIZLEMESIN.
        - name: --- [Task] Basarisiz login yapan cluster'lari tespit et ---
          ansible.builtin.set_fact:
            failed_logins: "{{ (rows.list | default([])) | selectattr('variable', 'equalto', 'ERROR') | list }}"
          run_once: true

        - name: --- Sending information mail to the recipients ---
          mail:
           host: smtpappv1.fw.garanti.com.tr
           port: 25
           subject: 'Ansible Automation Report - Job : Metaco Indexer Informations'
           body: "{{ lookup('template','templates/indexer_info.yml.j2') }}"
           from: ansible@garanti.com.tr 
           to:
           #- GTBulutMiddlewareTeknolojileri@garantibbva.com.tr
           - GTBlockchainveSaklamaTeknolojileri@garantibbva.com.tr
           - GTDijitalVarlikCozumleriRezilyansYonetimi@garantibbva.com.tr
           - GTAgileChainSmokers@garantibbva.com.tr
           subtype: html
           charset: utf8
          delegate_to: localhost
          run_once: true

        - name: "--- [Task] Sending information to Teams ---"
          ansible.builtin.uri:
            url: "https://defaulte2d1902ef9f94297ba327ca093233a.a7.environment.api.powerplatform.com/powerautomate/automations/direct/cu/22/workflows/41c026e1f53942a5aa3e82943a4e2fed/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=S13EzgAW8ooKg1dtQ5oUzV3Gs49m7mWe-VMXcI-BxUM"
            method: POST
            headers:
              Content-Type: "application/json"
            body_format: json
            body:
              type: message
              attachments:
                - contentType: application/vnd.microsoft.card.adaptive
                  content:
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json"
                    type: AdaptiveCard
                    version: "1.4"
                    # TODO (Onur Demir doldurmayi bekliyor): gercek Teams @mention icin her
                    # kisinin e-posta/UPN'i gerekiyor - bkz. pod_restart/tasks/execute.yaml'daki
                    # calisan ornek:
                    # msteams:
                    #   width: "Full"
                    #   entities:
                    #     - type: mention
                    #       text: "<at>Onur Demir</at>"
                    #       mentioned: { id: "<onur-demir-upn>", name: "Onur Demir" }
                    #     - type: mention
                    #       text: "<at>Turgutalp Tug</at>"
                    #       mentioned: { id: "<turgutalp-tug-upn>", name: "Turgutalp Tug" }
                    #     - type: mention
                    #       text: "<at>Elif Godus</at>"
                    #       mentioned: { id: "<elif-godus-upn>", name: "Elif Godus" }
                    #     - type: mention
                    #       text: "<at>Cihad Ozcan</at>"
                    #       mentioned: { id: "<cihad-ozcan-upn>", name: "Cihad Ozcan" }
                    body:
                      - type: Container
                        style: "{{ 'attention' if (failed_logins | default([]) | length) > 0 else 'accent' }}"
                        bleed: true
                        items:
                          - type: ColumnSet
                            columns:
                              - type: Column
                                width: auto
                                verticalContentAlignment: Center
                                items:
                                  - type: TextBlock
                                    text: "{{ '⚠️' if (failed_logins | default([]) | length) > 0 else '📋' }}"
                                    size: ExtraLarge
                              - type: Column
                                width: stretch
                                verticalContentAlignment: Center
                                items:
                                  - type: TextBlock
                                    text: "Metaco Indexer Bilgileri"
                                    weight: Bolder
                                    size: Large
                                    wrap: true
                                  - type: TextBlock
                                    text: >-
                                      {{ "Tarama KISMEN tamamlandı — bazı cluster'lara ulaşılamadı"
                                         if (failed_logins | default([]) | length) > 0
                                         else "Günlük tarama tamamlandı" }}
                                    isSubtle: true
                                    spacing: none
                                    wrap: true
                      # 2026-08-18: login basarisiz olan cluster(lar) varsa hatayi ACIKCA goster —
                      # eskiden bu durumda kart hep "tamamlandi" diyor, CSV'ye sessizce bos satirlar
                      # yaziliyordu ve kimse fark etmiyordu. Adaptive Card govdesi STATIK bir
                      # liste oldugu icin (Ansible "when:" burada GECERSIZ — bir onceki gezimde
                      # ayni sinif hatayi bulmustuk) satiri kosullu EKLEMEK/CIKARMAK yerine, hep
                      # var olan FactSet degerini kosullu DOLDURUYORUZ (bos + "Yok" -> guvenli).
                      - type: FactSet
                        spacing: Medium
                        facts:
                          - title: "Toplam satır"
                            value: "{{ (rows.list | default([])) | length }}"
                          - title: "Ulaşılamayan cluster"
                            value: >-
                              {{ (failed_logins | default([]) | map(attribute='cluster') | unique | list | join(', '))
                                 if (failed_logins | default([]) | length) > 0 else "Yok" }}
                          - title: "İlk hata"
                            value: >-
                              {{ ((failed_logins | first).value | default("") | truncate(200))
                                 if (failed_logins | default([]) | length) > 0 else "-" }}
                      - type: TextBlock
                        wrap: true
                        spacing: Medium
                        text: "📌 Detaylar için **/sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv** dosyasını kullanınız"
                      - type: TextBlock
                        text: "Job No: {{ tower_job_id | default('N/A') }} · {{ now(fmt='%d.%m.%Y %H:%M') }}"
                        isSubtle: true
                        size: Small
                        spacing: Medium
            status_code:
              - 200
              - 202
          delegate_to: localhost
          run_once: true
          failed_when: false
          environment:
            http_proxy: "http://tekprxv2.fw.garanti.com.tr:80"
            https_proxy: "http://tekprxv2.fw.garanti.com.tr:80"
            HTTP_PROXY: "http://tekprxv2.fw.garanti.com.tr:80"
            HTTPS_PROXY: "http://tekprxv2.fw.garanti.com.tr:80"
            no_proxy: "localhost,127.0.0.1"
            NO_PROXY: "localhost,127.0.0.1"

        - name: --- Truncate output file ---
          shell: |
              truncate -s0 /sw/WAS_IMAGES/Ansible/metaco-indexer-info-output.csv
          delegate_to: localhost
          run_once: true
          ignore_errors: true

