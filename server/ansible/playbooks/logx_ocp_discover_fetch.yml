---
# LogX v2 - OCP pod discovery, log collection and archive staging
# Location:
#   bmw_automation_folder/portal_tamplates/logx_ocp_discover_fetch.yml
# Global variables:
#   bmw_openshift_jobs/global_variables/credentials.yaml
#   bmw_openshift_jobs/global_variables/openshift_inventory_vars.yaml
#
# Required extra_vars (v2 - per-cluster bastion):
#   terminal_host: GBAOCP01              # legacy scalar (= terminal_hosts[0]); still accepted alone
#   terminal_hosts: [GBAOCP01, GBAOCP02] # optional; unique, sorted list of bastions
#   namespace: application-namespace
#   app_name: application-name-fragment
#   ocp_clusters:
#     - env: lab
#       tenant: ark
#       cluster_name: gbocplab2
#       terminal_host: GBAOCP01          # optional; when absent the scalar terminal_host is used
#   staging_dir: /target/staging/path
#   fallback_dir: /tmp/logx_fallback
#   archive_name: logx_ocp_logs.zip      # with >1 bastion each host prefixes it with its own name
#
# Backward compatibility: with a single bastion and no per-cluster terminal_host the
# behaviour AND the archive name are identical to the previous version.
#
# Output:
#   artifacts.logx_result — legacy scalar fields kept (first archive) plus
#   `staged_files[]` carrying every produced archive (one per bastion).

- name: "Validate input and add terminal hosts dynamically"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    oc_namespace: "{{ oc_namespace_input | default(namespace | default('')) }}"
    # Etkin bastion listesi: acik liste > legacy skaler > cluster-basina degerler.
    logx_bastions: >-
      {{
        (terminal_hosts | default([]) | union([terminal_host | default('')]))
        | union(ocp_clusters | default([]) | selectattr('terminal_host', 'defined')
                                          | map(attribute='terminal_host') | list)
        | map('trim') | reject('equalto', '') | unique | sort | list
      }}

  tasks:
    - name: "Validate required input variables"
      ansible.builtin.assert:
        that:
          - logx_bastions | length > 0
          - oc_namespace | string | trim | length > 0
          - app_name is defined
          - app_name | string | trim | length > 0
          - ocp_clusters is defined
          - ocp_clusters is sequence
          - ocp_clusters | length > 0
          - staging_dir is defined
          - staging_dir | string | trim | length > 0
          - fallback_dir is defined
          - fallback_dir | string | trim | length > 0
          - archive_name is defined
          - archive_name | string | trim | length > 0
          - archive_name is match('^[A-Za-z0-9._-]+\\.zip$')
        fail_msg: "Required variables are missing or archive_name is invalid."

    - name: "Add every bastion to dynamic inventory"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: logx_terminal
        oc_namespace: "{{ oc_namespace }}"
        # Birden fazla bastion varsa her biri KENDI arsivini uretir; ayni staging
        # dizinine yazildiklari icin dosya adlari benzersizlestirilir. Tek bastion'da
        # ad DEGISMEZ → mevcut davranisla birebir uyum.
        logx_archive_name: >-
          {{ archive_name if (logx_bastions | length) == 1
             else (item | lower | regex_replace('[^a-z0-9._-]', '-')) ~ '__' ~ archive_name }}
      loop: "{{ logx_bastions }}"
      changed_when: false


- name: "LogX v2 - Discover pods and collect OCP logs"
  hosts: logx_terminal
  # Bir bastion cokse bile digerleri devam etsin (varsayilan deger; niyet acik olsun diye yazili).
  any_errors_fatal: false
  gather_facts: false
  become: false

  vars_files:
    - ../../bmw_openshift_jobs/global_variables/credentials.yaml
    - ../../bmw_openshift_jobs/global_variables/openshift_inventory_vars.yaml

  vars:
    # oc'nin yolu SABIT DEGIL — bkz. logx_ocp_namespace_discovery.yml'deki ayni desen.
    # Sirasiyla: extra_vars `oc_binary` override'i > aday yollar > PATH (command -v oc).
    oc_binary: ""
    # /bin/oc ILK: kurumsal bastion'larda oc gercekte burada. (Uretimde
    # /usr/local/bin/oc varsayimi TUM bastion'larin ayni anda dusmesine yol acmisti.)
    oc_binary_candidates:
      - /bin/oc
      - /usr/local/bin/oc
      - /usr/bin/oc
    oc_probe_paths: >-
      {{
        (([oc_binary] if (oc_binary | default('') | trim | length > 0) else [])
         + (oc_binary_candidates | default([]))) | unique | list
      }}
    logx_job_id: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    # inventory_hostname DAHIL: iki farkli bastion adi ayni makineye cozulurse (or.
    # GBAOCP01 ve gbaocp01.bmw.com) ayni dizini paylasip birbirinin arsivini silerlerdi.
    remote_host_slug: "{{ inventory_hostname | lower | regex_replace('[^a-z0-9._-]', '-') }}"
    remote_work_dir: "/tmp/logx_v2_ocp_fetch_{{ logx_job_id }}_{{ remote_host_slug }}"
    remote_archive_path: "/tmp/logx_v2_ocp_fetch_{{ logx_job_id }}_{{ remote_host_slug }}.zip"
    oc_list_timeout: 120
    oc_log_timeout: 300
    staging_runas_user: "{{ staging_user | default('was', true) }}"
    staging_directory_mode: "2777"
    staged_archive_mode: "0666"

  tasks:
    - name: "Initialize working facts"
      ansible.builtin.set_fact:
        resolved_clusters: []
        validation_errors: []
        cluster_pod_matches: []
        pod_fetch_targets: []
        cluster_fetch_results: []
      changed_when: false

    # Cok-bastion: her bastion YALNIZ kendi cluster'larini toplar. Cluster ogelerinde
    # terminal_host yoksa (eski payload) tum liste tek bastion'da islenir; kismi tanimli
    # payload'da sahipsizler ilk (alfabetik) bastion'a dusurulur — sessiz kayip olmaz.
    - name: "Select the cluster subset that belongs to this bastion"
      ansible.builtin.set_fact:
        my_ocp_clusters: >-
          {{
            (ocp_clusters | selectattr('terminal_host', 'defined')
                          | selectattr('terminal_host', 'equalto', inventory_hostname) | list)
            +
            ((ocp_clusters | rejectattr('terminal_host', 'defined') | list)
             if inventory_hostname == ((groups['logx_terminal'] | default([])) | sort | first)
             else [])
          }}
      changed_when: false

    - name: "Validate requested cluster records"
      ansible.builtin.set_fact:
        validation_errors: >-
          {{
            validation_errors + ([{
              'cluster_name': item.cluster_name | default('unknown'),
              'status': 'error',
              'error': 'Cluster inventory record not found: ' ~
                       (item.tenant | default('missing-tenant')) ~ '_' ~
                       (item.env | default('missing-env')) ~ '/' ~
                       (item.cluster_name | default('missing-cluster-name')),
              'pods_matched': [],
              'pods_failed': []
            }] if not cluster_exists else [])
          }}
      vars:
        inventory_key: "{{ item.tenant | default('') }}_{{ item.env | default('') }}"
        cluster_exists: >-
          {{
            item.tenant is defined and
            item.env is defined and
            item.cluster_name is defined and
            clusters[inventory_key] is defined and
            clusters[inventory_key][item.cluster_name] is defined and
            clusters[inventory_key][item.cluster_name].url is defined and
            clusters[inventory_key][item.cluster_name].password is defined
          }}
      loop: "{{ my_ocp_clusters }}"
      loop_control:
        label: "{{ item.cluster_name | default('?') }}"
      no_log: true
      changed_when: false

    # HATA IZOLASYONU: bu bastion'a ait tum is block icinde. Herhangi bir adim coker
    # (or. oc bulunamadi, SSH/login hatasi) rescue devreye girer, YALNIZ bu bastion'in
    # cluster'lari hata olarak isaretlenir ve host FAIL sayilmaz. Boylece hem diger
    # bastion'lar hem de toplayici play (set_stats yazari) calismaya devam eder.
    - name: "Collect this bastion's clusters (failure-isolated)"
      # ignore_unreachable SART: rescue yalnizca GOREV hatalarini yakalar, SSH/DNS kesintisini
      # (unreachable) YAKALAMAZ. O durumda host "unreachable" isaretlenir, tum bastion'lar
      # boyle duserse Ansible "NO MORE HOSTS LEFT" ile sonraki play'leri ATLAR ve toplayici
      # play (tek set_stats yazari) yine calismaz — yani orijinal uretim hatasi tekrarlanir.
      # Bununla host unreachable olsa bile play akisi surer ve toplayici play, o bastion'in
      # cluster'larini "Bastion did not report a result" olarak isaretler.
      ignore_unreachable: true
      block:
        - name: "Resolve valid cluster connection records"
          ansible.builtin.set_fact:
            resolved_clusters: >-
              {{
                resolved_clusters + ([{
                  'cluster_name': item.cluster_name,
                  'env': item.env,
                  'tenant': item.tenant,
                  'inventory_key': inventory_key,
                  'url': clusters[inventory_key][item.cluster_name].url,
                  'password': clusters[inventory_key][item.cluster_name].password
                }] if cluster_exists else [])
              }}
          vars:
            inventory_key: "{{ item.tenant | default('') }}_{{ item.env | default('') }}"
            cluster_exists: >-
              {{
                item.tenant is defined and
                item.env is defined and
                item.cluster_name is defined and
                clusters[inventory_key] is defined and
                clusters[inventory_key][item.cluster_name] is defined and
                clusters[inventory_key][item.cluster_name].url is defined and
                clusters[inventory_key][item.cluster_name].password is defined
              }}
          loop: "{{ my_ocp_clusters }}"
          loop_control:
            label: "{{ item.cluster_name | default('?') }}"
          no_log: true
          changed_when: false

        # ── oc kesfi (namespace_discovery.yml ile AYNI desen) ────────────────────
        - name: "Probe candidate oc paths"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ oc_probe_paths }}"
          register: oc_stats
          changed_when: false
          # Bir aday yolun stat izni yoksa TUM bastion dusmesin — karar tek noktada
          # (asagidaki oc_bin bos mu) verilir.
          failed_when: false

        - name: "Collect usable oc paths"
          ansible.builtin.set_fact:
            oc_stat_hits: >-
              {{
                oc_stats.results | default([])
                | selectattr('stat', 'defined')
                | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                | selectattr('stat.executable', 'defined') | selectattr('stat.executable')
                | map(attribute='stat.path') | list
              }}
          changed_when: false

        - name: "Fall back to PATH lookup when no candidate matched"
          ansible.builtin.shell: command -v oc || true
          args:
            executable: /bin/bash
          register: oc_which
          when: oc_stat_hits | length == 0
          changed_when: false
          failed_when: false

        - name: "Resolve the oc binary for this bastion"
          ansible.builtin.set_fact:
            oc_bin: >-
              {{
                oc_stat_hits[0] if (oc_stat_hits | length > 0)
                else (oc_which.stdout | default('', true) | trim)
              }}
          changed_when: false

        - name: "Fail when no usable oc binary was found"
          ansible.builtin.fail:
            msg: >-
              Bu sunucuda 'oc' bulunamadi. Denenen yollar: {{ oc_probe_paths | join(', ') }};
              PATH aramasi (command -v oc) da sonucsuz kaldi.
          when: oc_bin | length == 0

        - name: "Reset remote working directory"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ remote_work_dir }}"
            - "{{ remote_archive_path }}"
          changed_when: false

        - name: "Create remote working directory"
          ansible.builtin.file:
            path: "{{ remote_work_dir }}"
            state: directory
            mode: '0700'
          changed_when: false

        - name: "Login and list namespace pods in parallel"
          ansible.builtin.shell: |
            set -o pipefail
            umask 077

            export KUBECONFIG="/tmp/logx-pods-{{ logx_job_id }}-{{ cluster.cluster_name }}.kubeconfig"

            cleanup() {
              rm -f "${KUBECONFIG}"
            }
            trap cleanup EXIT

            "{{ oc_bin }}" login \
              --server={{ cluster.url | quote }} \
              --username={{ username | quote }} \
              --password={{ cluster.password | quote }} \
              --insecure-skip-tls-verify=true \
              >/dev/null

            "{{ oc_bin }}" get pods \
              --namespace={{ oc_namespace | quote }} \
              --output=name
          args:
            executable: /bin/bash
          loop: "{{ resolved_clusters }}"
          loop_control:
            loop_var: cluster
            label: "{{ cluster.cluster_name }}"
          register: pod_list_jobs
          async: "{{ oc_list_timeout }}"
          poll: 0
          changed_when: false
          no_log: true

        - name: "Wait for pod listing jobs"
          ansible.builtin.async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ pod_list_jobs.results | default([]) }}"
          loop_control:
            label: "{{ item.cluster.cluster_name }}"
          register: pod_list_wait
          until: pod_list_wait.finished
          retries: 120
          delay: 1
          ignore_errors: true
          changed_when: false
          no_log: true

        - name: "Filter pod names in memory"
          ansible.builtin.set_fact:
            cluster_pod_matches: >-
              {{
                cluster_pod_matches + [{
                  'cluster_name': item.item.cluster.cluster_name,
                  'url': item.item.cluster.url,
                  'password': item.item.cluster.password,
                  'list_status': 'error' if (item.failed | default(false) or (item.rc | default(0) | int != 0)) else 'ok',
                  'list_error': (
                    item.stderr | default(item.msg | default('Unknown OpenShift error'), true)
                  ) if (item.failed | default(false) or (item.rc | default(0) | int != 0)) else '',
                  'pods': (
                    item.stdout_lines | default([])
                    | map('regex_replace', '^pod/', '')
                    | select('search', app_name | regex_escape)
                    | list
                  ) if not (item.failed | default(false) or (item.rc | default(0) | int != 0)) else []
                }]
              }}
          loop: "{{ pod_list_wait.results | default([]) }}"
          loop_control:
            label: "{{ item.item.cluster.cluster_name }}"
          no_log: true
          changed_when: false

        - name: "Build pod log fetch targets"
          ansible.builtin.set_fact:
            pod_fetch_targets: >-
              {{
                pod_fetch_targets + (
                  item.pods
                  | map('community.general.dict_kv', 'pod')
                  | map('combine', {
                      'cluster_name': item.cluster_name,
                      'url': item.url,
                      'password': item.password
                    })
                  | list
                )
              }}
          loop: "{{ cluster_pod_matches }}"
          loop_control:
            label: "{{ item.cluster_name }}"
          when:
            - item.list_status == 'ok'
            - item.pods | length > 0
          no_log: true
          changed_when: false

        - name: "Login and collect each pod log in parallel"
          ansible.builtin.shell: |
            set -o pipefail
            umask 077

            export KUBECONFIG="/tmp/logx-logs-{{ logx_job_id }}-{{ target.cluster_name }}-{{ target.pod }}.kubeconfig"
            output_file={{ (remote_work_dir ~ '/' ~ target.cluster_name ~ '__' ~ target.pod ~ '.log') | quote }}

            cleanup() {
              rm -f "${KUBECONFIG}"
            }
            trap cleanup EXIT

            "{{ oc_bin }}" login \
              --server={{ target.url | quote }} \
              --username={{ username | quote }} \
              --password={{ target.password | quote }} \
              --insecure-skip-tls-verify=true \
              >/dev/null

            "{{ oc_bin }}" logs \
              --namespace={{ oc_namespace | quote }} \
              {{ target.pod | quote }} \
              > "${output_file}"
          args:
            executable: /bin/bash
          loop: "{{ pod_fetch_targets }}"
          loop_control:
            loop_var: target
            label: "{{ target.cluster_name }}/{{ target.pod }}"
          register: log_fetch_jobs
          async: "{{ oc_log_timeout }}"
          poll: 0
          changed_when: false
          no_log: true

        - name: "Wait for pod log collection jobs"
          ansible.builtin.async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ log_fetch_jobs.results | default([]) }}"
          loop_control:
            label: "{{ item.target.cluster_name }}/{{ item.target.pod }}"
          register: log_fetch_wait
          until: log_fetch_wait.finished
          retries: 300
          delay: 1
          ignore_errors: true
          changed_when: false
          no_log: true

        - name: "Build per-cluster collection results"
          ansible.builtin.set_fact:
            cluster_fetch_results: >-
              {{
                cluster_fetch_results + [{
                  'cluster_name': cluster_item.cluster_name,
                  'status': cluster_status,
                  'error': cluster_error,
                  'pods_matched': cluster_item.pods,
                  'pods_failed': failed_pods
                }]
              }}
          vars:
            fetch_results_for_cluster: >-
              {{
                log_fetch_wait.results | default([])
                | selectattr('item.target.cluster_name', 'equalto', cluster_item.cluster_name)
                | list
              }}
            failed_pods: >-
              {{
                fetch_results_for_cluster
                | selectattr('failed', 'defined')
                | selectattr('failed', 'equalto', true)
                | map(attribute='item.target.pod')
                | map('community.general.dict_kv', 'pod')
                | list
              }}
            cluster_status: >-
              {{
                'error' if cluster_item.list_status == 'error'
                else ('no_match' if cluster_item.pods | length == 0
                else ('partial' if failed_pods | length > 0 else 'ok'))
              }}
            cluster_error: "{{ cluster_item.list_error if cluster_item.list_status == 'error' else '' }}"
          loop: "{{ cluster_pod_matches }}"
          loop_control:
            loop_var: cluster_item
            label: "{{ cluster_item.cluster_name }}"
          no_log: true
          changed_when: false

        - name: "Append cluster validation errors"
          ansible.builtin.set_fact:
            cluster_fetch_results: "{{ cluster_fetch_results + validation_errors }}"
          changed_when: false

        - name: "Count collected log files"
          ansible.builtin.find:
            paths: "{{ remote_work_dir }}"
            patterns: '*.log'
            file_type: file
          register: collected_log_files
          changed_when: false

        - name: "Create archive on terminal host"
          community.general.archive:
            path: "{{ remote_work_dir }}/*.log"
            dest: "{{ remote_archive_path }}"
            format: zip
            mode: '0600'
          register: remote_archive
          when: collected_log_files.matched | int > 0
          changed_when: false

        - name: "Verify archive exists on terminal host"
          ansible.builtin.stat:
            path: "{{ remote_archive_path }}"
          register: remote_archive_stat
          when: collected_log_files.matched | int > 0
          changed_when: false

        - name: "Fail when archive creation did not produce a file"
          ansible.builtin.assert:
            that:
              - remote_archive_stat.stat.exists | default(false)
              - remote_archive_stat.stat.isreg | default(false)
              - remote_archive_stat.stat.size | default(0) | int > 0
            fail_msg: "Archive was not created at {{ remote_archive_path }}"
          when: collected_log_files.matched | int > 0

        - name: "Initialize staging result facts"
          ansible.builtin.set_fact:
            staging_succeeded: false
            fallback_succeeded: false
            staged_archive_path: ""
            staging_error: ""
          changed_when: false

        - name: "Validate staging paths and run-as user"
          ansible.builtin.assert:
            that:
              - staging_dir | string | trim | length > 1
              - staging_dir is match('^/')
              - fallback_dir | string | trim | length > 1
              - fallback_dir is match('^/')
              - staging_runas_user | string | trim | length > 0
              - staging_directory_mode == '2777'
              - staged_archive_mode == '0666'
            fail_msg: >-
              Invalid staging settings. staging_dir={{ staging_dir }},
              fallback_dir={{ fallback_dir }}, runas={{ staging_runas_user }}

        - name: "Stage archive directly on terminal host"
          when: collected_log_files.matched | int > 0
          block:
            - name: "Create and authorize staging directory through allowed dzdo user"
              ansible.builtin.command:
                argv:
                  - dzdo
                  - -n
                  - -u
                  - "{{ staging_runas_user }}"
                  - /bin/sh
                  - -c
                  - >-
                    umask 000;
                    /bin/mkdir -p -- {{ staging_dir | quote }} &&
                    /bin/chmod {{ staging_directory_mode | quote }} -- {{ staging_dir | quote }}
              register: staging_directory_prepare
              changed_when: false

            - name: "Verify staging directory permissions"
              ansible.builtin.stat:
                path: "{{ staging_dir }}"
              register: staging_directory_stat
              changed_when: false

            - name: "Validate staging directory"
              ansible.builtin.assert:
                that:
                  - staging_directory_stat.stat.exists | default(false)
                  - staging_directory_stat.stat.isdir | default(false)
                  - staging_directory_stat.stat.mode | default('') == staging_directory_mode
                  - staging_directory_stat.stat.writeable | default(false)
                fail_msg: >-
                  Staging directory is unavailable or not writable.
                  path={{ staging_dir }},
                  owner={{ staging_directory_stat.stat.pw_name | default('unknown') }},
                  group={{ staging_directory_stat.stat.gr_name | default('unknown') }},
                  mode={{ staging_directory_stat.stat.mode | default('unknown') }}

            - name: "Copy archive to staging directory as SSH user"
              ansible.builtin.copy:
                src: "{{ remote_archive_path }}"
                dest: "{{ staging_dir }}/{{ logx_archive_name }}"
                remote_src: true
                mode: "{{ staged_archive_mode }}"
              register: staging_copy_result

            - name: "Verify primary staged archive"
              ansible.builtin.stat:
                path: "{{ staging_dir }}/{{ logx_archive_name }}"
                get_checksum: true
                checksum_algorithm: sha256
              register: primary_staged_archive_stat
              changed_when: false

            - name: "Validate primary staged archive"
              ansible.builtin.assert:
                that:
                  - primary_staged_archive_stat.stat.exists | default(false)
                  - primary_staged_archive_stat.stat.isreg | default(false)
                  - primary_staged_archive_stat.stat.size | default(0) | int > 0
                fail_msg: "Archive copy to primary staging failed: {{ staging_dir }}/{{ logx_archive_name }}"

            - name: "Mark staging as successful"
              ansible.builtin.set_fact:
                staging_succeeded: true
                staged_archive_path: "{{ staging_dir }}/{{ logx_archive_name }}"
              changed_when: false

          rescue:
            - name: "Record staging failure"
              ansible.builtin.set_fact:
                staging_error: >-
                  {{
                    ansible_failed_result.stderr
                    | default(ansible_failed_result.msg, true)
                    | default('Unknown staging error', true)
                  }}
              changed_when: false

            - name: "Ensure fallback directory exists on terminal host"
              ansible.builtin.file:
                path: "{{ fallback_dir }}"
                state: directory
                mode: '0777'
              changed_when: false

            - name: "Copy archive to fallback directory on terminal host"
              ansible.builtin.copy:
                src: "{{ remote_archive_path }}"
                dest: "{{ fallback_dir }}/{{ logx_archive_name }}"
                remote_src: true
                mode: "{{ staged_archive_mode }}"
              register: fallback_copy_result

            - name: "Mark fallback as successful"
              ansible.builtin.set_fact:
                fallback_succeeded: true
                staged_archive_path: "{{ fallback_dir }}/{{ logx_archive_name }}"
              changed_when: false

        - name: "Read staged archive metadata on terminal host"
          ansible.builtin.stat:
            path: "{{ staged_archive_path }}"
          register: staged_archive_stat
          when:
            - collected_log_files.matched | int > 0
            - staged_archive_path | length > 0
          changed_when: false

        # Bu bastion'un ozeti host fact olarak birakilir; TEK set_stats yazari asagidaki
        # toplayici play'dir (birden cok host ayni anahtari yazarsa Ansible listeleri
        # birlestirmez, sonuncu yazan ezer).
        # NOT: cluster sonuclari `cluster_fetch_results` fact'inde kalir; bu ozet YALNIZ arsiv
        # meta'sini tasir (staged_files[] icine bu gider — artifact gereksiz sismesin).
        # Bool alanlar `| bool` ile GERCEK boolean'a zorlanir: string "False" truthy olurdu.
        - name: "Record this bastion's archive summary as a host fact"
          ansible.builtin.set_fact:
            logx_bastion_summary:
              terminal_host: "{{ inventory_hostname }}"
              staged_path: "{{ staged_archive_path }}"
              filename: "{{ logx_archive_name if collected_log_files.matched | int > 0 else '' }}"
              size_bytes: "{{ staged_archive_stat.stat.size | default(0) | int }}"
              is_fallback: "{{ fallback_succeeded | bool }}"
              staging_error: "{{ staging_error }}"
              archive_created: "{{ (collected_log_files.matched | int > 0) | bool }}"
              staged_ok: "{{ ((collected_log_files.matched | int > 0) and (staged_archive_stat.stat.exists | default(false))) | bool }}"
          changed_when: false

        - name: "Clean remote temporary files"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ remote_work_dir }}"
            - "{{ remote_archive_path }}"
          when: staged_archive_stat.stat.exists | default(false)
          changed_when: false

      rescue:
        - name: "Record the bastion-level failure"
          ansible.builtin.set_fact:
            bastion_error: >-
              {{
                ansible_failed_result.msg
                | default(ansible_failed_result.stderr | default('Bilinmeyen bastion hatasi', true), true)
              }}
          changed_when: false

        # Katalog dogrulama hatalari block DISINDA uretilmisti; block coktugu icin
        # "Append ..." gorevi calismadi — burada eklenir ki kaybolmasinlar.
        - name: "Keep validation errors even when the bastion failed"
          ansible.builtin.set_fact:
            cluster_fetch_results: "{{ cluster_fetch_results + (validation_errors | default([])) }}"
          changed_when: false

        - name: "Mark this bastion's unfinished clusters as failed"
          ansible.builtin.set_fact:
            cluster_fetch_results: >-
              {{
                cluster_fetch_results + [{
                  'cluster_name': item.cluster_name | default('unknown'),
                  'status': 'error',
                  'error': bastion_error,
                  'pods_matched': [],
                  'pods_failed': []
                }]
              }}
          loop: "{{ my_ocp_clusters | default([]) }}"
          loop_control:
            label: "{{ item.cluster_name | default('?') }}"
          when: >-
            (item.cluster_name | default('')) not in
            (cluster_fetch_results | default([]) | map(attribute='cluster_name') | list)
          changed_when: false

        # SESSIZ HATA ONLEME: cluster sonuclari uretildikten SONRA cokuldugunde (or. arsiv
        # olusturma assert'i veya staging fallback'inin de dusmesi) yukaridaki `when` filtresi
        # her cluster'i eler ('ok' durumdalar) ve ozet fact'i HIC yazilmazdi. Bu durumda
        # toplayici play "cluster'lar ok ama arsiv yok, sebep bos" gibi anlasilmaz bir sonuc
        # uretiyordu. Ozeti burada da yazariz — hata sebebi staging_error uzerinden tasinir.
        - name: "Record a failure summary so the aggregator can explain the missing archive"
          ansible.builtin.set_fact:
            logx_bastion_summary:
              terminal_host: "{{ inventory_hostname }}"
              staged_path: ""
              filename: ""
              size_bytes: 0
              is_fallback: false
              staging_error: "{{ bastion_error }}"
              archive_created: false
              staged_ok: false
          when: logx_bastion_summary is not defined
          changed_when: false


# Tek yazar: tum bastion'larin ozetlerini birlestirip logx_result'i yayinlar. Cikti sekli
# tek-bastion'daki ile UYUMLUDUR — eski tekil alanlar (terminal_host/staged_path/filename/
# size_bytes/is_fallback) ILK arsivi gosterir, yeni `staged_files[]` hepsini tasir.
- name: "Aggregate per-bastion results and publish a single logx_result"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # Yalnizca RAPOR VEREN bastion'larin arsiv meta'si (cluster sonuclari ayri fact'te:
    # cluster_fetch_results — boylece staged_files gereksiz sismez).
    bastion_summaries: >-
      {{
        (groups['logx_terminal'] | default([]) | sort)
        | map('extract', hostvars, 'logx_bastion_summary')
        | select('defined') | list
      }}
    staged_files: >-
      {{ bastion_summaries | selectattr('staged_path', 'defined')
                           | rejectattr('staged_path', 'equalto', '') | list }}

  tasks:
    # Ek sigorta: block/rescue sayesinde hicbir host FAIL olmamali; yine de
    # ileride play2ye korumasiz bir gorev eklenirse bu play calismaya devam etsin.
    - name: "Clear any host errors so aggregation always runs"
      ansible.builtin.meta: clear_host_errors

    - name: "Initialize merged cluster list"
      ansible.builtin.set_fact:
        merged_clusters: []
      changed_when: false

    # KRITIK: raporlamayan (erisilemez / play2'de erken dusen) bastion'in cluster'lari
    # SESSIZCE KAYBOLMAMALI — aksi halde overall_status 'success' cikar ve kullanici
    # eksik arsivi tam sanardi. Istenen HER cluster icin sahibinden sonuc aranir.
    - name: "Collect each requested cluster's result from its own bastion"
      ansible.builtin.set_fact:
        merged_clusters: >-
          {{
            merged_clusters + (reported if (reported | length > 0) else [{
              'cluster_name': item.cluster_name | default('unknown'),
              'status': 'error',
              'error': 'Bastion did not report a result (unreachable or failed early): ' ~ owner_host,
              'pods_matched': [],
              'pods_failed': []
            }])
          }}
      vars:
        # Sahipsiz cluster'in sahibi play2 ile AYNI kuralla belirlenir (ilk alfabetik bastion).
        owner_host: "{{ item.terminal_host | default((groups['logx_terminal'] | default([]) | sort | first), true) }}"
        host_results: "{{ (hostvars[owner_host] | default({}, true)).cluster_fetch_results | default([], true) }}"
        reported: "{{ host_results | selectattr('cluster_name', 'equalto', item.cluster_name | default('')) | list }}"
      loop: "{{ ocp_clusters }}"
      loop_control:
        label: "{{ item.cluster_name | default('?') }}"
      changed_when: false

    - name: "Publish final LogX result"
      ansible.builtin.set_stats:
        data:
          logx_result:
            overall_status: >-
              {% set ok_count = merged_clusters | selectattr('status', 'equalto', 'ok') | list | length %}
              {% set partial_count = merged_clusters | selectattr('status', 'equalto', 'partial') | list | length %}
              {% set error_count = merged_clusters | selectattr('status', 'equalto', 'error') | list | length %}
              {% set no_match_count = merged_clusters | selectattr('status', 'equalto', 'no_match') | list | length %}
              {% set archive_created = staged_files | length > 0 %}
              {% set staged_ok = bastion_summaries | selectattr('staged_ok') | list | length > 0 %}
              {{
                'failed' if error_count > 0 and ok_count == 0 and partial_count == 0
                else ('no_match' if not archive_created and no_match_count > 0 and error_count == 0
                else ('success' if staged_ok and error_count == 0 and partial_count == 0
                else ('partial' if staged_ok else 'failed')))
              }}
            clusters: "{{ merged_clusters }}"
            terminal_host: "{{ (staged_files | map(attribute='terminal_host') | list | first) | default('', true) }}"
            staged_path: "{{ (staged_files | map(attribute='staged_path') | list | first) | default('', true) }}"
            filename: "{{ (staged_files | map(attribute='filename') | list | first) | default('', true) }}"
            size_bytes: "{{ (staged_files | map(attribute='size_bytes') | list | first) | default(0, true) }}"
            is_fallback: "{{ (staged_files | map(attribute='is_fallback') | list | first) | default(false, true) }}"
            staging_error: "{{ bastion_summaries | map(attribute='staging_error') | select() | list | join(' | ') }}"
            staged_files: "{{ staged_files }}"
        per_host: false
