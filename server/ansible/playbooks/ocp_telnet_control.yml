---
# ocp_telnet_control.yml — Telnet OCP testi (REFERANS PLAYBOOK).
#
# ÖNEMLİ: Bu dosya YALNIZCA REFERANS'tır — portal bunu ÇALIŞTIRMAZ. Gerçek playbook
# `bmw_openshift_jobs/ocp_telnet_control.yml` yolunda, AYRI bir Ansible projesinde deploy
# edilir. AWX'e kopyalanacak metin budur (repo'daki `logx_*.yml` ile aynı konvansiyon).
#
# ── YAPI: LOGX MODELİ (2026-08-12 kullanıcı kararı) ────────────────────────────────────
# Hedef host'lar JUMP SERVER'lardır; cluster'lar VERİ olarak gelir. Portal
# `terminal_hosts[]` (bastion adları) ve `ocp_clusters[]` (cluster başına `terminal_host` +
# `api_url` + `credential_key`) gönderir; ilk play bunları `add_host` ile dinamik gruba atar,
# ikinci play her bastion'da YALNIZCA o bastion'a ait cluster'lara `oc login` yapar. Bu,
# `logx_ocp_discover_fetch.yml`'de üretimde kanıtlanmış desenin birebir aynısıdır.
#
# ÖNCEKİ YAPI VE NEDEN BIRAKILDI: playbook `hosts: "{{ cluster }}_{{ env }}"` ile envanter
# grubunu (ör. ark_qa) hedefliyordu. Cluster → jump server eşlemesi AWX envanterinin İÇİNDE
# gizliydi (envanterde `gbocpqa1` hem GRUP hem HOST olarak tanımlı — Ansible bunu uyarı
# olarak basıyor) ve portalın DB'sindeki `ocp_cluster_index.terminal_host` kaydı hiç
# kullanılmıyordu. Artık eşlemenin tek kaynağı portal.
#
# ── ÜRETİMDE NE DÜŞTÜ (job 3218662) ────────────────────────────────────────────────────
# 1) `'target_host' is undefined` — playbook hedefi `target_host`/`target_port` adlarıyla
#    okuyordu, portal `ip`/`port` gönderiyordu. Üç host da telnet komutunu hiç çalıştıramadı.
#    → Hedef her iki addan da türetiliyor; portal da ikisini birden gönderiyor.
# 2) `gbocptest4` ilk adımda düştü ama görevde `no_log: true` olduğu için SEBEP görünmedi.
#    Aynı hesapla eş zamanlı koşan başka bir job'ın log'unda sebep yazıyor:
#      error loading config file "/home/uxmid/.kube/config": yaml: line 12: ...
#    Eş zamanlı `oc login`'ler ORTAK kubeconfig'i bozuyor.
#    → (a) her birim KENDİ geçici KUBECONFIG'ini kullanır, (b) login ile pod oluşturma AYRI
#      görevlerdir; `no_log` yalnız parolayı taşıyan login'de kalır, pod hatası okunabilir.
# 3) Geçici pod, akış ortada düşerse cluster'da KALIYORDU → `block/always` ile her durumda
#    temizlenir.
# 4) `namespace`/`port` Ansible'da REZERVE adlar → yerel fact'lere kopyalanır.
# 5) Pod adı sabit `telnet-test` idi; eş zamanlı iki test birbirinin pod'unu siliyordu →
#    ada AWX job numarası eklendi.
#
# ── PORTALIN GÖNDERDİĞİ extra_vars ─────────────────────────────────────────────────────
#   terminal_hosts : ["GBARKAP82", ...]           ← jump server'lar (hedef host'lar)
#   ocp_clusters   : [{ cluster_name, terminal_host, api_url, credential_key }, ...]
#   namespaces     : hedef namespace LİSTESİ (ÇOĞUL — bkz. aşağıdaki not)
#   ip / port      : telnet hedefi (target_host / target_port ile AYNI değerler)
#   env / cluster  : geriye uyum (eski playbook grubu bunlardan kuruyordu)
#
# ── ÇOĞUL `namespaces` (2026-08-28 senkronu) ───────────────────────────────────────────
# Portal 2026-08-20'den beri `namespaces` (DİZİ) gönderiyor ve tek job'da (cluster ×
# namespace) çapraz çarpımını playbook'un kurmasını bekliyor. Repo'daki bu kopya ise hâlâ
# TEKİL `namespace` assert ediyordu; commit 9ee0699 "Ansible tarafı ayrıca teslim edildi"
# diyor ama repo kopyası güncellenmemiş. Dosya başlığı "AWX'e kopyalanacak metin budur"
# dediği için bu hâliyle kopyalayan Telnet'i KIRARDI. Artık çoğul; tekil `namespace` yalnız
# GERİYE UYUM için kabul edilir.
#
# ── SONUÇ SÖZLEŞMESİ: `telnet_result` (2026-08-28) ─────────────────────────────────────
# Playbook AÇIK/KAPALI satırlarını yalnızca `debug` mesajı olarak üretiyordu; portal bunları
# HİÇ okumuyordu (backend `artifacts`i eline alıp atıyordu). Sonuç: tüm portlar KAPALI olsa
# bile job `successful` döndüğü için ekranda YEŞİL TİK çıkıyordu — aktif olarak yanıltıcı.
# Artık LogX'in `logx_result` deseniyle birebir aynı şekilde `set_stats` ile yayınlanır:
#   telnet_result:
#     overall_status : open | partial | closed | error
#     target         : { host, port }
#     targets: [ { cluster, bastion, namespace, ip, port,
#                  state: open|closed|error, rc, detail } ]
#
# PAROLA: extra_vars'ta ASLA taşınmaz. `credential_key` yalnızca vault değişkeninin ADIdır;
# değeri `credentials.yaml` (vault) içinden `lookup('vars', ...)` ile çözülür — LogX ile aynı.

- name: "--- [Play] OpenShift Telnet Test - Prepare & Validate ---"
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: "--- [Task] Validate required input ---"
      ansible.builtin.assert:
        that:
          - terminal_hosts is defined
          - terminal_hosts | length > 0
          - ocp_clusters is defined
          - ocp_clusters | length > 0
          # ÇOĞUL birincil, TEKİL geriye uyum. İkisi de yoksa hata.
          - (namespaces | default(namespace | default('') | ternary([namespace | default('')], []))) | length > 0
        fail_msg: >-
          Zorunlu değişkenler eksik → bastion: {{ terminal_hosts | default([]) | length }},
          cluster: {{ ocp_clusters | default([]) | length }},
          namespace(ler): {{ namespaces | default([namespace | default('(yok)')]) }}.
          Tümü boşsa AWX job template'inde "Prompt on launch" (Variables) kapalı olabilir.

    - name: "--- [Task] Add every jump server to dynamic inventory ---"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: telnet_terminal
      loop: "{{ terminal_hosts }}"
      changed_when: false

    - name: "--- [Task] Debug resolved targets ---"
      ansible.builtin.debug:
        msg: >-
          Jump server'lar: {{ terminal_hosts }} |
          cluster'lar: {{ ocp_clusters | map(attribute='cluster_name') | list }}

- name: "--- [Play] OpenShift Telnet Test ---"
  hosts: telnet_terminal
  # Bir bastion çökse bile diğerleri devam etsin (varsayılan; niyet açık olsun diye yazılı).
  any_errors_fatal: false
  gather_facts: false
  become: false

  vars_files:
    # Parolalar (vault) BURADAN gelir; portal yalnızca anahtarın ADINI taşır.
    - ./global_variables/credentials.yaml
    # OPSİYONEL: portal `api_url`i extra_vars ile gönderiyor. Dosya ileride kaldırılırsa
    # playbook ÇALIŞMAYA DEVAM EDER; yalnızca metadata göndermeyen eski çağrılar için durur.
    - "{{ lookup('first_found', ['./global_variables/openshift_inventory_vars.yaml'], errors='ignore') | default('/dev/null', true) }}"

  vars:
    # REZERVE ADLARDAN KAÇIN: `namespace` ve `port` Ansible'ın kendi ad alanında; doğrudan
    # kullanmak "Found variable using reserved name" uyarısı üretir ve sessiz çakışmaya açıktır.
    # ÇOĞUL birincil; tekil `namespace` yalnız geriye uyum için. Boş/yinelenen adlar düşer.
    ns_list: >-
      {{ (namespaces | default([namespace | default('')]))
         | map('string') | map('trim') | select('!=', '') | unique | list }}
    telnet_host: "{{ target_host | default(ip) }}"
    telnet_port: "{{ target_port | default(port) }}"
    image: nicolaka/netshoot
    job_tag: "{{ tower_job_id | default('local') }}"

  tasks:
    - name: "--- [Task] Select the cluster subset that belongs to this jump server ---"
      # Her bastion YALNIZCA kendi cluster'larına bağlanır. `terminal_host` taşımayan (eski
      # payload) kayıtlar sahipsiz kalmasın diye ilk bastion'a düşürülür — sessiz kayıp olmaz.
      ansible.builtin.set_fact:
        my_ocp_clusters: >-
          {{
            (ocp_clusters | selectattr('terminal_host', 'defined')
                          | selectattr('terminal_host', 'equalto', inventory_hostname) | list)
            +
            (ocp_clusters | rejectattr('terminal_host', 'defined') | list
             if inventory_hostname == (terminal_hosts | sort | first) else [])
          }}
      changed_when: false

    - name: "--- [Task] Build per-cluster work units ---"
      # Her birim: bağlantı bilgisi + KENDİ kubeconfig'i + KENDİ pod adı. Parola vault'tan
      # `credential_key` ADI üzerinden çözülür (LogX ile aynı desen).
      ansible.builtin.set_fact:
        telnet_units: >-
          {{
            telnet_units | default([]) + [{
              'cluster_name': item.cluster_name,
              'url': item.api_url,
              'username': item.username | default(ocp_username | default('')),
              'password': lookup('vars', item.credential_key, default=''),
              'kubeconfig': '/tmp/kubeconfig-telnet-' ~ job_tag ~ '-' ~ item.cluster_name,
              'pod_name': 'telnet-test-' ~ job_tag
            }]
          }}
      loop: "{{ my_ocp_clusters }}"
      loop_control:
        label: "{{ item.cluster_name }}"
      no_log: true
      changed_when: false

    - name: "--- [Task] Skip this jump server when it owns no cluster ---"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} bu çalıştırmada hiçbir cluster'a sahip değil — atlanıyor."
      when: (telnet_units | default([])) | length == 0

    - name: "--- [Task] Validate connection inputs (no secrets in output) ---"
      # ÜRETİMDE NE OLDU (job 3218799/3218800): kullanıcı adı boş kaldığı için ÜÇ cluster'da
      # da `oc login` düştü; görevde `no_log: true` olduğu için AWX çıktısında yalnızca
      # "censored" göründü ve sebep hiçbir yerde yazmadı. Burada yalnızca AD listeleri
      # üretilir — parola hiçbir zaman bir çıktıya girmez.
      ansible.builtin.set_fact:
        units_missing_username: "{{ telnet_units | selectattr('username', 'equalto', '') | map(attribute='cluster_name') | list }}"
        units_missing_password: "{{ telnet_units | selectattr('password', 'equalto', '') | map(attribute='cluster_name') | list }}"
        units_missing_url: "{{ telnet_units | selectattr('url', 'equalto', '') | map(attribute='cluster_name') | list }}"
      when: (telnet_units | default([])) | length > 0
      changed_when: false

    - name: "--- [Task] Fail with the actual reason when an input is missing ---"
      ansible.builtin.assert:
        that:
          - units_missing_username | length == 0
          - units_missing_password | length == 0
          - units_missing_url | length == 0
        fail_msg: >-
          Bağlantı bilgisi eksik →
          kullanıcı adı yok: {{ units_missing_username | default([]) | join(', ') | default('-', true) }} |
          vault parolası çözülemedi: {{ units_missing_password | default([]) | join(', ') | default('-', true) }} |
          api_url yok: {{ units_missing_url | default([]) | join(', ') | default('-', true) }}.
          Kullanıcı adı cluster satırından (Admin > LogX Yapılandırma > OCP Cluster Hiyerarşisi)
          ya da genel varsayılandan (OCP Çalıştırma Ayarları) gelir; parola `credentials.yaml`
          içindeki vault anahtarından çözülür.
      when: (telnet_units | default([])) | length > 0

    - block:
        # PAROLA yalnız BU görevde geçiyor; `no_log` sadece burada. Diğer adımların hataları
        # AWX çıktısında OKUNABİLİR kalır (eskiden tek görev olduğu için hepsi "censored"di).
        - name: "--- [Task] Login to each cluster (isolated KUBECONFIG) ---"
          ansible.builtin.shell: |
            oc login \
              --server={{ item.url | quote }} \
              --username={{ item.username | quote }} \
              --password={{ item.password | quote }}
          environment:
            KUBECONFIG: "{{ item.kubeconfig }}"
          loop: "{{ telnet_units }}"
          loop_control:
            label: "{{ item.cluster_name }}"
          register: login_results
          changed_when: false
          # Bir cluster'a girilemezse DIGERLERI denenmeye devam etsin; karar asagida
          # sanitize edilmis sonuca bakilarak verilir (LogX'in "bir bastion coker, digerleri
          # devam eder" ilkesi).
          failed_when: false
          no_log: true

        - name: "--- [Task] Show login outcome per cluster (sanitized) ---"
          # `no_log` görevin KENDI ciktisini gizler; register edilen degisken DOLUDUR.
          # Burada BILEREK yalnizca `rc` ve `stderr` okunur — `cmd`/`invocation` parolayi
          # icerir ve ASLA yazdirilmaz. Uretimde sebebi gorunmeyen hata artik okunabilir.
          ansible.builtin.debug:
            msg: >-
              {{ item.item.cluster_name }} login rc={{ item.rc | default('?') }}
              {{ ('| ' ~ (item.stderr | default('') | trim)) if (item.rc | default(1)) != 0 else '' }}
          loop: "{{ login_results.results | default([]) }}"
          loop_control:
            label: "{{ item.item.cluster_name }}"

        - name: "--- [Task] Keep only the clusters we could log in to ---"
          ansible.builtin.set_fact:
            ok_units: >-
              {{
                login_results.results | default([])
                | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
                | map(attribute='item') | list
              }}
          no_log: true
          changed_when: false

        - name: "--- [Task] Fail when no cluster could be logged in to ---"
          ansible.builtin.fail:
            msg: >-
              Hiçbir cluster'a giriş yapılamadı — yukarıdaki "login outcome" satırlarındaki
              rc/stderr sebebi söyler.
          when: (ok_units | default([])) | length == 0

        - name: "--- [Task] Build (cluster x namespace) work units ---"
          # ÇAPRAZ ÇARPIM BURADA (2026-08-28). Portal tek job'da BİRDEN ÇOK namespace
          # gönderiyor; her (cluster, namespace) çifti ayrı bir pod + ayrı bir telnet
          # denemesidir. `product()` filtresi Ansible'ın kendi çapraz çarpımıdır — iç içe
          # loop kurmaya gerek yok. Pod adı namespace'e göre ayrışmak ZORUNDA değil
          # (pod'lar zaten namespace'e kapsanır) ama `oc` komutları `-n` ile ayrılır.
          # Filtre zinciri yerine DÜZ BİR DÖNGÜ: `product()` çiftleri üretir, her çift
          # okunur bir sözlüğe çevrilir. Zincirle tek satırda yazmak mümkündü ama bu
          # playbook'un okunması hata ayıklamadan daha önemli — repo'daki tuzakların
          # çoğu tek satıra sıkıştırılmış Jinja'dan çıktı.
          ansible.builtin.set_fact:
            work_units: "{{ work_units | default([]) + [ { 'unit': item.0, 'ns': item.1 } ] }}"
          loop: "{{ ok_units | product(ns_list) | list }}"
          loop_control:
            label: "{{ item.0.cluster_name }}/{{ item.1 }}"
          no_log: true
          changed_when: false

        - name: "--- [Task] Show planned work units ---"
          # Parola taşımayan ÖZET — kaç birim çalışacağı görünsün (yukarıdaki görev
          # `no_log` olduğu için orada hiçbir şey yazmaz).
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: {{ work_units | length }} birim =
              {{ ok_units | map(attribute='cluster_name') | list }} x {{ ns_list }}

        - name: "--- [Task] Create temporary pod ---"
          ansible.builtin.shell: |
            oc run {{ item.unit.pod_name | quote }} \
              -n {{ item.ns | quote }} \
              --image={{ image | quote }} \
              --restart=Never \
              --command -- sleep 3600
          environment:
            KUBECONFIG: "{{ item.unit.kubeconfig }}"
          loop: "{{ work_units }}"
          loop_control:
            label: "{{ item.unit.cluster_name }}/{{ item.ns }}"
          register: create_results
          changed_when: true
          # Bir cluster'da pod açılamazsa diğerleri denenmeye devam etsin; karar aşağıda
          # telnet çıktısına bakılarak verilir.
          failed_when: false

        - name: "--- [Task] Wait until pod is Ready ---"
          ansible.builtin.shell: |
            oc wait --for=condition=Ready \
              pod/{{ item.unit.pod_name }} \
              -n {{ item.ns | quote }} \
              --timeout=60s
          environment:
            KUBECONFIG: "{{ item.unit.kubeconfig }}"
          loop: "{{ work_units }}"
          loop_control:
            label: "{{ item.unit.cluster_name }}/{{ item.ns }}"
          register: wait_results
          changed_when: false
          failed_when: false

        - name: "--- [Task] Run telnet test ---"
          ansible.builtin.shell: |
            oc exec -n {{ item.ns | quote }} {{ item.unit.pod_name | quote }} -- \
              sh -c "timeout 10 telnet {{ telnet_host }} {{ telnet_port }}"
          environment:
            KUBECONFIG: "{{ item.unit.kubeconfig }}"
          loop: "{{ work_units }}"
          loop_control:
            label: "{{ item.unit.cluster_name }}/{{ item.ns }}"
          register: telnet_results
          # Bağlantı kurulamaması BAŞARISIZLIK DEĞİL, testin SONUCUDUR.
          failed_when: false
          changed_when: false

        - name: "--- [Task] Show telnet outcome per (cluster, namespace) ---"
          ansible.builtin.debug:
            msg: >-
              {{ item.item.unit.cluster_name }}/{{ item.item.ns }} ({{ inventory_hostname }}) →
              {{ telnet_host }}:{{ telnet_port }} =
              {{ 'ACIK' if (item.rc | default(1)) == 0 else 'KAPALI/ERISILEMEDI' }}
              | {{ (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}
          loop: "{{ telnet_results.results | default([]) }}"
          loop_control:
            label: "{{ item.item.unit.cluster_name }}/{{ item.item.ns }}"

        - name: "--- [Task] Record this bastion's structured results ---"
          # SONUÇ SÖZLEŞMESİ (E1). Ekranda gösterilecek olan BUDUR; `debug` mesajları
          # yalnızca insan içindir. Pod hiç açılamadıysa (wait/create düştü) sonuç
          # "closed" DEĞİL "error"dur — "port kapalı" ile "test yapılamadı" aynı şey
          # değildir ve kullanıcıyı yanlış yönlendirirdi.
          ansible.builtin.set_fact:
            bastion_telnet_results: >-
              {{ bastion_telnet_results | default([]) + [ {
                   'cluster': item.item.unit.cluster_name,
                   'bastion': inventory_hostname,
                   'namespace': item.item.ns,
                   'ip': telnet_host | string,
                   'port': telnet_port | string,
                   'state': ('open' if (item.rc | default(1)) == 0
                             else ('error' if item.skipped | default(false) else 'closed')),
                   'rc': item.rc | default(-1),
                   'detail': ((item.stdout | default('')) ~ ' ' ~ (item.stderr | default('')))
                              | trim | truncate(300, true, '…')
                 } ] }}
          loop: "{{ telnet_results.results | default([]) }}"
          loop_control:
            label: "{{ item.item.unit.cluster_name }}/{{ item.item.ns }}"
          changed_when: false

      when: (telnet_units | default([])) | length > 0

      always:
        # Geçici pod ve kubeconfig HER DURUMDA temizlenir — akış ortada düşse bile cluster'da
        # pod, bastion'da dosya kalmaz.
        - name: "--- [Task] Delete temporary pod ---"
          # TÜM (cluster × namespace) çiftleri üzerinden — akış ortada düşse bile hiçbir
          # namespace'te pod kalmaz. `work_units` henüz kurulmamış olabileceği için
          # (login'den önce düşülmüşse) çarpım burada yeniden hesaplanır.
          ansible.builtin.shell: |
            oc delete pod {{ item.0.pod_name | quote }} \
              -n {{ item.1 | quote }} \
              --ignore-not-found=true
          environment:
            KUBECONFIG: "{{ item.0.kubeconfig }}"
          loop: "{{ (telnet_units | default([])) | product(ns_list) | list }}"
          loop_control:
            label: "{{ item.0.cluster_name }}/{{ item.1 }}"
          changed_when: true
          failed_when: false

        - name: "--- [Task] Remove temporary kubeconfig ---"
          ansible.builtin.file:
            path: "{{ item.kubeconfig }}"
            state: absent
          loop: "{{ telnet_units | default([]) }}"
          loop_control:
            label: "{{ item.cluster_name }}"
          failed_when: false


- name: "--- [Play] Publish structured Telnet result ---"
  # TEK YAZAR: `set_stats` bir DICT uzerinde `aggregate: true` ile yayilirsa son gelen host
  # oncekini EZER — LogX'te bu tam olarak uretimde yasandi ve bes sunuculu bir kesifte
  # yalniz bir sunucu gorunmesine yol acti (bkz. logx_legacy_discovery.yml notu). Bu yuzden
  # sonuc TEK bir localhost play'inde, tum bastion'larin hostvars'i toplanarak yayinlanir.
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    all_targets: >-
      {{ groups['telnet_terminal'] | default([])
         | map('extract', hostvars, 'bastion_telnet_results')
         | select('defined') | select('!=', None) | list | flatten }}

  tasks:
    - name: "--- [Task] Publish telnet_result ---"
      ansible.builtin.set_stats:
        data:
          telnet_result:
            # `{%- ... -%}` SART: YAML katlamali skalerde satir sonlari BOSLUGA doner ve
            # `{% set %}` etiketleri arasindaki bosluklar ciktiya SIZAR. `| trim` yalniz
            # ifadenin SONUCUNU kirpar, etiketlerden gelen bosluklari DEGIL — LogX'te bu
            # deger uretimde "      failed" olarak yayinlanmisti. Bosluk denetimi tek cozum.
            overall_status: >-
              {%- set total = all_targets | length -%}
              {%- set open_n = all_targets | selectattr('state', 'equalto', 'open') | list | length -%}
              {%- set err_n = all_targets | selectattr('state', 'equalto', 'error') | list | length -%}
              {%- if total == 0 -%}error
              {%- elif open_n == total -%}open
              {%- elif open_n > 0 -%}partial
              {%- elif err_n == total -%}error
              {%- else -%}closed
              {%- endif -%}
            target:
              host: "{{ target_host | default(ip) | string }}"
              port: "{{ target_port | default(port) | string }}"
            counts:
              total: "{{ all_targets | length }}"
              open: "{{ all_targets | selectattr('state', 'equalto', 'open') | list | length }}"
              closed: "{{ all_targets | selectattr('state', 'equalto', 'closed') | list | length }}"
              error: "{{ all_targets | selectattr('state', 'equalto', 'error') | list | length }}"
            targets: "{{ all_targets }}"

    - name: "--- [Task] Summary line for the AWX log ---"
      ansible.builtin.debug:
        msg: >-
          {{ all_targets | selectattr('state', 'equalto', 'open') | list | length }} /
