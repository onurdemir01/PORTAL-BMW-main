---
# server/ansible/playbooks/opsx_legacy_dump.yml — OpsX Legacy: JBoss7/8 Thread/Heap Dump.
#
# Hedef host listesi (LogX/OpsX restart ile AYNI desen — bkz. server/opsx/index.cjs POST
# /api/opsx/run yorumu): bir extra_var DEGIL, AWX'in KENDI `limit` alaninda gelir. Bu
# yuzden play "hosts: all" kullanir, gercek daralma AWX tarafindan uygulanir.
#
# PID KESFI BURADA YAPILMAZ: PID'ler ONCEDEN opsx_legacy_jvm_discover.yml ile kesfedilip
# kullaniciya sunuluyor, kullanicinin sectigi PID'ler `pid_map` extra_var'i ile buraya
# geliyor — bkz. asagidaki "Gerekli extra_vars".
#
# JDK YOLU SABITTIR, DINAMIK COZULMEZ: JBoss majorune gore İKİ SABİT yoldan biri kullanılır
# (kullanicinin verdigi GERCEK komutlar):
#   JBoss7 -> /usr/jboss/jdk/bin/{jmap,jstack}
#   JBoss8 -> /usr/jboss8/jdk/bin/{jmap,jstack}
# Hangisinin kullanilacagi, opsx_legacy_jvm_discover.yml'in HER PID icin zaten belirledigi
# `jbossMajor` etiketiyle `pid_map` uzerinden gelir — /proc/<pid>/exe gibi bir calisma-anı
# kesfi YAPILMAZ (bilerek: /usr/jboss(8)/ disinda kurulmus, beklenmedik bir JDK'ya
# yanlislikla baglanmamak icin sadece bu iki sabit yoldan biri kullanilir).
#
# Gerekli extra_vars:
#   dump_type: "heapdump" | "threaddump"
#   staging_dir: /sw/BMW_PORTAL/opsx/dumps        (portalin okuyabildigi paylasilan dizin —
#                                                   HEDEF HOST'LARDA DA mount'lu olmasi beklenir,
#                                                   logx_legacy_transfer.yml'in birincil
#                                                   varsayimiyla AYNI)
#   pid_map: {"HOST1": [{"pid": "1234", "jbossMajor": "7"}], "HOST2": [{"pid": "5678", "jbossMajor": "8"}, ...]}
#     -- host adi (UPPERCASE, opsx_legacy_jvm_discover.yml'in host_jvm_list.host'uyla AYNI
#     buyuk/kucuk harf kurali) basina secilen JVM'ler. Bir host'ta BIRDEN FAZLA JVM
#     secilmisse o host icin BIRDEN FAZLA dump uretilir (asagidaki loop, host basina).
# Opsiyonel extra_vars:
#   application: <uygulama adi>                   (yalniz dosya adlandirma icin)
#
# PID BASINA IZOLASYON: bir host'ta secilen JVM'lerden biri patlarsa (proses artik yok,
# dump komutu basarisiz...) digerleri DEVAM eder — opsx_openshift_dump.yaml'daki "pod basina
# failed_when:false" izolasyon deseniyle AYNI gerekce.
#
# CIKTI SOZLESMESI (server/opsx/index.cjs extractOpsxDumpResult() ile BIREBIR eslesir):
#   set_stats: { opsx_dump_result: { overall_status, results: [
#     {host, pid, ok:true, staged_path, filename, size_bytes} | {host, pid, ok:false, error}
#   ]}}

- name: "OpsX Legacy - Thread/Heap Dump"
  hosts: all
  gather_facts: false
  become: false

  vars:
    dump_type: "{{ dump_type | default('heapdump') }}"
    application: "{{ application | default('') }}"
    local_dump_dir: "/tmp/opsx-dump"
    # Bu host icin secilen {pid, jbossMajor} listesi — pid_map'te bu host YOKSA (kesifte
    # hic JVM bulunamadi ya da kullanici hicbirini secmedi) bos liste doner, asagidaki
    # task tek bir ok:false sonucu uretir.
    my_pids: "{{ (pid_map | default({}))[inventory_hostname | upper] | default([]) }}"

  tasks:
    - name: "Girdileri dogrula"
      ansible.builtin.assert:
        that:
          - dump_type in ['heapdump', 'threaddump']
          - staging_dir is defined
          - staging_dir | string | length > 1
          - staging_dir is match('^/')
        fail_msg: "dump_type ('heapdump'|'threaddump') ve mutlak bir staging_dir gereklidir."
      run_once: true

    - name: "Bu host için seçilmiş JVM yoksa sonucu kaydet"
      ansible.builtin.set_fact:
        host_dump_results:
          - host: "{{ inventory_hostname | upper }}"
            ok: false
            error: "Bu host için seçilmiş JVM yok (JVM keşfinde bulunamamış ya da seçilmemiş olabilir)."
      when: (my_pids | length) == 0

    - name: "Yerel geçici dump dizinini oluştur"
      ansible.builtin.file:
        path: "{{ local_dump_dir }}"
        state: directory
        mode: "0770"
      when: (my_pids | length) > 0

    - name: "Paylaşılan staging dizinini oluştur"
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        mode: "0775"
      when: (my_pids | length) > 0

    # Her seçili JVM için TEK bir bash betiği: JDK yolu jbossMajor'a göre SABİT seçilir
    # (dosya başı notuna bakın — dinamik keşif YOK), dump'ı alır, paylaşılan staging
    # dizinine kopyalar. failed_when:false — bir PID patlarsa diğerleri devam eder
    # (sonuç aşağıda PID bazında raporlanır).
    - name: "Seçili JVM'lerden dump al"
      ansible.builtin.shell: |
        set -eu

        PID="{{ item.pid }}"
        DUMP_TYPE="{{ dump_type }}"
        LOCAL_DIR="{{ local_dump_dir }}"
        STAGING_DIR="{{ staging_dir }}"

        if [ "{{ item.jbossMajor }}" = "8" ]; then
          JDK_BIN="/usr/jboss8/jdk/bin"
        else
          JDK_BIN="/usr/jboss/jdk/bin"
        fi

        if [ ! -e "/proc/$PID" ]; then
          echo "Proses artık çalışmıyor: $PID" >&2
          exit 1
        fi

        BASENAME="{{ (application | default('app') | regex_replace('[^A-Za-z0-9_-]', '_')) }}_{{ inventory_hostname }}_${PID}_$(date +%Y%m%d%H%M%S)"
        if [ "$DUMP_TYPE" = "heapdump" ]; then
          FILE="${BASENAME}.hprof"
          "${JDK_BIN}/jmap" -dump:format=b,file="${LOCAL_DIR}/${FILE}" "$PID"
        else
          FILE="${BASENAME}-thread.txt"
          "${JDK_BIN}/jstack" "$PID" > "${LOCAL_DIR}/${FILE}"
        fi

        if [ ! -s "${LOCAL_DIR}/${FILE}" ]; then
          echo "Dump dosyası oluşturulamadı veya boş: $FILE" >&2
          exit 1
        fi

        cp "${LOCAL_DIR}/${FILE}" "${STAGING_DIR}/${FILE}"
        SIZE="$(stat -c %s "${STAGING_DIR}/${FILE}" 2>/dev/null || stat -f %z "${STAGING_DIR}/${FILE}")"
        rm -f "${LOCAL_DIR}/${FILE}"
        echo "OK|${FILE}|${SIZE}"
      args:
        executable: /bin/bash
      loop: "{{ my_pids }}"
      loop_control:
        label: "{{ item.pid }} (jboss{{ item.jbossMajor }})"
      when: (my_pids | length) > 0
      register: pid_dump_results
      changed_when: true
      failed_when: false

    # Betik başarılıysa stdout "OK|dosya|boyut" biçiminde tek satır — ayrıştırılıp sonuç
    # listesine eklenir. Başarısızsa stderr/msg hata mesajı olarak kaydedilir.
    - name: "PID sonuçlarını topla"
      ansible.builtin.set_fact:
        host_dump_results: >-
          {{
            (host_dump_results | default([])) + [
              ({'host': inventory_hostname | upper, 'pid': item.item.pid, 'ok': true,
                'staged_path': (staging_dir ~ '/' ~ (item.stdout | trim).split('|')[1]),
                'filename': (item.stdout | trim).split('|')[1],
                'size_bytes': ((item.stdout | trim).split('|')[2] | int)}
               if ((item.rc | default(1)) == 0 and (item.stdout | default('') | trim).startswith('OK|'))
               else
               {'host': inventory_hostname | upper, 'pid': item.item.pid, 'ok': false,
                'error': (item.stderr | default(item.msg | default('Dump alınamadı')) | trim)})
            ]
          }}
      loop: "{{ pid_dump_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.pid }}"
      when: (my_pids | length) > 0

    - name: "Yerel geçici dump dizinini temizle (best-effort)"
      ansible.builtin.file:
        path: "{{ local_dump_dir }}"
        state: absent
      when: (my_pids | length) > 0
      failed_when: false
      changed_when: false

    # ── Aggregator: TÜM hedef hostların (host başına artık N sonuç olabilir) listesini
    # TEK opsx_dump_result olarak yayınla — logx_legacy_transfer.yml'in run_once aggregator
    # deseniyle AYNI mantık, host_dump_results BİR LİSTE olduğu için sum(start=[]) ile
    # düzleştirilir.
    - name: "Birleşik sonucu yayınla (opsx_dump_result)"
      ansible.builtin.set_stats:
        data:
          opsx_dump_result:
            overall_status: >-
              {{
                'ok'
                if (flat_results | selectattr('ok', 'equalto', false) | list | length) == 0
                else (
                  'partial'
                  if (flat_results | selectattr('ok', 'equalto', true) | list | length) > 0
                  else 'failed'
                )
              }}
            results: "{{ flat_results }}"
        per_host: false
      vars:
        flat_results: "{{ ansible_play_hosts_all | map('extract', hostvars, 'host_dump_results') | list | sum(start=[]) }}"
      run_once: true
      delegate_to: localhost
