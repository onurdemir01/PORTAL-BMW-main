---
# server/ansible/playbooks/opsx_legacy_dump.yml — OpsX Legacy: JBoss7/8 Thread/Heap Dump.
#
# Hedef host listesi (LogX/OpsX restart ile AYNI desen — bkz. server/opsx/index.cjs POST
# /api/opsx/run yorumu): bir extra_var DEGIL, AWX'in KENDI `limit` alaninda gelir. Bu
# yuzden play "hosts: all" kullanir, gercek daralma AWX tarafindan uygulanir.
#
# PID KESFI BURADA YAPILMAZ: PID'ler ONCEDEN opsx_legacy_jvm_discover.yml ile kesfedilip
# kullaniciya sunuluyor, kullanicinin sectigi PID'ler `pid_map` extra_var'i ile buraya
# geliyor — bkz. asagidaki "Gerekli extra_vars".
#
# JDK YOLU SABITTIR, DINAMIK COZULMEZ: JBoss majorune gore İKİ SABİT yoldan biri kullanılır
# (kullanicinin verdigi GERCEK komutlar):
#   JBoss7 -> /usr/jboss/jdk/bin/{jmap,jstack}
#   JBoss8 -> /usr/jboss8/jdk/bin/{jmap,jstack}
# Hangisinin kullanilacagi, opsx_legacy_jvm_discover.yml'in HER PID icin zaten belirledigi
# `jbossMajor` etiketiyle `pid_map` uzerinden gelir — /proc/<pid>/exe gibi bir calisma-anı
# kesfi YAPILMAZ (bilerek: /usr/jboss(8)/ disinda kurulmus, beklenmedik bir JDK'ya
# yanlislikla baglanmamak icin sadece bu iki sabit yoldan biri kullanilir).
#
# Gerekli extra_vars:
#   dump_type: "heapdump" | "threaddump"
#   staging_dir: /sw/BMW_PORTAL/opsx/dumps        (portalin okuyabildigi paylasilan dizin —
#                                                   HEDEF HOST'LARDA DA mount'lu olmasi beklenir,
#                                                   logx_legacy_transfer.yml'in birincil
#                                                   varsayimiyla AYNI)
#   pid_map: {"HOST1": [{"pid": "1234", "jbossMajor": "7"}], "HOST2": [{"pid": "5678", "jbossMajor": "8"}, ...]}
#     -- host adi (UPPERCASE, opsx_legacy_jvm_discover.yml'in host_jvm_list.host'uyla AYNI
#     buyuk/kucuk harf kurali) basina secilen JVM'ler. Bir host'ta BIRDEN FAZLA JVM
#     secilmisse o host icin BIRDEN FAZLA dump uretilir (asagidaki loop, host basina).
# Opsiyonel extra_vars:
#   application: <uygulama adi>                   (yalniz dosya adlandirma icin)
#
# PID BASINA IZOLASYON: bir host'ta secilen JVM'lerden biri patlarsa (proses artik yok,
# dump komutu basarisiz...) digerleri DEVAM eder — opsx_openshift_dump.yaml'daki "pod basina
# failed_when:false" izolasyon deseniyle AYNI gerekce.
#
# CIKTI SOZLESMESI (server/opsx/index.cjs extractOpsxDumpResult() ile BIREBIR eslesir):
#   set_stats: { opsx_dump_result: { overall_status, results: [
#     {host, pid, ok:true, staged_path, filename, size_bytes} | {host, pid, ok:false, error}
#   ]}}

- name: "OpsX Legacy - Thread/Heap Dump"
  hosts: all
  gather_facts: false
  # PLAY SEVIYESINDE become YOK: tum task'lari (staging dizinine kopyalama dahil) "was"
  # kullanicisina yukseltmek "cp: ... Permission denied" ile dustu — staging_dir (paylasilan
  # NFS) "was" icin yazilabilir degil, sadece AWX'in baglandigi kullanici (ör. uxmid) icin
  # (2026-08-12 gercek job hatasi). Satir ici `dzdo -u was <komut>` de "user uxmid is not
  # allowed to execute ... as was" ile reddedildi — dzdo yetki politikasi, komutu Ansible'in
  # KENDI become mekanizmasi DISINDA calistirildiginda tanimiyor (2026-08-12, ikinci gercek
  # hata). Bu yuzden SADECE jmap/jstack'e dokunan task (asagida) kendi become:true/
  # become_method:dzdo/become_user:was'ini tasir — dizin olusturma/kopyalama/temizlik
  # NORMAL baglanti kullanicisiyla kalir.
  become: false

  vars:
    dump_type: "{{ dump_type | default('heapdump') }}"
    application: "{{ application | default('') }}"
    # Jboss7 -> /vhosting/dumpdir, Jboss8 -> /vhosting8/dumpdir (kullanicinin verdigi
    # GERCEK yollar) — /tmp bu host'larda dump dosyalari icin cok kucuk (2026-08-12).
    # Bu dizinlerin JBoss kurulumunun standart bir parcasi olarak ZATEN VAR oldugu
    # varsayilir (kullanicinin orijinal referans komutlari da mkdir icermiyordu).
    local_dump_dirs:
      "7": "/vhosting/dumpdir"
      "8": "/vhosting8/dumpdir"
    # Bu host icin secilen {pid, jbossMajor} listesi — pid_map'te bu host YOKSA (kesifte
    # hic JVM bulunamadi ya da kullanici hicbirini secmedi) bos liste doner, asagidaki
    # task tek bir ok:false sonucu uretir.
    my_pids: "{{ (pid_map | default({}))[inventory_hostname | upper] | default([]) }}"

  tasks:
    - name: "Girdileri dogrula"
      ansible.builtin.assert:
        that:
          - dump_type in ['heapdump', 'threaddump']
          - staging_dir is defined
          - staging_dir | string | length > 1
          - staging_dir is match('^/')
        fail_msg: "dump_type ('heapdump'|'threaddump') ve mutlak bir staging_dir gereklidir."
      run_once: true

    - name: "Bu host için seçilmiş JVM yoksa sonucu kaydet"
      ansible.builtin.set_fact:
        host_dump_results:
          - host: "{{ inventory_hostname | upper }}"
            ok: false
            error: "Bu host için seçilmiş JVM yok (JVM keşfinde bulunamamış ya da seçilmemiş olabilir)."
      when: (my_pids | length) == 0

    # best-effort: /vhosting(8)/dumpdir'in zaten var oldugu varsayilir (bkz. vars notu);
    # normal baglanti kullanicisinin (uxmid) bu ust dizinlerde olusturma izni olmayabilir,
    # dizin zaten mevcutsa bu no-op'tur — failed_when:false o yuzden burada.
    - name: "Yerel dump dizinlerinin var olduğundan emin ol"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ local_dump_dirs.values() | list }}"
      when: (my_pids | length) > 0
      failed_when: false

    - name: "Paylaşılan staging dizinini oluştur"
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        # 0777: 0775 ile "cp: ... Permission denied" alindi (gercek job hatasi,
        # 2026-08-12) — dizin muhtemelen uxmid'in sahibi/grubu OLMADIGI bir kullaniciyla
        # (ör. daha once dogrudan kurulmus, ya da ilk NFS mount'unda farkli bir uid/gid'e
        # eslenmis) var olusturulmus; mode:0775 SADECE sahip+grup icin yazma izni verir,
        # uxmid (baglanti kullanicisi) ne biri ne digeriyse "other" olarak salt-okunur
        # kalir. Ansible mevcut bir dizinin SAHIPLIGINI degistirmez (owner/group
        # verilmedigi surece), bu yuzden mode'u tek basina 0775 yapmak yetersiz — dizin
        # dosya paylasim alani oldugu icin (hassas veri degil) 0777 ile bu belirsizlik
        # tamamen ortadan kaldirilir.
        mode: "0777"
      when: (my_pids | length) > 0

    # Her seçili JVM için TEK bir bash betiği: JDK yolu jbossMajor'a göre SABİT seçilir
    # (dosya başı notuna bakın — dinamik keşif YOK), dump'ı LOKAL dizine alır (STAGING'e
    # kopyalama AYRI, become'suz bir task'ta — bkz. altı). failed_when:false — bir PID
    # patlarsa diğerleri devam eder (sonuç aşağıda PID bazında raporlanır).
    #
    # BECOME BURADA (task seviyesinde) — satır içi `dzdo -u was <komut>` dzdo yetki
    # politikası tarafından reddedildi ("user uxmid is not allowed to execute ... as was"),
    # Ansible'ın KENDİ become mekanizması (görevin TAMAMINI dzdo ile sarmalar) kabul
    # ediliyor (2026-08-12, iki gerçek job hatasıyla doğrulandı).
    - name: "Seçili JVM'lerden dump al"
      become: true
      become_method: dzdo
      become_user: was
      ansible.builtin.shell: |
        set -eu

        PID="{{ item.pid }}"
        DUMP_TYPE="{{ dump_type }}"
        LOCAL_DIR="{{ local_dump_dirs[item.jbossMajor] }}"

        if [ "{{ item.jbossMajor }}" = "8" ]; then
          JDK_BIN="/usr/jboss8/jdk/bin"
        else
          JDK_BIN="/usr/jboss/jdk/bin"
        fi

        if [ ! -e "/proc/$PID" ]; then
          echo "Proses artık çalışmıyor: $PID" >&2
          exit 1
        fi

        BASENAME="{{ (application | default('app') | regex_replace('[^A-Za-z0-9_-]', '_')) }}_{{ inventory_hostname }}_${PID}_$(date +%Y%m%d%H%M%S)"
        if [ "$DUMP_TYPE" = "heapdump" ]; then
          FILE="${BASENAME}.hprof"
          # jmap KENDI ilerleme mesajlarini ("Dumping heap to ... Heap dump file created")
          # standart cikisa basar — bastirilmazsa gorev ciktisina karisip asagidaki
          # "OK|dosya" satirini bozardi (jstack farkli: onun ciktisi zaten dosyaya
          # yonlendiriliyor, gorev ciktisina hic karismiyor). Gercek hata (2026-08-12):
          # heap dump BASARIYLA aliniyordu ama bu yuzden "basarisiz" raporlaniyordu.
          "${JDK_BIN}/jmap" -dump:format=b,file="${LOCAL_DIR}/${FILE}" "$PID" >/dev/null
        else
          FILE="${BASENAME}-thread.txt"
          "${JDK_BIN}/jstack" "$PID" > "${LOCAL_DIR}/${FILE}"
        fi

        # Dosya "was" sahipliginde olusabilir — sonraki kopyalama gorevi NORMAL kullanici
        # olarak calistigi icin okunabilir yapilir.
        chmod a+r "${LOCAL_DIR}/${FILE}" 2>/dev/null || true

        if [ ! -s "${LOCAL_DIR}/${FILE}" ]; then
          echo "Dump dosyası oluşturulamadı veya boş: $FILE" >&2
          exit 1
        fi
        # SON SATIR olarak basilir — asagidaki gorevler her ihtimale karsi ciktinin
        # SON satirini okur (jmap ya da jstack beklenmedik ek cikti basarsa bile savunma).
        echo "OK|${FILE}"
      args:
        executable: /bin/bash
      loop: "{{ my_pids }}"
      loop_control:
        label: "{{ item.pid }} (jboss{{ item.jbossMajor }})"
      when: (my_pids | length) > 0
      register: pid_dump_results
      changed_when: true
      failed_when: false

    # Staging'e kopyalama NORMAL baglanti kullanicisiyla (become YOK) — staging_dir "was"
    # icin yazilabilir degil (bkz. play basi notu). Sadece bir onceki adimda basarili olan
    # PID'ler icin calisir (when: dump_item.rc == 0).
    - name: "Dump dosyasını paylaşılan staging dizinine kopyala"
      ansible.builtin.shell: |
        set -eu
        FILE="{{ (dump_item.stdout | trim).split('\n')[-1].split('|')[1] }}"
        cp "{{ local_dir_for_item }}/${FILE}" "{{ staging_dir }}/${FILE}"
        # Portal sunucusu (Node.js, "was" DEGIL) bu dosyayi indirme aninda okuyabilmeli —
        # kaynak "was" sahipliginde olsa da cp SONRASI kopya artik normal kullanicinin.
        chmod 644 "{{ staging_dir }}/${FILE}" 2>/dev/null || true
        SIZE="$(stat -c %s "{{ staging_dir }}/${FILE}" 2>/dev/null || stat -f %z "{{ staging_dir }}/${FILE}")"
        rm -f "{{ local_dir_for_item }}/${FILE}"
        echo "OK|${FILE}|${SIZE}"
      args:
        executable: /bin/bash
      vars:
        dump_item: "{{ item }}"
        local_dir_for_item: "{{ local_dump_dirs[dump_item.item.jbossMajor] }}"
      loop: "{{ pid_dump_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.pid }}"
      when: >-
        (my_pids | length) > 0 and (item.rc | default(1)) == 0
        and (item.stdout | default('') | trim).split('\n')[-1].startswith('OK|')
      register: staged_copy_results
      changed_when: true
      failed_when: false

    # pid_dump_results (dump alindi mi) ve staged_copy_results (staging'e kopyalandi mi)
    # AYNI SIRADA, AYNI UZUNLUKTA iki liste — index ile eslestirilir (kopyalama task'i
    # basarisiz PID'leri "skipped" olarak isaretler, listeden DUSMEZ).
    - name: "PID sonuçlarını topla"
      ansible.builtin.set_fact:
        host_dump_results: >-
          {{
            (host_dump_results | default([])) + [
              ({'host': inventory_hostname | upper, 'pid': dump_item.item.pid, 'ok': true,
                'staged_path': (staging_dir ~ '/' ~ copy_last_line.split('|')[1]),
                'filename': copy_last_line.split('|')[1],
                'size_bytes': (copy_last_line.split('|')[2] | int)}
               if ((dump_item.rc | default(1)) == 0 and (copy_item.rc | default(1)) == 0
                   and copy_last_line.startswith('OK|'))
               else
               {'host': inventory_hostname | upper, 'pid': dump_item.item.pid, 'ok': false,
                'error': ((dump_item.stderr | default('') | trim)
                          if (dump_item.rc | default(1)) != 0
                          else (copy_item.stderr | default('') | trim)) | default('Dump alınamadı', true)})
            ]
          }}
      vars:
        dump_item: "{{ pid_dump_results.results[idx] }}"
        copy_item: "{{ staged_copy_results.results[idx] }}"
        copy_last_line: "{{ (copy_item.stdout | default('') | trim).split('\n')[-1] }}"
      loop: "{{ range(0, pid_dump_results.results | default([]) | length) | list }}"
      loop_control:
        loop_var: idx
      when: (my_pids | length) > 0

    # NOT: /vhosting(8)/dumpdir bu playbook'a OZEL, tek-job'luk bir /tmp dizini DEGIL —
    # JBoss kurulumunun kalici, paylasilan bir parcasi. Bu yuzden (eski /tmp tasarimindan
    # farkli olarak) SONUNDA state:absent ile SILINMEZ — yalnizca kopyalanan TEK dosya
    # bir onceki task'ta `rm -f` ile temizlenir.

    # ── Aggregator: TÜM hedef hostların (host başına artık N sonuç olabilir) listesini
    # TEK opsx_dump_result olarak yayınla — logx_legacy_transfer.yml'in run_once aggregator
    # deseniyle AYNI mantık, host_dump_results BİR LİSTE olduğu için sum(start=[]) ile
    # düzleştirilir.
    - name: "Birleşik sonucu yayınla (opsx_dump_result)"
      ansible.builtin.set_stats:
        data:
          opsx_dump_result:
            overall_status: >-
              {{
                'ok'
                if (flat_results | selectattr('ok', 'equalto', false) | list | length) == 0
                else (
                  'partial'
                  if (flat_results | selectattr('ok', 'equalto', true) | list | length) > 0
                  else 'failed'
                )
              }}
            results: "{{ flat_results }}"
        per_host: false
      vars:
        flat_results: "{{ ansible_play_hosts_all | map('extract', hostvars, 'host_dump_results') | list | sum(start=[]) }}"
      run_once: true
      delegate_to: localhost
