---
- name: "Application Hub fleet - input gate and bastions"
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: "Gate"
      block:
        - name: "Required inputs"
          ansible.builtin.assert:
            that:
              - terminal_hosts is defined and terminal_hosts | length > 0
              - ocp_clusters is defined and ocp_clusters is sequence and ocp_clusters | length > 0
              - ocp_clusters | length <= 200
              - app_hub_fleet_run is defined and (app_hub_fleet_run | string) is match('^[0-9]{1,12}$')
              - app_hub_fleet_dir is defined and app_hub_fleet_dir is string
              - app_hub_fleet_dir is match('^/[A-Za-z0-9_][A-Za-z0-9._/-]*$')
              - "'..' not in app_hub_fleet_dir"
              - (app_hub_fleet_dir.split('/') | select | list | length) >= 3
              - app_hub_fleet_writer is defined and app_hub_fleet_writer is string
              - app_hub_fleet_writer is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
            fail_msg: >-
              Required variables are missing or invalid: terminal_hosts={{ terminal_hosts | default([]) | length }},
              ocp_clusters={{ ocp_clusters | default([]) | length }} (at most 200), app_hub_fleet_run, app_hub_fleet_dir,
              app_hub_fleet_writer. If all are empty, extra variables prompt-on-launch is off on the AWX job template.
            quiet: true

        - name: "Cluster name format"
          ansible.builtin.assert:
            that:
              - item.cluster_name is defined and item.cluster_name is string and item.cluster_name is match('^[A-Za-z0-9._-]+$')
            fail_msg: "invalid cluster: {{ item | string | truncate(120) }}"
            quiet: true
          loop: "{{ ocp_clusters }}"
          loop_control:
            label: "{{ item.cluster_name | default('?') }}"

        - name: "Source sha1 of the scan script"
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/files/app_hub_fleet.sh"
            checksum_algorithm: sha1
          register: fleet_src_stat

        - name: "Remember source sha1"
          ansible.builtin.set_fact:
            fleet_src_sha1: "{{ fleet_src_stat.stat.checksum | default('') }}"
            fleet_out_dir: "{{ app_hub_fleet_dir }}/run-{{ app_hub_fleet_run }}/raw"

        - name: "Create the output directory on the writer host"
          ansible.builtin.file:
            path: "{{ fleet_out_dir }}"
            state: directory
            mode: "0775"
          delegate_to: "{{ app_hub_fleet_writer }}"
          ignore_unreachable: true
          register: fleet_mkdir

        - name: "Writer host reachable"
          ansible.builtin.assert:
            that:
              - fleet_mkdir is not unreachable
            fail_msg: "writer host unreachable: {{ app_hub_fleet_writer }} - {{ fleet_mkdir.msg | default('') | string | truncate(200) }}"
            quiet: true

        - name: "Owner bastion of each cluster (empty or null terminal_host -> first bastion)"
          ansible.builtin.set_fact:
            fleet_clusters: "{{ (fleet_clusters | default([])) + [item | combine({'terminal_host': owner})] }}"
          vars:
            owner: "{{ (item.terminal_host | default('', true) | string | trim) or (terminal_hosts | sort | first) }}"
          loop: "{{ ocp_clusters }}"
          loop_control:
            label: "{{ item.cluster_name }}"
          changed_when: false

        - name: "Add bastions to the dynamic inventory"
          ansible.builtin.add_host:
            name: "{{ item }}"
            groups: app_hub_fleet_terminal
          loop: "{{ terminal_hosts }}"
          changed_when: false

      rescue:
        - name: "Record the gate failure (published by the last play)"
          ansible.builtin.set_fact:
            fleet_gate_error: "{{ ansible_failed_result.msg | default('The input gate failed.') | string | truncate(500) }}"

- name: "Application Hub fleet - read-only scan per bastion"
  hosts: app_hub_fleet_terminal
  ignore_unreachable: true
  any_errors_fatal: false
  gather_facts: false
  become: false
  vars_files:
    - ../../bmw_openshift_jobs/global_variables/credentials.yaml
    - "{{ lookup('first_found', ['../../bmw_openshift_jobs/global_variables/openshift_inventory_vars.yaml'], errors='ignore') | default('/dev/null', true) }}"
  vars:
    oc_binary: ""
    oc_binary_candidates:
      - /bin/oc
      - /usr/local/bin/oc
      - /usr/bin/oc
    oc_probe_paths: >-
      {{
        (([oc_binary] if (oc_binary | default('') | trim | length > 0) else [])
         + (oc_binary_candidates | default([]))) | unique | list
      }}
    fleet_job: "{{ tower_job_id | default(awx_job_id | default('manual')) }}"
    fleet_script: "{{ fleet_tmp.path | default('') }}"
    fleet_job_tag: "{{ ((fleet_job | string | regex_replace('[^A-Za-z0-9]', ''))[:20]) or 'x' }}"
    fleet_slot_dir: "{{ fleet_slot_tmp.path | default('') }}"
    fleet_host_ok: "{{ ((fleet_reach | default({})) is not unreachable) and ((fleet_reach | default({'failed': true})) is succeeded) }}"
    fleet_go: "{{ (fleet_host_ok | bool) and ((my_cluster_names | default([])) | length > 0) }}"
    fleet_scan_budget: "{{ app_hub_fleet_cluster_timeout | default(1800) | int }}"
    fleet_slot_wait: "{{ app_hub_fleet_slot_wait | default(7200) | int }}"
    fleet_outer_timeout: "{{ (fleet_slot_wait | int) + (fleet_scan_budget | int) + 300 }}"
    fleet_poll_delay: "{{ [app_hub_fleet_poll_delay | default(15) | int, 1] | max }}"
    fleet_out_dir: "{{ hostvars['localhost'].fleet_out_dir }}"
  tasks:
    - name: "Scan"
      block:
        - name: "Bastion reachable"
          ansible.builtin.ping:
          register: fleet_reach

        - name: "Clusters of this bastion"
          ansible.builtin.set_fact:
            my_ocp_clusters: >-
              {{ hostvars['localhost'].fleet_clusters | default([])
                 | selectattr('terminal_host', 'equalto', inventory_hostname) | list }}
          changed_when: false

        - name: "Cluster names of this bastion"
          ansible.builtin.set_fact:
            my_cluster_names: "{{ my_ocp_clusters | map(attribute='cluster_name') | unique | list }}"
          changed_when: false

        - name: "Probe oc candidates"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ oc_probe_paths }}"
          register: oc_stats
          changed_when: false
          failed_when: false
          when: fleet_go | bool

        - name: "Usable oc paths"
          ansible.builtin.set_fact:
            oc_stat_hits: >-
              {{
                oc_stats.results | default([])
                | selectattr('stat', 'defined') | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                | selectattr('stat.executable', 'defined') | selectattr('stat.executable')
                | map(attribute='stat.path') | list
              }}
          when: fleet_go | bool
          changed_when: false

        - name: "oc on PATH"
          ansible.builtin.shell: command -v oc || true
          args:
            executable: /bin/bash
          register: oc_which
          when: (fleet_go | bool) and (oc_stat_hits | default([]) | length == 0)
          changed_when: false
          failed_when: false

        - name: "Resolve the oc binary"
          ansible.builtin.set_fact:
            oc_bin: >-
              {{
                oc_stat_hits[0] if (oc_stat_hits | default([]) | length > 0)
                else (oc_which.stdout | default('', true) | trim)
              }}
          when: fleet_go | bool
          changed_when: false

        - name: "Cluster connection records"
          ansible.builtin.set_fact:
            resolved_clusters: >-
              {{
                (resolved_clusters | default({})) | combine({
                  item.cluster_name: {'url': resolved_url, 'username': resolved_username, 'password': resolved_password}
                })
              }}
          vars:
            inventory_key: "{{ item.tenant | default('') }}_{{ item.env | default('') }}"
            inv_row: >-
              {{ (clusters[inventory_key][item.cluster_name])
                 if (clusters is defined and clusters[inventory_key] is defined
                     and clusters[inventory_key][item.cluster_name] is defined)
                 else {} }}
            resolved_url: "{{ item.api_url | default('') | trim or (inv_row.url | default('')) }}"
            resolved_username: "{{ item.username | default('') | trim or (ocp_username | default(username | default(''))) }}"
            resolved_password: >-
              {{ (lookup('vars', item.credential_key, default=''))
                 if (item.credential_key | default('') | trim | length > 0)
                 else (inv_row.password | default('')) }}
          loop: "{{ my_ocp_clusters }}"
          loop_control:
            label: "{{ item.cluster_name }}"
          no_log: true
          changed_when: false
          when: fleet_go | bool

        - name: "Per-run script name"
          ansible.builtin.tempfile:
            state: file
            path: /var/tmp
            prefix: .app_hub_fleet.
            suffix: .sh
          register: fleet_tmp
          changed_when: false
          when: (fleet_go | bool) and (oc_bin | default('') | trim | length > 0)

        - name: "Copy the script to the bastion"
          ansible.builtin.copy:
            src: files/app_hub_fleet.sh
            dest: "{{ fleet_script }}"
            mode: "0700"
          changed_when: false
          when: (fleet_go | bool) and (oc_bin | default('') | trim | length > 0)

        - name: "Verify the copy"
          ansible.builtin.stat:
            path: "{{ fleet_script }}"
            checksum_algorithm: sha1
          register: fleet_stat
          failed_when: false
          when: (fleet_go | bool) and (oc_bin | default('') | trim | length > 0)

        - name: "Private run directory (slots and one-shot password files)"
          ansible.builtin.tempfile:
            state: directory
            path: /tmp
            prefix: app-hub-fleet-slots-
          register: fleet_slot_tmp
          changed_when: false
          when: (fleet_go | bool) and (oc_bin | default('') | trim | length > 0)

        - name: "One-shot password file per cluster (the script reads and deletes it)"
          ansible.builtin.copy:
            content: "{{ resolved_clusters[item].password | default('') }}"
            dest: "{{ fleet_slot_dir }}/p.{{ item }}"
            mode: "0600"
          loop: "{{ my_cluster_names }}"
          no_log: true
          changed_when: false
          when: >-
            (fleet_go | bool)
            and (oc_bin | default('') | trim | length > 0)
            and (fleet_slot_dir | length > 0)

        - name: "Start one scan per cluster"
          ansible.builtin.command:
            cmd: "timeout -k 10 {{ fleet_outer_timeout }} bash {{ fleet_script }}"
          environment:
            OC_BIN: "{{ oc_bin }}"
            OCP_URL: "{{ resolved_clusters[item].url | default('') }}"
            OCP_USER: "{{ resolved_clusters[item].username | default('') }}"
            CLUSTER: "{{ item }}"
            FLEET_JOB: "{{ fleet_job_tag }}"
            FLEET_SLOT_DIR: "{{ fleet_slot_dir }}"
            FLEET_PASS_FILE: "{{ fleet_slot_dir }}/p.{{ item }}"
            FLEET_SLOTS: "{{ app_hub_fleet_slots | default(3) | int }}"
            FLEET_PARALLEL: "{{ app_hub_fleet_parallel | default(6) | int }}"
            FLEET_SLOT_WAIT: "{{ fleet_slot_wait }}"
            FLEET_SCAN_BUDGET: "{{ fleet_scan_budget }}"
          loop: "{{ my_cluster_names }}"
          register: fleet_jobs
          async: "{{ (fleet_outer_timeout | int) + 120 }}"
          poll: 0
          no_log: true
          changed_when: false
          when: >-
            (fleet_go | bool)
            and (oc_bin | default('') | trim | length > 0)
            and ((fleet_stat.stat.checksum | default('')) == (hostvars['localhost'].fleet_src_sha1 | default('x')))

        - name: "Wait for the scans"
          ansible.builtin.async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ fleet_jobs.results | default([]) | selectattr('ansible_job_id', 'defined') | list }}"
          loop_control:
            label: "{{ item.item }}"
          register: fleet_wait
          until: fleet_wait is finished
          retries: "{{ (((fleet_outer_timeout | int) + 120) / (fleet_poll_delay | int)) | round(0, 'ceil') | int }}"
          delay: "{{ fleet_poll_delay | int }}"
          ignore_errors: true
          no_log: true
          changed_when: false

        - name: "Write each scan to the shared directory"
          ansible.builtin.copy:
            content: "{{ fleet_wait.results[item].stdout }}"
            dest: "{{ fleet_out_dir }}/{{ fleet_wait.results[item].item.item | regex_replace('[^A-Za-z0-9._-]', '_') }}.out"
            mode: "0644"
          loop: "{{ range(fleet_wait.results | default([]) | length) | list }}"
          loop_control:
            label: "{{ fleet_wait.results[item].item.item | default('?') }}"
          register: fleet_writes
          delegate_to: "{{ hostvars['localhost'].app_hub_fleet_writer }}"
          throttle: 4
          ignore_errors: true
          no_log: true
          when: "'@@APPHUB_FLEET_END@@' in (fleet_wait.results[item].stdout | default(''))"

        - name: "Results of this bastion"
          ansible.builtin.set_fact:
            fleet_results: >-
              {{
                (fleet_results | default([])) + [{
                  'cluster': item.item.item,
                  'ok': complete and written and ((item.rc | default(1)) == 0),
                  'complete': complete,
                  'written': written,
                  'summary': summary,
                  'error': ('' if (complete and written and ((item.rc | default(1)) == 0))
                            else ('scan did not finish (rc=' ~ (item.rc | default('?') | string) ~ ') '
                                  ~ ((item.msg | default('')) | string | truncate(200))) if not complete
                            else (('could not write to the shared directory: '
                                   ~ (write_row.msg | default('') | string | truncate(200))) if not written
                            else ('scan rc=' ~ (item.rc | default('?') | string))))
                }]
              }}
          vars:
            complete: "{{ '@@APPHUB_FLEET_END@@' in (item.stdout | default('')) }}"
            write_row: "{{ ((fleet_writes.results | default([]))[fleet_i:fleet_i + 1] | first) | default({}, true) }}"
            written: >-
              {{ (write_row | length > 0) and (write_row is not skipped)
                 and (write_row is not unreachable) and (write_row is succeeded) }}
            summary: "{{ (item.stdout_lines | default([]) | select('match', '^APPHUB_FLEET_SUMMARY') | list | first | default('')) }}"
          loop: "{{ fleet_wait.results | default([]) }}"
          loop_control:
            label: "{{ item.item.item | default('?') }}"
            index_var: fleet_i
          no_log: true
          changed_when: false

        - name: "Clusters that never started are errors"
          ansible.builtin.set_fact:
            fleet_results: >-
              {{
                (fleet_results | default([])) + [{
                  'cluster': item, 'ok': false, 'complete': false, 'written': false, 'summary': '',
                  'error': ('bastion unreachable: ' ~ ((fleet_reach | default({})).msg | default('') | string | truncate(200)))
                           if ((fleet_reach | default({})) is unreachable)
                           else (("the oc binary is missing on this bastion: " ~ (oc_probe_paths | join(', ')))
                           if (oc_bin | default('') | trim | length == 0)
                           else 'the script copy could not be verified')
                }]
              }}
          loop: "{{ my_cluster_names }}"
          when: >-
            (my_cluster_names | length > 0)
            and item not in ((fleet_results | default([])) | map(attribute='cluster') | list)
          changed_when: false

      rescue:
        - name: "Record the failure (host stays up)"
          ansible.builtin.set_fact:
            host_blocked_reason: "{{ ansible_failed_result.msg | default('The scan could not finish on this bastion.') | string | truncate(300) }}"

      always:
        - name: "Clean up (skipped when the bastion check failed: nothing was created)"
          when: fleet_host_ok | bool
          block:
            - name: "Remove the async job files of the scans"
              ansible.builtin.async_status:
                jid: "{{ item.ansible_job_id }}"
                mode: cleanup
              loop: "{{ fleet_jobs.results | default([]) | selectattr('ansible_job_id', 'defined') | list }}"
              loop_control:
                label: "{{ item.item | default('?') }}"
              no_log: true
              changed_when: false
              failed_when: false

            - name: "Find work directories of this job"
              ansible.builtin.find:
                paths: /tmp
                patterns: "app-hub-fleet-w.{{ fleet_job_tag }}.*"
                file_type: directory
                hidden: true
              register: fleet_work_job
              failed_when: false

            - name: "Find stale work and run directories of earlier runs (cancelled jobs)"
              ansible.builtin.find:
                paths: /tmp
                patterns: "app-hub-fleet-w.*,app-hub-fleet-slots-*"
                file_type: directory
                age: 3h
                hidden: true
              register: fleet_work_left
              failed_when: false

            - name: "Find stale script copies of earlier runs"
              ansible.builtin.find:
                paths: /var/tmp
                patterns: ".app_hub_fleet.*.sh"
                age: 3h
                hidden: true
              register: fleet_script_left
              failed_when: false

            - name: "Remove work directories (they hold the kubeconfig) and stale leftovers"
              ansible.builtin.file:
                path: "{{ item.path }}"
                state: absent
              loop: >-
                {{ (fleet_work_job.files | default([])) + (fleet_work_left.files | default([]))
                   + (fleet_script_left.files | default([])) }}
              loop_control:
                label: "{{ item.path }}"
              changed_when: false
              failed_when: false

            - name: "Remove the script and the slot directory"
              ansible.builtin.file:
                path: "{{ item }}"
                state: absent
              loop: "{{ ([fleet_script] if (fleet_script | length > 0) else []) + ([fleet_slot_dir] if (fleet_slot_dir | length > 0) else []) }}"
              changed_when: false
              failed_when: false

            - name: "Verify work directory cleanup"
              ansible.builtin.find:
                paths: /tmp
                patterns: "app-hub-fleet-w.{{ fleet_job_tag }}.*"
                file_type: directory
                hidden: true
              register: fleet_work_after
              failed_when: false

            - name: "Verify script and run directory cleanup"
              ansible.builtin.stat:
                path: "{{ item }}"
              loop: "{{ ([fleet_script] if (fleet_script | length > 0) else []) + ([fleet_slot_dir] if (fleet_slot_dir | length > 0) else []) }}"
              register: fleet_left_after
              changed_when: false
              failed_when: false

            - name: "Record temporary files that remain (published, then the job fails)"
              ansible.builtin.set_fact:
                fleet_cleanup_error: >-
                  {{ 'temporary credential, script or run files could not be removed: '
                     ~ (((fleet_work_after.files | default([])) | map(attribute='path') | list)
                        + ((fleet_left_after.results | default([])) | selectattr('stat', 'defined')
                           | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='item') | list))
                       | join(', ') | truncate(300) }}
              when: >-
                ((fleet_work_after.files | default([])) | length > 0)
                or ((fleet_left_after.results | default([])) | selectattr('stat', 'defined')
                    | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list | length > 0)

- name: "Application Hub fleet - collect and publish"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: "Clear host errors"
      ansible.builtin.meta: clear_host_errors

    - name: "Publish the gate failure"
      ansible.builtin.set_stats:
        data:
          app_hub_fleet_result:
            run: "{{ app_hub_fleet_run | default('') | string }}"
            dir: "{{ fleet_out_dir | default('') }}"
            overall_status: failed
            error: "{{ fleet_gate_error }}"
            results: []
        per_host: false
      when: fleet_gate_error is defined

    - name: "Fail the job on a gate failure"
      ansible.builtin.fail:
        msg: "{{ fleet_gate_error }}"
      when: fleet_gate_error is defined

    - name: "Each cluster from its own bastion"
      ansible.builtin.set_fact:
        merged_results: >-
          {{
            (merged_results | default([])) + (reported[:1] if (reported | length > 0) else [{
              'cluster': item.cluster_name, 'ok': false, 'complete': false, 'written': false, 'summary': '',
              'error': 'Bastion did not report (unreachable or failed early): ' ~ owner_host
                       ~ ((' - ' ~ (hostvars[owner_host].host_blocked_reason | default(''))) if (hostvars[owner_host] | default({})).host_blocked_reason is defined else '')
            }])
          }}
      vars:
        owner_host: "{{ item.terminal_host }}"
        host_results: "{{ (hostvars[owner_host] | default({}, true)).fleet_results | default([], true) }}"
        reported: "{{ host_results | selectattr('cluster', 'equalto', item.cluster_name) | list }}"
      loop: "{{ fleet_clusters }}"
      loop_control:
        label: "{{ item.cluster_name }}"
      changed_when: false

    - name: "Bastions that left temporary files"
      ansible.builtin.set_fact:
        fleet_cleanup_errors: "{{ (fleet_cleanup_errors | default([])) + [item ~ ': ' ~ hostvars[item].fleet_cleanup_error] }}"
      loop: "{{ groups['app_hub_fleet_terminal'] | default([]) }}"
      when: hostvars[item].fleet_cleanup_error is defined
      changed_when: false

    - name: "Publish app_hub_fleet_result"
      ansible.builtin.set_stats:
        data:
          app_hub_fleet_result:
            run: "{{ app_hub_fleet_run | string }}"
            dir: "{{ fleet_out_dir }}"
            overall_status: >-
              {{
                'ok'
                if (merged_results | selectattr('ok', 'equalto', false) | list | length) == 0
                else ('partial' if (merged_results | selectattr('ok', 'equalto', true) | list | length) > 0 else 'failed')
              }}
            results: "{{ merged_results }}"
            cleanup_errors: "{{ fleet_cleanup_errors | default([]) }}"
        per_host: false

    - name: "Reasons of failed clusters"
      ansible.builtin.debug:
        msg: "{{ merged_results | rejectattr('ok') | map(attribute='error') | list }}"
      when: (merged_results | rejectattr('ok') | list | length) > 0

    - name: "Fail the job when no cluster was scanned"
      ansible.builtin.fail:
        msg: "No cluster could be scanned."
      when: (merged_results | selectattr('ok', 'equalto', true) | list | length) == 0

    - name: "Fail the job when temporary files remain on a bastion"
      ansible.builtin.fail:
        msg: "{{ fleet_cleanup_errors | join(' | ') }}"
      when: (fleet_cleanup_errors | default([]) | length) > 0
