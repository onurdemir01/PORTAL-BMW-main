# KURGUSAL ORNEK (2026-11-20): gercek katalog repoda TUTULMAZ (kurum sunucu / cluster / alan adlari).
# AWX'te bu klasorde `openshift_inventory_scalex.yaml` adiyla gercek degerler durur; playbook o dosyayi okur
# (yalniz Portal scalex_clusters_override gondermediginde). Bu dosya bicim icindir, AWX'e kopyalanmaz.
# Cluster kataloğu.
# Aktif/pasif: enabled: true|false
# Grup: platform + environments (ör. ark_dev, hosting_qa)
# SSH hedefi farklıysa ansible_host kullan.
# credential, ../global_variables/credentials.yaml içindeki variable adıdır.
# oc yolu farklıysa defaults.oc_paths listesine ekle.
#
# Örnek:
# mycluster:
#   enabled: true
#   platform: ark
#   environments: [test]
#   jump_server: myjump01
#   ansible_host: ORAOCP01
#   api_url: https://api.mycluster.example:6443
#   credential: svcac_gar
#
version: 1
defaults:
  tls_verify: false
  # oc client bu sırayla aranır; bulunamazsa PATH son fallback olarak kontrol edilir.
  # Ortamda farklı bir konum varsa yalnızca bu listeye mutlak yolu ekleyin.
  oc_paths:
    - /bin/oc
    - /usr/local/bin/oc
    - /usr/bin/oc
