---
# filex_list_files.yml — FileX / Self Servis dosya listeleme (REFERANS PLAYBOOK).
#
# ÖNEMLİ: Bu dosya YALNIZCA REFERANS/teslim amaçlıdır — portal bu playbook'u ÇALIŞTIRMAZ.
# Gerçek prod playbook ayrı bir Ansible projesinde deploy edilir (bkz.
# logx_legacy_discovery.yml — AYNI desen, AYNI güvenlik gerekçeleri). Bu dosyanın amacı, o
# playbook'u yazacak kişinin hangi extra_vars'ı alması ve hangi JSON çıktı sözleşmesini
# üretmesi gerektiğini net biçimde belgelemektir.
#
# AMAÇ: kullanıcı bir uygulamanın .ear dizinindeki (logs/log HARİÇ) TÜM dosyaları,
# `ls -la` çıktısındaki bilgilerle (izin, sahip, grup, boyut, tarih) VE sha512sum
# değeriyle görsün — kendi repo'sundaki dosyayla aynı olup olmadığını anlayabilsin
# ("paketim geçmiş mi geçmemiş mi"). Salt-okunur; hiçbir dosya değiştirilmez/silinmez.
#
# Gerekli extra_vars:
#   app_name      (string)  — logx_legacy_discovery.yml ile AYNI: yalnızca EAR klasör adı
#                              filtrelemesi için kullanılır, ASLA shell'e enjekte edilmez.
#   target_hosts  (string)  — Virgülle ayrılmış, BÜYÜK HARF hostname listesi (portal
#                              tarafından uygulama envanteri tablosundan önceden çözülür).
#
# Çıktı sözleşmesi (set_stats ile "filex_result" anahtarı altında, AWX Job'ın `artifacts`
# alanında görünür — backend BUNU okur, ham stdout ASLA parse edilmez):
#   {
#     "overall_status": "success" | "partial" | "failed",
#     "hosts": [
#       { "host": "GBJBOT22", "status": "ok" | "unreachable" | "error", "error": "...",
#         "ear_dirs": ["/vhosting8/APP-T.ear"],
#         "files": [
#           { "path": "/vhosting8/APP-T.ear/lib/app.jar", "size": 12345,
#             "mtime": 1752483600.0, "mode": "0644",
#             "owner": "was", "group": "was", "sha512": "..." }
#         ] }
#   (mtime, ansible.builtin.stat'in kendi cikisi gibi UNIX epoch saniye/float'tir —
#   portal bunu goruntulemeden once bicimlendirir, ISO string DEGILDIR)
#     ]
#   }
#
# Güvenlik notu: logx_legacy_discovery.yml ile AYNI ilkeler — dosya keşfi
# `ansible.builtin.find` MODÜLÜ ile yapılır (shell/find komutu DEĞİL), checksum da
# `ansible.builtin.stat`'in kendi `checksum_algorithm: sha512` özelliğiyle alınır — hiçbir
# yerde `sha512sum` kabuk komutuna dosya adı interpolate EDİLMEZ. `follow: false` symlink
# escape'i engeller.

- name: "FileX — .ear dizini dosya listeleme (logs hariç)"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  become: false
  strategy: free

  vars:
    legacy_app_roots:
      - /vhosting
      - /vhosting8

  tasks:
    - name: "app'a ait EAR klasörlerini bul"
      ansible.builtin.find:
        paths: "{{ legacy_app_roots }}"
        recurse: true
        file_type: directory
        patterns: "{{ app_name }}*.ear"
        use_regex: false
        follow: false
      register: found_ear_dirs
      ignore_errors: true
      changed_when: false

    - name: "EAR altındaki TÜM dosyaları bul (logs/log HARİÇ, sığ tarama sonra derinleştirilir)"
      ansible.builtin.find:
        paths: "{{ found_ear_dirs.files | default([]) | map(attribute='path') | unique | list }}"
        recurse: true
        file_type: file
        patterns: "*"
        follow: false
      register: found_all_files
      when: (found_ear_dirs.files | default([]) | length) > 0
      ignore_errors: true
      changed_when: false

    - name: "EAR bulunamadıysa boş dosya listesi oluştur"
      ansible.builtin.set_fact:
        found_all_files:
          failed: false
          files: []
      when: (found_ear_dirs.files | default([]) | length) == 0

    - name: "logs/log dizini altındaki dosyaları ele (KULLANICI TALEBİ: logs hariç her şey)"
      ansible.builtin.set_fact:
        candidate_files: >-
          {{
            found_all_files.files | default([])
            | rejectattr('path', 'search', '/(log|logs)/')
            | map(attribute='path')
            | list
          }}

    - name: "Kalan her dosya için izin/sahip/grup/boyut/tarih + sha512 al (shell YOK, stat modülü)"
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha512
        get_checksum: true
      loop: "{{ candidate_files }}"
      register: stat_results
      ignore_errors: true
      changed_when: false

    - name: "stat sonuçlarından dosya kayıtlarını oluştur (path + izin/sahip/grup/boyut/tarih/sha512)"
      ansible.builtin.set_fact:
        file_entries: >-
          {{
            file_entries | default([]) + [{
              'path': item.item,
              'size': item.stat.size,
              'mtime': item.stat.mtime,
              'mode': item.stat.mode,
              'owner': item.stat.pw_name | default(item.stat.uid | string),
              'group': item.stat.gr_name | default(item.stat.gid | string),
              'sha512': item.stat.checksum | default('')
            }]
          }}
      loop: "{{ stat_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('?') }}"
      when: item.stat is defined and item.stat.exists | default(false)

    - name: "Sonucu bu host için yapılandır"
      ansible.builtin.set_fact:
        host_result:
          host: "{{ inventory_hostname | upper }}"
          status: "{{ 'ok' if (found_all_files is not failed) else 'error' }}"
          error: "{{ found_all_files.msg | default('') if (found_all_files is failed) else '' }}"
          ear_dirs: "{{ found_ear_dirs.files | default([]) | map(attribute='path') | unique | list }}"
          files: "{{ file_entries | default([]) }}"

    # ÖNEMLİ (çoklu-host düzeltmesi): logx_legacy_discovery.yml ile AYNI gerekçe — per-host
    # set_stats bir DICT üzerinde aggregate ile son gelen host'un öncekini EZER. Çözüm: her
    # host'u bir gruba ekle; birleştirmeyi AŞAĞIDAKİ ayrı localhost play'inde tüm hostvars'tan
    # `host_result` toplayıp TEK KEZ yayınlayarak yap.
    - name: "Bu host'u sonuç grubuna ekle (aggregation için)"
      ansible.builtin.group_by:
        key: filex_discovered
      changed_when: false

# ── Tüm host sonuçlarını TEK artifact'te birleştir (localhost, run_once) ───────────────
- name: "FileX — sonuçları birleştir (tek artifact)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  run_once: true

  vars:
    aggregated_hosts: >-
      {{
        groups['filex_discovered'] | default([])
        | map('extract', hostvars, 'host_result')
        | select('defined')
        | list
      }}

  tasks:
    - name: "Birleşik sonucu tek artifact olarak yayınla (filex_result)"
      ansible.builtin.set_stats:
        data:
          filex_result:
            overall_status: >-
              {{
                'failed'
                if (aggregated_hosts | length == 0)
                else (
                  'success'
                  if ((aggregated_hosts | rejectattr('status', 'equalto', 'ok') | list | length) == 0)
                  else 'partial'
                )
              }}
            hosts: "{{ aggregated_hosts }}"
        per_host: false
        aggregate: false
