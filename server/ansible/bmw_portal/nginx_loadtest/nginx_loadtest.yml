                     + ([('derleme makinesi ' ~ yuk_derleme_host ~ ': play tamamlanmadi (erisilemedi ya da dustu)')] if (hostvars[yuk_derleme_host].yt_pa_bitti is not defined and hostvars[yuk_derleme_host].yt_pa_hata is not defined) else [])
                     + ([('/sw yayini: ' ~ yt_arac_yayin_hata)] if (yt_arac_yayin_hata is defined) else []))) }}
          when: (yuk_islem | default('') | string) == 'araclar'

        - name: --- [Task] On kontrol bolumu ---
          ansible.builtin.set_fact:
            yt_s_onk: >-
              {{ {'ip_yerel': ((((hostvars[yuk_hedef_host].yt_hk | default({})).ip_yerel | default('-')) == '1') if (yt8_tur == 'sunucu') else none),
                  'server_name_var': ((((hostvars[yuk_hedef_host].yt_hk | default({})).server_name_var | default('-')) == '1') if (yt8_tur == 'sunucu') else none),
                  'master_sayisi': (((((hostvars[yuk_hedef_host].yt_hk | default({})).master_sayisi | int) if (((hostvars[yuk_hedef_host].yt_hk | default({})).master_sayisi | default('-')) is match('^[0-9]{1,4}$')) else none)) if (yt8_tur == 'sunucu') else none),
                  'web_log_df': (((((hostvars[yuk_hedef_host].yt_hk | default({})).web_log_df | int) if (((hostvars[yuk_hedef_host].yt_hk | default({})).web_log_df | default('-')) is match('^[0-9]{1,3}$')) else none)) if (yt8_tur == 'sunucu') else none),
                  'log_dizini_okunur': ((((hostvars[yuk_hedef_host].yt_hk | default({})).log_dizini_okunur | default('0')) == '1') if (yt8_tur == 'sunucu') else none),
                  'log_format_ua': ((({'1': true, '0': false})[(hostvars[yuk_hedef_host].yt_hk | default({})).log_format_ua | default('-')] | default(none)) if (yt8_tur == 'sunucu') else none),
                  'statik_direktif': ((({'1': true, '0': false})[(hostvars[yuk_hedef_host].yt_hk | default({})).statik_direktif | default('-')] | default(none)) if (yt8_tur == 'sunucu') else none),
                  'ip_yuk_makinesinde': (({'1': true, '0': false})[((hostvars[yuk_yuk_host].yt_yk | default({})).ip_yuk_makinesinde | default('-'))] | default(none)),
                  'serbest_ag': ((((hostvars[yuk_yuk_host].yt_serbest_izin | default({})).ag | default('')) or none) if (yt8_tur == 'serbest') else none),
                  'arac_dogrulandi': ((hostvars[yuk_yuk_host].yt_arac_ozet | default({})).dogrulandi | default(none)),
                  'arac_sha256': (((hostvars[yuk_yuk_host].yt_arac_ozet | default({})).sha256 | default('')) or none),
                  'arac_glibc': (((hostvars[yuk_yuk_host].yt_arac_ozet | default({})).glibc | default('')) or none),
                  'arac_hata': (((hostvars[yuk_yuk_host].yt_arac_ozet | default({})).hata | default('')) or none),
                  'k6_var': (((hostvars[yuk_yuk_host].yt_k6 | default({})).var | default(false) | bool) if (yt8_motor == 'k6') else none),
                  'k6_surum': ((((hostvars[yuk_yuk_host].yt_k6 | default({})).surum | default('')) or none) if (yt8_motor == 'k6') else none),
                  'k6_sha256': ((((hostvars[yuk_yuk_host].yt_k6 | default({})).sha256 | default('')) or none) if (yt8_motor == 'k6') else none),
                  'wrk_var': (((hostvars[yuk_yuk_host].yt_wrk | default({})).var | default(false) | bool) if (yt8_motor == 'wrk') else none),
                  'wrk_calisiyor': (((hostvars[yuk_yuk_host].yt_wrk | default({})).calisiyor | default(false) | bool) if (yt8_motor == 'wrk') else none),
                  'wrk_surum': ((((hostvars[yuk_yuk_host].yt_wrk | default({})).surum | default('')) or none) if (yt8_motor == 'wrk') else none),
                  'wrk_sha256': ((((hostvars[yuk_yuk_host].yt_wrk | default({})).sha256 | default('')) or none) if (yt8_motor == 'wrk') else none),
                  'yollar_toplam': ((hostvars[yuk_yuk_host].yt_yk_ozet | default([]))[1] | default('0') | int),
                  'yollar_200': ((hostvars[yuk_yuk_host].yt_yk_ozet | default([]))[2] | default('0') | int),
                  'ilk_hatalar': (hostvars[yuk_yuk_host].yt_yk_hatalar | default([])),
                  'sikistirma': {'statik': ((hostvars[yuk_yuk_host].yt_yk_ozet | default([]))[3] | default('0') | int),
                                 'dinamik': ((hostvars[yuk_yuk_host].yt_yk_ozet | default([]))[4] | default('0') | int),
                                 'sikistirmasiz': ((hostvars[yuk_yuk_host].yt_yk_ozet | default([]))[5] | default('0') | int)},
                  'protokol': (((hostvars[yuk_yuk_host].yt_yk | default({})).protokol | default('')) if (((hostvars[yuk_yuk_host].yt_yk | default({})).protokol | default('')) in ['h1', 'h2']) else none),
                  'curl_h2': (({'1': true, '0': false})[((hostvars[yuk_yuk_host].yt_yk | default({})).curl_h2 | default('-'))] | default(none)),
                  'alpn_h2': (({'1': true, '0': false})[((hostvars[yuk_yuk_host].yt_yk | default({})).alpn_h2 | default('-'))] | default(none)),
                  'alpn_kaynak': (((hostvars[yuk_yuk_host].yt_yk | default({})).alpn_kaynak | default('')) if (((hostvars[yuk_yuk_host].yt_yk | default({})).alpn_kaynak | default('')) in ['curl', 'openssl']) else none),
                  'yollar_yanitli': (((hostvars[yuk_yuk_host].yt_yk | default({})).yollar_yanitli | int) if (((hostvars[yuk_yuk_host].yt_yk | default({})).yollar_yanitli | default('-')) is match('^[0-9]{1,4}$')) else none),
                  'yollar_h2': (((hostvars[yuk_yuk_host].yt_yk | default({})).yollar_h2 | int) if (((hostvars[yuk_yuk_host].yt_yk | default({})).yollar_h2 | default('-')) is match('^[0-9]{1,4}$')) else none)} }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'on_kontrol')

        - name: --- [Task] On kontrol engelleri (Portal kosuyu bunlarla BASLATMAZ) ---
          ansible.builtin.set_fact:
            yt_engeller: >-
              {{ (((['hedef: ' ~ ((hostvars[yuk_hedef_host].yt_hk_sonuc | default(['', 'FAIL', 'olculmedi']))[2] | default(''))] if ((hostvars[yuk_hedef_host].yt_hk_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) != 'OK' else [])) if (yt8_tur == 'sunucu') else [])
                 + (['yuk makinesi: ' ~ ((hostvars[yuk_yuk_host].yt_yk_sonuc | default(['', 'FAIL', 'olculmedi']))[2] | default(''))] if ((hostvars[yuk_yuk_host].yt_yk_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) != 'OK' else [])
                 + (['hedef IP ' ~ yuk_hedef_ip ~ ' hedef sunucuda yerel degil'] if ((yt8_tur == 'sunucu') and not yt_s_onk.ip_yerel) else [])
                 + (['log dizini /web_log okunamiyor'] if ((yt8_tur == 'sunucu') and not yt_s_onk.log_dizini_okunur) else [])
                 + (['arac kopyasi dogrulanamadi: ' ~ (yt_s_onk.arac_hata or 'olculmedi')] if not (yt_s_onk.arac_dogrulandi is sameas true) else [])
                 + (['arac calistirilamadi: ' ~ yt_s_onk.arac_hata] if ((yt_s_onk.arac_dogrulandi is sameas true) and (yt_s_onk.arac_hata is string)) else [])
                 + (['k6 kopyasi calistirilamiyor: ' ~ (hostvars[yuk_yuk_host].yt_dizin | default('-')) ~ '/arac/k6'] if ((yt8_motor == 'k6') and not (yt_s_onk.k6_var | bool)) else [])
                 + (([('wrk calisiyor ama surumu okunamadi ya da 4 altinda (' ~ (yt_s_onk.wrk_surum or '-') ~ '); arac setini yeniden hazirlayin (Portal Arac paneli)')] if (yt_s_onk.wrk_calisiyor | bool) else [('wrk kopyasi calistirilamiyor: ' ~ (hostvars[yuk_yuk_host].yt_dizin | default('-')) ~ '/arac/wrk')]) if ((yt8_motor == 'wrk') and not (yt_s_onk.wrk_var | bool)) else [])
                 + ((['HTTP/2: hedef bu Host icin ALPN ile h2 sunmuyor (openssl ile olculdu; curl h2 desteklemiyor, yollar HTTP/1.1 ile denendi)'] if (yt_s_onk.alpn_kaynak == 'openssl') else ['HTTP/2: hedef bu Host icin ALPN ile h2 sunmuyor (' ~ (yt_s_onk.yollar_h2 | string) ~ '/' ~ (yt_s_onk.yollar_yanitli | string) ~ ' yol h2)']) if (((yuk_protokol | default('h1') | string) == 'h2') and (yt_s_onk.alpn_h2 is sameas false)) else [])
                 + ((['HTTP/2 olculemedi (curl h2 desteklemiyor, openssl ile ALPN olculemedi)'] if (yt_s_onk.alpn_kaynak == 'openssl') else ['HTTP/2 olculemedi (curl h2 desteklemiyor ya da yanitli yol yok)']) if (((yuk_protokol | default('h1') | string) == 'h2') and (yt_s_onk.alpn_h2 is none)) else [])
                 + (['hicbir yol denenmedi'] if (yt_s_onk.yollar_toplam | int) == 0 else []) }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'on_kontrol')

        - name: --- [Task] Kosu bolumu ---
          ansible.builtin.set_fact:
            yt_s_kosu: >-
              {{ {'kos_rc': ((hostvars[yuk_yuk_host].yt_kos_rc | int) if (hostvars[yuk_yuk_host].yt_kos_rc is defined) else none),
                  'kaydedici_rc': ((hostvars[yuk_hedef_host].yt_kaydedici_rc | int) if ((yt8_tur == 'sunucu') and ((hostvars[yuk_hedef_host].yt_kaydedici_rc | default(-1) | int) >= 0)) else none),
                  'bas_epoch': ((hostvars[yuk_hedef_host].yt_kaydedici_bas | int) if ((yt8_tur == 'sunucu') and (hostvars[yuk_hedef_host].yt_kaydedici_bas is defined)) else ((hostvars[yuk_yuk_host].yt_kos_bas | int) if ((yt8_tur == 'serbest') and (hostvars[yuk_yuk_host].yt_kos_bas is defined)) else none)),
                  'bit_epoch': ((yt_bit_epoch | int) if (yt_bit_epoch is defined) else none),
                  'istemci_ozet': (yt_istemci_ozet | default([])),
                  'dosyalar': (yt_dosyalar | default([])),
                  'sw_dizin': (yt_sw_dizin if (yt_sw_tamam | default(false) | bool) else none)} }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'kosu')

        - name: --- [Task] Durdurma bolumu ---
          ansible.builtin.set_fact:
            yt_s_durdur:
              durdurulan: "{{ ((hostvars[yuk_hedef_host].yt_durdurulan | default([])) if (yt8_tur == 'sunucu') else []) + (hostvars[yuk_yuk_host].yt_durdurulan | default([])) }}"
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) in ['kosu', 'durdur'])

        - name: --- [Task] Araclar bolumu (derleme bilgisi) ---
          ansible.builtin.set_fact:
            yt8_ab: "{{ hostvars[yuk_derleme_host].yt_a_bilgi | default({}) }}"
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'araclar')

        - name: --- [Task] Araclar bolumu ---
          ansible.builtin.set_fact:
            yt_s_arac: >-
              {{ {'arac_id': (yuk_run_id | int),
                  'derleme_host': (yuk_derleme_host | string),
                  'derleme_rhel': ((yt8_ab.derleme_rhel | default('')) if ((yt8_ab.derleme_rhel | default('-')) not in ['-', '']) else none),
                  'derleme_glibc': ((yt8_ab.derleme_glibc | default('')) if ((yt8_ab.derleme_glibc | default('-')) not in ['-', '']) else none),
                  'derleme_os': ((yt8_ab.derleme_os | default('')) if ((yt8_ab.derleme_os | default('-')) not in ['-', '']) else none),
                  'k6_surum': (yuk_k6_surum | string),
                  'k6_surum_satiri': ((yt8_ab.k6_surum_satiri | default('')) if ((yt8_ab.k6_surum_satiri | default('-')) not in ['-', '']) else none),
                  'k6_sha256': (((hostvars[yuk_derleme_host].yt_a_sha | default({})).k6 | default('')) or none),
                  'k6_arsiv_sha256': ((hostvars[yuk_derleme_host].yt_a_k6_arsiv_sha | default('')) or none),
                  'k6_statik': ({'1': true, '0': false}[yt8_ab.k6_statik | default('-')] | default(none)),
                  'wrk_surum': (yuk_wrk_surum | string),
                  'wrk_surum_satiri': ((yt8_ab.wrk_surum_satiri | default('')) if ((yt8_ab.wrk_surum_satiri | default('-')) not in ['-', '']) else none),
                  'wrk_sha256': (((hostvars[yuk_derleme_host].yt_a_sha | default({})).wrk | default('')) or none),
                  'wrk_kaynak_sha256': (((hostvars[yuk_derleme_host].yt_a_arsiv | default({})).wrk | default('')) or none),
                  'wrk_kaynak_sabit': ((yuk_wrk_kaynak_sha256 | default('') | string | length) > 0),
                  'wrk_glibc_gerekli': ((yt8_ab.wrk_glibc_gerekli | default('')) if ((yt8_ab.wrk_glibc_gerekli | default('-')) not in ['-', '']) else none),
                  'wrk_openssl': ((yt8_ab.wrk_openssl | default('')) if ((yt8_ab.wrk_openssl | default('-')) not in ['-', '']) else none),
                  'wrk_luajit': ((yt8_ab.wrk_luajit | default('')) if ((yt8_ab.wrk_luajit | default('-')) not in ['-', '']) else none),
                  'wrk_kutuphaneler': ((yt8_ab.wrk_kutuphaneler | default('')) if ((yt8_ab.wrk_kutuphaneler | default('-')) not in ['-', '']) else none),
                  'sw_dizin': (yt_arac_sw if (yt_arac_tamam | default(false) | bool) else none)} }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'araclar')

        - name: --- [Task] Durum ---
          ansible.builtin.set_fact:
            yt_durum: >-
              {{ 'FAIL' if not (yt8_gecti | bool)
                 else (('OK' if ((yt_arac_tamam | default(false) | bool) and ((yt_hatalar | length) == 0)) else 'FAIL') if ((yuk_islem | default('')) == 'araclar')
                 else (('OK' if ((yt_engeller | length) == 0 and (yt_hatalar | length) == 0) else 'FAIL') if (yuk_islem | default('')) == 'on_kontrol'
                 else (('OK' if ((((hostvars[yuk_yuk_host].yt_durdur_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) == 'OK')
                                 and ((yt8_tur == 'serbest') or (((hostvars[yuk_hedef_host].yt_durdur_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) == 'OK'))
                                 and (yt_hatalar | length) == 0) else 'FAIL') if (yuk_islem | default('')) == 'durdur'
                 else ('OK' if ((yt_kosu_basarili | default(false) | bool) and (yt_sw_tamam | default(false) | bool) and (yt_hatalar | length) == 0)
                       else ('DUR' if ((yt_s_kosu.kos_rc in [4, 130]) and (yt_sw_tamam | default(false) | bool) and ((yt8_tur == 'serbest') or (yt_s_kosu.kaydedici_rc == 0)))
                       else 'FAIL'))))) }}

        - name: --- [Task] Silinmeyen kosu dizinleri (kosu betigi basladi, /sw kopyasi tamamlanmadi) ---
          ansible.builtin.set_fact:
            yt_korunan: >-
              {{ [] if ((yt_sw_tamam | default(false) | bool) or not (hostvars[yuk_yuk_host].yt_kos_basladi | default(false) | bool))
                 else ((([yuk_hedef_host ~ ':' ~ hostvars[yuk_hedef_host].yt_dizin] if (hostvars[yuk_hedef_host].yt_dizin is defined) else []) if (yt8_tur == 'sunucu') else [])
                       + ([yuk_yuk_host ~ ':' ~ hostvars[yuk_yuk_host].yt_dizin] if (hostvars[yuk_yuk_host].yt_dizin is defined) else [])) }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) == 'kosu')

        - name: --- [Task] Silinmeyen kosu dizinleri (durdurma dogrulanamadi ya da surec kaldi; Play 7 silmedi) ---
          ansible.builtin.set_fact:
            yt_kalan: >-
              {{ (((([yuk_hedef_host ~ ':' ~ hostvars[yuk_hedef_host].yt_dizin] if ((hostvars[yuk_hedef_host].yt_dizin is defined) and (hostvars[yuk_hedef_host].yt_dizin_sil is defined) and not (hostvars[yuk_hedef_host].yt_dizin_sil | bool)) else []) if (yt8_tur == 'sunucu') else [])
                   + ([yuk_yuk_host ~ ':' ~ hostvars[yuk_yuk_host].yt_dizin] if ((hostvars[yuk_yuk_host].yt_dizin is defined) and (hostvars[yuk_yuk_host].yt_dizin_sil is defined) and not (hostvars[yuk_yuk_host].yt_dizin_sil | bool)) else []))
                 | reject('in', (yt_korunan | default([]))) | list) }}
          when: (yt8_gecti | bool) and ((yuk_islem | default('')) in ['kosu', 'durdur'])

        - name: --- [Task] Hata metni govdesi ve korunan dizin notu ---
          ansible.builtin.set_fact:
            yt_korunan_not: >-
              {{ ([(('kosu dizini silinmedi (/sw kopyasi yok, veri elle kurtarilabilir): ' ~ (yt_korunan | default([]) | join(', '))) if ((yt_korunan | default([]) | length) > 0) else '')]
                  + [(('kosu dizini silinmedi (durdurma tamamlanmadi; elle silin): ' ~ (yt_kalan | default([]) | join(', '))) if ((yt_kalan | default([]) | length) > 0) else '')])
                 | select | join('; ') }}
            yt_hata_govde: >-
              {{ (yt_hatalar
                  + (yt_engeller | default([]))
                  + ([('kaydedici hazir olmadi: ' ~ (hostvars[yuk_hedef_host].yt_kaydedici_mesaj | default('') | string | truncate(200)))] if ((yt8_tur == 'sunucu') and (yt8_gecti | bool) and (yuk_islem | default('')) == 'kosu' and (hostvars[yuk_hedef_host].yt_kaydedici_basladi is defined) and not (hostvars[yuk_hedef_host].yt_kaydedici_hazir | default(false) | bool)) else [])
                  + ([(('wrk_kos.sh' if yt8_motor == 'wrk' else 'kos.sh') ~ ' rc ' ~ (hostvars[yuk_yuk_host].yt_kos_rc | string) ~ ': ' ~ ((hostvars[yuk_yuk_host].yt_kos_dur | default('')) or (hostvars[yuk_yuk_host].yt_kos_hata | default(''))))] if ((yt8_gecti | bool) and (yuk_islem | default('')) == 'kosu' and (hostvars[yuk_yuk_host].yt_kos_rc is defined) and ((hostvars[yuk_yuk_host].yt_kos_rc | int) != 0)) else [])
                  + (['kaydedici ozet dosyasi bilgi_*.txt yazilmadi'] if ((yt8_tur == 'sunucu') and (yt8_gecti | bool) and (yuk_islem | default('')) == 'kosu' and (hostvars[yuk_hedef_host].yt_kaydedici_hazir | default(false) | bool) and ((hostvars[yuk_hedef_host].yt_kaydedici_rc | default(-1) | int) != 0)) else [])
                  + (['durdurma ' ~ yuk_hedef_host ~ ': ' ~ ((hostvars[yuk_hedef_host].yt_durdur_sonuc | default([]))[3] | default('olculmedi'))] if ((yt8_tur == 'sunucu') and (yt8_gecti | bool) and (yuk_islem | default('')) == 'durdur' and ((hostvars[yuk_hedef_host].yt_durdur_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) != 'OK') else [])
                  + (['durdurma ' ~ yuk_yuk_host ~ ': ' ~ ((hostvars[yuk_yuk_host].yt_durdur_sonuc | default([]))[3] | default('olculmedi'))] if ((yt8_gecti | bool) and (yuk_islem | default('')) == 'durdur' and ((hostvars[yuk_yuk_host].yt_durdur_sonuc | default(['', 'FAIL']))[1] | default('FAIL')) != 'OK') else []))
                 | join('; ') }}

        - name: --- [Task] Hata metni (korunan dizin notu sonda ve her zaman sigar) ---
          ansible.builtin.set_fact:
            yt_hata_metni: >-
              {{ (([yt_hata_govde | truncate([298 - (yt_korunan_not | length), 20] | max, true, '...', 0)] + [yt_korunan_not]) | select | join('; ') | truncate(300))
                 if ((yt_korunan_not | length) > 0) else (yt_hata_govde | truncate(300)) }}

        - name: --- [Task] Sonuc sozlesmesi ---
          ansible.builtin.set_fact:
            yt_sonuc: >-
              {{ {'surum': 2,
                  'run_id': (yuk_run_id | default('') | string | truncate(20)),
                  'islem': (yuk_islem | default('') | string | truncate(20)),
                  'hedef_turu': ((yuk_hedef_turu | default('') | string) if ((yuk_hedef_turu | default('') | string) in ['sunucu', 'serbest']) else none),
                  'motor': ((yuk_motor | default('') | string) if ((yuk_motor | default('') | string) in ['k6', 'wrk']) else none),
                  'protokol': ((yuk_protokol | default('h1') | string) if ((yuk_protokol | default('h1') | string) in ['h1', 'h2']) else none),
                  'durum': yt_durum,
                  'hata': (yt_hata_metni if ((yt_hata_metni | length) > 0) else none),
                  'on_kontrol': (yt_s_onk | default(none)),
                  'kosu': (yt_s_kosu | default(none)),
                  'durdur': (yt_s_durdur | default(none)),
                  'araclar': (yt_s_arac | default(none))} }}

      rescue:
        - name: --- [Task] Sonuc derlenemedi ---
          ansible.builtin.set_fact:
            yt_sonuc: >-
              {{ {'surum': 2,
                  'run_id': (yuk_run_id | default('') | string | truncate(20)),
                  'islem': (yuk_islem | default('') | string | truncate(20)),
                  'hedef_turu': ((yuk_hedef_turu | default('') | string) if ((yuk_hedef_turu | default('') | string) in ['sunucu', 'serbest']) else none),
                  'motor': ((yuk_motor | default('') | string) if ((yuk_motor | default('') | string) in ['k6', 'wrk']) else none),
                  'protokol': ((yuk_protokol | default('h1') | string) if ((yuk_protokol | default('h1') | string) in ['h1', 'h2']) else none),
                  'durum': 'FAIL',
                  'hata': (('sonuc derlenemedi: ' ~ (ansible_failed_result.msg | default('?') | string)) | truncate(300)),
                  'on_kontrol': none,
                  'kosu': none,
                  'durdur': none,
                  'araclar': none} }}

    - name: --- [Task] Sonuc (set_stats) ---
      ansible.builtin.set_stats:
        data:
          nginx_loadtest_result: "{{ yt_sonuc }}"
        per_host: false
        aggregate: false

    - name: --- [Task] Sonuc ozeti ---
      ansible.builtin.debug:
        msg: "{{ yt_sonuc.islem }} {{ yt_sonuc.durum }}: {{ yt_sonuc.hata | default('-', true) }}"

    - name: --- [Task] Basarisizsa job dusurulur ---
      ansible.builtin.fail:
        msg: "{{ yt_sonuc.durum }}: {{ yt_sonuc.hata | default('ayrinti yok', true) }}"
      when: yt_sonuc.durum != 'OK'

