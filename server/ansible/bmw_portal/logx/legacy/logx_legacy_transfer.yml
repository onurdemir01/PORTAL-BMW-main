---
- name: "LogX v2 - Legacy transfer girdilerini dogrula"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    selected_hosts: >-
      {{
        selected_files
        | default([])
        | map(attribute='host')
        | unique
        | list
      }}

  tasks:
    - name: "Zorunlu degiskenleri dogrula"
      ansible.builtin.assert:
        that:
          - selected_files is defined
          - selected_files is sequence
          - selected_files | length > 0
          - staging_dir is defined
          - staging_dir | string | length > 1
          - staging_dir is match('^/')
          - fallback_dir is defined
          - fallback_dir | string | length > 1
          - fallback_dir is match('^/')
          - archive_name is defined
          - archive_name is match('^[A-Za-z0-9._-]+[.]zip$')
        fail_msg: >-
          selected_files, staging_dir, fallback_dir ve guvenli bir .zip archive_name
          saglanmalidir.

    - name: "En az bir kaynak host oldugunu dogrula"
      ansible.builtin.assert:
        that:
          - selected_hosts | length >= 1
        fail_msg: "selected_files en az bir gecerli host icermelidir."

    - name: "Secilen dosya kayitlarini dogrula"
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.host is defined
          - item.host | string | length > 0
          - item.path is defined
          - item.path is match('^/')
        fail_msg: "Gecersiz selected_files kaydi: {{ item }}"
      loop: "{{ selected_files }}"
      loop_control:
        label: "{{ item.host | default('?') }}:{{ item.path | default('?') }}"

    - name: "Gecici alan aday listesi disaridan verildiyse dogrula"
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.dir is defined
          - item.dir is match('^/[^/]')
        fail_msg: "Gecersiz logx_legacy_tmp_bases kaydi (dir mutlak yol olmali): {{ item }}"
      loop: "{{ logx_legacy_tmp_bases | default([]) }}"
      loop_control:
        label: "{{ item.dir | default('?') }}"


- name: "LogX v2 - Legacy loglari kaynak hosttan arsivle (tek-host: dogrudan / coklu-host: per-host parca)"
  hosts: "{{ selected_files | map(attribute='host') | unique | list }}"
  ignore_unreachable: true
  gather_facts: false
  become: false
  strategy: free

  vars:
    source_hosts: "{{ selected_files | map(attribute='host') | unique | list }}"
    single_host: "{{ (selected_files | map(attribute='host') | unique | list | length) == 1 }}"
    archive_stem: "{{ archive_name | regex_replace('[.]zip$', '') }}"
    parts_dir: "{{ staging_dir }}/{{ archive_name | regex_replace('[.]zip$', '') }}__parts"
    staging_archive_path: "{{ staging_dir }}/{{ archive_name }}"
    fallback_archive_path: "{{ fallback_dir }}/{{ archive_name }}"
    host_part_path: "{{ staging_dir }}/{{ archive_name | regex_replace('[.]zip$', '') }}__parts/{{ inventory_hostname }}.zip"
    ansible_pipelining: true
    logx_legacy_tmp_bases:
      - dir: "{{ staging_dir }}"
        tur: teslim
      - dir: /tmp
        yuzde: 80
      - dir: /vhosting/dumpdir
      - dir: /vhosting8/dumpdir
      - dir: /vhosting/logx-tmp
        olustur: true
      - dir: /vhosting8/logx-tmp
        olustur: true
    tmp_aday_sirasi: "{{ range(0, logx_legacy_tmp_bases | length) | list }}"
    was_tmp_dir: "{{ (was_tmp_aday | default({})).dir | default('') }}/logx-{{ archive_name | regex_replace('[.]zip$', '') }}-{{ inventory_hostname }}"
    was_tmp_archive: "{{ was_tmp_dir }}/{{ was_tmp_zip }}"

  pre_tasks:
    - name: "En uygun modern Python interpreter'i bul"
      ansible.builtin.raw: |
        best=""
        best_ver=""

        candidates="$(command -v python3 2>/dev/null || true) $(command -v python 2>/dev/null || true) $(find /usr/bin /usr/local/bin -maxdepth 1 \( -type f -o -type l \) -name 'python3*' -print 2>/dev/null)"

        for py in $candidates; do
          [ -x "$py" ] || continue

          ver=$("$py" -c 'import sys; sys.exit(1) if sys.version_info < (3,8) else None; print("%03d%03d%03d" % sys.version_info[:3])' 2>/dev/null) || continue

          case "$ver" in
            *[!0-9]*|'') continue ;;
          esac

          if [ -z "$best_ver" ] || [ "$ver" -gt "$best_ver" ]; then
            best="$py"
            best_ver="$ver"
          fi
        done

        [ -n "$best" ] && printf '%s\n' "$best"
        exit 0
      register: logx_python_probe
      changed_when: false
      failed_when: false

    - name: "Modern Python bulunduysa Ansible interpreter olarak kullan"
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ logx_python_probe.stdout_lines | first | trim }}"
      when: (logx_python_probe.stdout_lines | default([]) | length) > 0

  tasks:
    - block:
      - name: "Bu hosta ait secilen dosyalari hazirla"
        ansible.builtin.set_fact:
          host_selected_files: >-
            {{
              selected_files
              | selectattr('host', 'equalto', inventory_hostname)
              | list
            }}
          valid_source_paths: []
          per_file_status: []
          was_tmp_zip: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_lowercase,digits length=24') }}.zip"
        changed_when: false

      - name: "Secilen kaynak dosyalarin durumunu kontrol et"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.stat:
          path: "{{ item.path }}"
          follow: false
          get_checksum: false
          get_mime: false
          get_attributes: false
        loop: "{{ host_selected_files }}"
        loop_control:
          label: "{{ item.path }}"
        register: source_file_stats
        changed_when: false
        failed_when: false

      - name: "Dosya durumlarini ve gecerli kaynak listesini olustur"
        ansible.builtin.set_fact:
          valid_source_paths: >-
            {{
              valid_source_paths
              + (
                  [item.item.path]
                  if (
                    item.stat.exists | default(false)
                    and item.stat.isreg | default(false)
                    and item.stat.readable | default(true)
                  )
                  else []
                )
            }}
          per_file_status: >-
            {{
              per_file_status
              + [
                  {
                    'host': item.item.host,
                    'path': item.item.path,
                    'status': (
                      'ok'
                      if (
                        item.stat.exists | default(false)
                        and item.stat.isreg | default(false)
                        and item.stat.readable | default(true)
                      )
                      else 'error'
                    ),
                    'error': (
                      ''
                      if (
                        item.stat.exists | default(false)
                        and item.stat.isreg | default(false)
                        and item.stat.readable | default(true)
                      )
                      else (
                        (
                          'Dosya ' ~ (logx_legacy_user | default('was')) ~ ' ile denetlenemedi: '
                          ~ ((item.msg | default('')) ~ ' ' ~ (item.module_stderr | default(''))) | trim
                        )
                        if item.stat is not defined
                        else
                        'Dosya bulunamadi'
                        if not (item.stat.exists | default(false))
                        else (
                          'Path normal dosya degil'
                          if not (item.stat.isreg | default(false))
                          else 'Dosya okunamiyor'
                        )
                      )
                    )
                  }
                ]
            }}
        loop: "{{ source_file_stats.results | default([]) }}"
        loop_control:
          label: "{{ item.item.path }}"
        changed_when: false

      - name: "En az bir gecerli kaynak dosya oldugunu dogrula (tek-host)"
        ansible.builtin.assert:
          that:
            - valid_source_paths | length > 0
          fail_msg: >-
            Arsivlenecek mevcut ve okunabilir bir dosya bulunamadi.
            Dosya basina sebep: {{ per_file_status | default([]) | map(attribute='error') | list }}.
            Yollar: {{ host_selected_files | default([]) | map(attribute='path') | list }}.
            Okuma {{ logx_legacy_user | default('was') }} kullanicisiyla denendi.
        when: single_host | bool

      - name: "Staging dizininin durumunu kontrol et (tek-host)"
        ansible.builtin.stat:
          path: "{{ staging_dir }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        register: staging_dir_stat
        changed_when: false
        failed_when: false
        when: single_host | bool

      - name: "Gecici alan adaylarini okuma kullanicisiyla denetle"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.stat:
          path: "{{ logx_legacy_tmp_bases[item].dir }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        loop: "{{ tmp_aday_sirasi }}"
        loop_control:
          label: "{{ logx_legacy_tmp_bases[item].dir }}"
        register: tmp_aday_was
        when: valid_source_paths | length > 0
        changed_when: false
        failed_when: false

      - name: "Olusturulabilir gecici alan adaylarinin ust dizinini denetle"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.stat:
          path: "{{ logx_legacy_tmp_bases[item].dir | dirname }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        loop: "{{ tmp_aday_sirasi }}"
        loop_control:
          label: "{{ logx_legacy_tmp_bases[item].dir }}"
        register: tmp_aday_ust
        when:
          - valid_source_paths | length > 0
          - logx_legacy_tmp_bases[item].olustur | default(false) | bool
          - tmp_aday_was.results[item].stat is defined
          - not (tmp_aday_was.results[item].stat.exists | default(false))
        changed_when: false
        failed_when: false

      - name: "Teslim adayini baglanan kullaniciyla denetle"
        ansible.builtin.stat:
          path: "{{ logx_legacy_tmp_bases[item].dir }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        loop: "{{ tmp_aday_sirasi }}"
        loop_control:
          label: "{{ logx_legacy_tmp_bases[item].dir }}"
        register: tmp_aday_baglanan
        when:
          - valid_source_paths | length > 0
          - (logx_legacy_tmp_bases[item].tur | default('')) == 'teslim'
          - tmp_aday_was.results[item].stat is defined
          - tmp_aday_was.results[item].stat.isdir | default(false)
          - not (tmp_aday_was.results[item].stat.writeable | default(false))
        changed_when: false
        failed_when: false

      - name: "Butceli gecici alan adaylarinin bos alanini olc"
        ansible.builtin.command:
          argv:
            - df
            - "-Pk"
            - "{{ logx_legacy_tmp_bases[item].dir }}"
        environment:
          LC_ALL: C
        loop: "{{ tmp_aday_sirasi }}"
        loop_control:
          label: "{{ logx_legacy_tmp_bases[item].dir }}"
        register: tmp_aday_df
        when:
          - valid_source_paths | length > 0
          - logx_legacy_tmp_bases[item].yuzde is defined
          - tmp_aday_was.results[item].stat.isdir | default(false)
        changed_when: false
        failed_when: false

      - name: "Gecici alan adaylarini degerlendir"
        vars:
          a_kullanici: "{{ logx_legacy_user | default('was') }}"
          a_dir: "{{ logx_legacy_tmp_bases[item].dir }}"
          a_teslim: "{{ (logx_legacy_tmp_bases[item].tur | default('')) == 'teslim' }}"
          a_olustur: "{{ logx_legacy_tmp_bases[item].olustur | default(false) | bool }}"
          a_olculdu: "{{ tmp_aday_was.results[item].stat is defined }}"
          a_var: "{{ tmp_aday_was.results[item].stat.exists | default(false) | bool }}"
          a_dizin: "{{ tmp_aday_was.results[item].stat.isdir | default(false) | bool }}"
          a_was_yazar: >-
            {{
              (tmp_aday_was.results[item].stat.writeable | default(false) | bool)
              and (tmp_aday_was.results[item].stat.executable | default(false) | bool)
            }}
          a_baglanan_yazar: >-
            {{
              (tmp_aday_was.results[item].stat.executable | default(false) | bool)
              and (tmp_aday_baglanan.results[item].stat.writeable | default(false) | bool)
              and (tmp_aday_baglanan.results[item].stat.executable | default(false) | bool)
            }}
          a_ust_yazar: >-
            {{
              (tmp_aday_ust.results[item].stat.isdir | default(false) | bool)
              and (tmp_aday_ust.results[item].stat.writeable | default(false) | bool)
              and (tmp_aday_ust.results[item].stat.executable | default(false) | bool)
            }}
          a_gereken: >-
            {{
              source_file_stats.results | default([])
              | selectattr('stat', 'defined')
              | selectattr('item.path', 'in', valid_source_paths)
              | map(attribute='stat.size')
              | map('int')
              | sum
            }}
          a_df_kolon: >-
            {{
              ((tmp_aday_df.results[item].stdout_lines | default([])) | last).split()
              if (((tmp_aday_df.results[item].stdout_lines | default([])) | length) > 1)
              else []
            }}
          a_olusturan: >-
            {{
              'was'
              if (
                (a_var | bool and a_dizin | bool and a_was_yazar | bool)
                or (not (a_var | bool) and a_olustur | bool and a_ust_yazar | bool)
              )
              else (
                'baglanan'
                if (a_teslim | bool and a_var | bool and a_dizin | bool and a_baglanan_yazar | bool)
                else ''
              )
            }}
          a_bos_kb: "{{ a_df_kolon[3] if ((a_df_kolon | length) > 5) else '' }}"
          a_bos_olculdu: >-
            {{
              ((tmp_aday_df.results[item].rc | default(1) | int) == 0)
              and ((a_bos_kb | string) is match('^[0-9]+$'))
            }}
          a_izinli: "{{ ((a_bos_kb | int) * 1024 * (logx_legacy_tmp_bases[item].yuzde | default(100) | int)) // 100 }}"
          a_yer_sebep: >-
            {{
              ''
              if (logx_legacy_tmp_bases[item].yuzde is not defined)
              else (
                'bos alan olculemedi'
                if not (a_bos_olculdu | bool)
                else (
                  (
                    'yer yetersiz: gerekli ' ~ (((a_gereken | int) / 1048576) | round(1))
                    ~ ' MB, izinli ' ~ (((a_izinli | int) / 1048576) | round(1))
                    ~ ' MB (bos alan ' ~ (((a_bos_kb | int) / 1024) | round(1))
                    ~ ' MB, sinir %' ~ (logx_legacy_tmp_bases[item].yuzde | int) ~ ')'
                  )
                  if ((a_gereken | int) > (a_izinli | int))
                  else ''
                )
              )
            }}
          a_sebep: >-
            {{
              (
                a_kullanici ~ ' ile denetlenemedi: '
                ~ (
                    (tmp_aday_was.results[item].msg | default(''))
                    ~ ' ' ~ (tmp_aday_was.results[item].module_stderr | default(''))
                  ) | trim
              )
              if not (a_olculdu | bool)
              else (
                (
                  ('dizin degil (dosya)' if (tmp_aday_was.results[item].stat.isreg | default(false) | bool) else 'dizin degil')
                  if not (a_dizin | bool)
                  else (
                    a_yer_sebep
                    if ((a_olusturan | length) > 0)
                    else (
                      ('ne ' ~ a_kullanici ~ ' ne de baglanan kullanici yazabiliyor')
                      if (a_teslim | bool)
                      else (a_kullanici ~ ' yazamiyor')
                    )
                  )
                )
                if (a_var | bool)
                else (
                  ('teslim dizini yok' if (a_teslim | bool) else 'yok')
                  if not (a_olustur | bool)
                  else (
                    a_yer_sebep
                    if (a_ust_yazar | bool)
                    else (
                      'yok; ust dizin denetlenemedi'
                      if (tmp_aday_ust.results[item].stat is not defined)
                      else (
                        'yok; ust dizin de yok'
                        if not (tmp_aday_ust.results[item].stat.exists | default(false) | bool)
                        else ('yok; ust dizine ' ~ a_kullanici ~ ' yazamiyor')
                      )
                    )
                  )
                )
              )
            }}
        ansible.builtin.set_fact:
          tmp_adaylar: >-
            {{
              (tmp_adaylar | default([]))
              + [{
                  'dir': a_dir,
                  'uygun': ((a_sebep | length) == 0),
                  'olusturan': (a_olusturan if ((a_sebep | length) == 0) else ''),
                  'sebep': a_sebep,
                }]
            }}
          tmp_aday_metinleri: >-
            {{
              (tmp_aday_metinleri | default([]))
              + [a_dir ~ ': ' ~ (a_sebep if ((a_sebep | length) > 0) else 'uygun')]
            }}
        loop: "{{ tmp_aday_sirasi }}"
        loop_control:
          label: "{{ logx_legacy_tmp_bases[item].dir }}"
        when: valid_source_paths | length > 0
        changed_when: false

      - name: "Uygun gecici alan adaylarini sirala ve ilkini sec"
        ansible.builtin.set_fact:
          tmp_uygunlar: "{{ tmp_adaylar | default([]) | selectattr('uygun') | list }}"
          was_tmp_aday: >-
            {{
              (tmp_adaylar | default([]) | selectattr('uygun') | list | first)
              if ((tmp_adaylar | default([]) | selectattr('uygun') | list | length) > 0)
              else {}
            }}
          tmp_denemeler: []
          was_arsiv_hazir: false
          tmp_ikinci_deneme: false
        changed_when: false

      - name: "Ise ozel gecici dizini baglanan kullaniciyla hazirla"
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: directory
          mode: "0733"
        register: tmp_baglanan_dizin_result
        when:
          - valid_source_paths | length > 0
          - (was_tmp_aday.olusturan | default('')) == 'baglanan'
        ignore_errors: true

      - name: "Okuma kullanicisinin gecici dizinini hazirla"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: directory
          mode: "0711"
        register: was_tmp_dir_result
        when:
          - valid_source_paths | length > 0
          - (was_tmp_aday.olusturan | default('')) == 'was'
        ignore_errors: true

      - name: "Loglari okuma kullanicisiyla gecici ZIP'e yaz"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        community.general.archive:
          path: "{{ valid_source_paths }}"
          dest: "{{ was_tmp_archive }}"
          format: zip
          mode: "0644"
          force_archive: true
        register: was_archive_result
        when:
          - valid_source_paths | length > 0
          - was_tmp_aday.dir is defined
          - not (was_tmp_dir_result.failed | default(false))
          - not (tmp_baglanan_dizin_result.failed | default(false))
        ignore_errors: true

      - name: "Ilk denemenin sonucunu kaydet"
        vars:
          d_ok: >-
            {{
              was_archive_result is defined
              and was_archive_result is not skipped
              and not (was_archive_result.failed | default(false))
              and not (was_archive_result.unreachable | default(false))
            }}
          d_hata: >-
            {{
              (tmp_baglanan_dizin_result.msg | default('gecici dizin acilamadi'))
              if (
                (tmp_baglanan_dizin_result.failed | default(false))
                or (tmp_baglanan_dizin_result.unreachable | default(false))
              )
              else (
                (was_tmp_dir_result.msg | default('gecici dizin acilamadi'))
                if (
                  (was_tmp_dir_result.failed | default(false))
                  or (was_tmp_dir_result.unreachable | default(false))
                )
                else (was_archive_result.msg | default('arsiv yazilamadi'))
              )
            }}
        ansible.builtin.set_fact:
          was_arsiv_hazir: "{{ d_ok | bool }}"
          tmp_denemeler: >-
            {{
              tmp_denemeler
              + [{
                  'dir': was_tmp_aday.dir,
                  'ok': (d_ok | bool),
                  'hata': ('' if (d_ok | bool) else d_hata),
                  'metin': (
                    '1. deneme (' ~ was_tmp_aday.dir ~ '): '
                    ~ ('tamam' if (d_ok | bool) else d_hata)
                  ),
                }]
            }}
        when:
          - valid_source_paths | length > 0
          - was_tmp_aday.dir is defined
        changed_when: false

      - name: "Basarisiz ilk denemenin gecici dizinini okuma kullanicisiyla temizle"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: absent
        when:
          - not (was_arsiv_hazir | bool)
          - (was_tmp_aday.olusturan | default('')) == 'was'
        failed_when: false
        changed_when: false

      - name: "Basarisiz ilk denemenin gecici dizinini baglanan kullaniciyla temizle"
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: absent
        when:
          - not (was_arsiv_hazir | bool)
          - (was_tmp_aday.olusturan | default('')) == 'baglanan'
        failed_when: false
        changed_when: false

      - name: "Ilk deneme basarisizsa siradaki uygun adayi sec"
        ansible.builtin.set_fact:
          was_tmp_aday: "{{ tmp_uygunlar[1] }}"
          tmp_ikinci_deneme: true
        when:
          - valid_source_paths | length > 0
          - not (was_arsiv_hazir | bool)
          - tmp_uygunlar | length > 1
        changed_when: false

      - name: "Ise ozel gecici dizini baglanan kullaniciyla hazirla (2. deneme)"
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: directory
          mode: "0733"
        register: tmp_baglanan_dizin_result_2
        when:
          - tmp_ikinci_deneme | bool
          - valid_source_paths | length > 0
          - (was_tmp_aday.olusturan | default('')) == 'baglanan'
        ignore_errors: true

      - name: "Okuma kullanicisinin gecici dizinini hazirla (2. deneme)"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        ansible.builtin.file:
          path: "{{ was_tmp_dir }}"
          state: directory
          mode: "0711"
        register: was_tmp_dir_result_2
        when:
          - tmp_ikinci_deneme | bool
          - valid_source_paths | length > 0
          - (was_tmp_aday.olusturan | default('')) == 'was'
        ignore_errors: true

      - name: "Loglari okuma kullanicisiyla gecici ZIP'e yaz (2. deneme)"
        become: true
        become_user: "{{ logx_legacy_user | default('was') }}"
        become_method: dzdo
        community.general.archive:
          path: "{{ valid_source_paths }}"
          dest: "{{ was_tmp_archive }}"
          format: zip
          mode: "0644"
          force_archive: true
        register: was_archive_result_2
        when:
          - tmp_ikinci_deneme | bool
          - valid_source_paths | length > 0
          - was_tmp_aday.dir is defined
          - not (was_tmp_dir_result_2.failed | default(false))
          - not (tmp_baglanan_dizin_result_2.failed | default(false))
        ignore_errors: true

      - name: "Ikinci denemenin sonucunu kaydet"
        vars:
          d_ok: >-
            {{
              was_archive_result_2 is defined
              and was_archive_result_2 is not skipped
              and not (was_archive_result_2.failed | default(false))
              and not (was_archive_result_2.unreachable | default(false))
            }}
          d_hata: >-
            {{
              (tmp_baglanan_dizin_result_2.msg | default('gecici dizin acilamadi'))
              if (
                (tmp_baglanan_dizin_result_2.failed | default(false))
                or (tmp_baglanan_dizin_result_2.unreachable | default(false))
              )
              else (
                (was_tmp_dir_result_2.msg | default('gecici dizin acilamadi'))
                if (
                  (was_tmp_dir_result_2.failed | default(false))
                  or (was_tmp_dir_result_2.unreachable | default(false))
                )
                else (was_archive_result_2.msg | default('arsiv yazilamadi'))
              )
            }}
        ansible.builtin.set_fact:
          was_arsiv_hazir: "{{ d_ok | bool }}"
          tmp_denemeler: >-
            {{
              tmp_denemeler
              + [{
                  'dir': was_tmp_aday.dir,
                  'ok': (d_ok | bool),
                  'hata': ('' if (d_ok | bool) else d_hata),
                  'metin': (
                    '2. deneme (' ~ was_tmp_aday.dir ~ '): '
                    ~ ('tamam' if (d_ok | bool) else d_hata)
                  ),
                }]
            }}
        when:
          - tmp_ikinci_deneme | bool
          - valid_source_paths | length > 0
          - was_tmp_aday.dir is defined
        changed_when: false

      - name: "Gecici alan sonucunu ozetle"
        ansible.builtin.set_fact:
          tmp_kullanilan: "{{ was_tmp_aday.dir if (was_arsiv_hazir | bool) else '' }}"
          tmp_sorun: >-
            {{
              ''
              if (was_arsiv_hazir | bool or (valid_source_paths | length) == 0)
              else (
                (
                  'Gecici alan bulunamadi. Adaylar: '
                  ~ (tmp_aday_metinleri | default([]) | join(' | '))
                )
                if ((tmp_uygunlar | length) == 0)
                else (
                  'Loglar ' ~ (logx_legacy_user | default('was')) ~ ' kullanicisiyla ziplenemedi. '
                  ~ (tmp_denemeler | map(attribute='metin') | join(' | '))
                )
              )
            }}
        changed_when: false

      - name: "ZIP arsivini staging dizinine kopyala (tek-host)"
        ansible.builtin.copy:
          src: "{{ was_tmp_archive }}"
          dest: "{{ staging_archive_path }}"
          remote_src: true
          mode: "0775"
        register: staging_archive_result
        when:
          - single_host | bool
          - was_arsiv_hazir | bool
          - staging_dir_stat.stat.exists | default(false)
          - staging_dir_stat.stat.isdir | default(false)
        ignore_errors: true

      - name: "Staging kullanilamiyorsa fallback dizinini olustur (tek-host)"
        ansible.builtin.file:
          path: "{{ fallback_dir }}"
          state: directory
          mode: "0750"
        register: fallback_dir_result
        when:
          - single_host | bool
          - was_arsiv_hazir | bool
          - staging_archive_result is skipped or staging_archive_result.failed | default(false)
        ignore_errors: true

      - name: "Staging kullanilamiyorsa ZIP arsivini fallback dizinine kopyala (tek-host)"
        ansible.builtin.copy:
          src: "{{ was_tmp_archive }}"
          dest: "{{ fallback_archive_path }}"
          remote_src: true
          mode: "0775"
        register: fallback_archive_result
        when:
          - single_host | bool
          - was_arsiv_hazir | bool
          - staging_archive_result is skipped or staging_archive_result.failed | default(false)
          - not (fallback_dir_result.failed | default(false))
        ignore_errors: true

      - name: "Nihai arsiv yolunu ve transfer durumunu belirle (tek-host)"
        ansible.builtin.set_fact:
          archive_written_to_staging: >-
            {{
              staging_archive_result is not skipped
              and not (staging_archive_result.failed | default(false))
            }}
          archive_written_to_fallback: >-
            {{
              fallback_archive_result is defined
              and fallback_archive_result is not skipped
              and not (fallback_archive_result.failed | default(false))
            }}
          final_archive_path: >-
            {{
              staging_archive_path
              if (
                staging_archive_result is not skipped
                and not (staging_archive_result.failed | default(false))
              )
              else fallback_archive_path
            }}
        changed_when: false
        when: single_host | bool

      - name: "Olusturulan arsivin bilgisini al (tek-host)"
        ansible.builtin.stat:
          path: "{{ final_archive_path }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        register: final_archive_stat
        when:
          - single_host | bool
          - archive_written_to_staging or archive_written_to_fallback
        changed_when: false
        failed_when: false

      - name: "Kaynak host sonucunu kaydet (tek-host → nihai logx_result sekli)"
        ansible.builtin.set_fact:
          host_logx_result:
            overall_status: >-
              {{
                'failed'
                if not (archive_written_to_staging or archive_written_to_fallback)
                else (
                  'partial'
                  if (
                    per_file_status
                    | selectattr('status', 'equalto', 'error')
                    | list
                    | length
                  ) > 0
                  else 'success'
                )
              }}
            staged_path: >-
              {{
                final_archive_path
                if (archive_written_to_staging or archive_written_to_fallback)
                else ''
              }}
            filename: "{{ archive_name }}"
            size_bytes: "{{ final_archive_stat.stat.size | default(0) | int }}"
            is_fallback: "{{ not archive_written_to_staging }}"
            per_file_status: "{{ per_file_status }}"
            tmp_dir: "{{ tmp_kullanilan }}"
            tmp_adaylar: "{{ tmp_adaylar | default([]) }}"
            error: >-
              {{
                ''
                if (archive_written_to_staging or archive_written_to_fallback)
                else (
                  tmp_sorun
                  if ((tmp_sorun | length) > 0)
                  else (
                    fallback_archive_result.msg
                    | default(
                        staging_archive_result.msg
                        | default('ZIP arsivi olusturulamadi'),
                        true
                      )
                  )
                )
              }}
        changed_when: false
        when: single_host | bool

      - name: "Paylasimli parca dizinini olustur (coklu-host)"
        ansible.builtin.file:
          path: "{{ parts_dir }}"
          state: directory
          mode: "0775"
        register: parts_dir_result
        when: not (single_host | bool)
        ignore_errors: true

      - name: "Bu hostun gecici ZIP'ini per-host parca olarak kopyala (coklu-host)"
        ansible.builtin.copy:
          src: "{{ was_tmp_archive }}"
          dest: "{{ host_part_path }}"
          remote_src: true
          mode: "0775"
        register: host_part_result
        when:
          - not (single_host | bool)
          - valid_source_paths | length > 0
          - was_arsiv_hazir | bool
          - not (parts_dir_result.failed | default(false))
        ignore_errors: true

      - name: "Per-host parca bilgisini al (coklu-host)"
        ansible.builtin.stat:
          path: "{{ host_part_path }}"
          follow: true
          get_checksum: false
          get_mime: false
          get_attributes: false
        register: host_part_stat
        when:
          - not (single_host | bool)
          - host_part_result is defined
          - host_part_result is not skipped
          - not (host_part_result.failed | default(false))
        changed_when: false
        failed_when: false

      - name: "Kaynak host sonucunu kaydet (coklu-host → per-host ozet)"
        ansible.builtin.set_fact:
          host_logx_result:
            host: "{{ inventory_hostname | upper }}"
            status: >-
              {{
                'ok'
                if (
                  host_part_stat is defined
                  and host_part_stat.stat is defined
                  and host_part_stat.stat.exists | default(false)
                )
                else (
                  'unreachable'
                  if (
                    source_file_stats is defined
                    and (
                      source_file_stats is unreachable
                      or (
                        source_file_stats.results | default([])
                        | selectattr('unreachable', 'defined')
                        | selectattr('unreachable')
                        | list | length
                      ) > 0
                    )
                  )
                  else 'error'
                )
              }}
            part_filename: "{{ inventory_hostname }}.zip"
            size_bytes: "{{ host_part_stat.stat.size | default(0) | int if (host_part_stat is defined and host_part_stat.stat is defined) else 0 }}"
            per_file_status: "{{ per_file_status }}"
            tmp_dir: "{{ tmp_kullanilan }}"
            tmp_adaylar: "{{ tmp_adaylar | default([]) }}"
            error: >-
              {{
                ''
                if (
                  host_part_stat is defined
                  and host_part_stat.stat is defined
                  and host_part_stat.stat.exists | default(false)
                )
                else (
                  (
                    'Bu hostta arsivlenecek okunabilir dosya yok; dosya basina sebep: '
                    ~ (per_file_status | map(attribute='error') | join(' | '))
                  )
                  if (valid_source_paths | length == 0)
                  else (
                    tmp_sorun
                    if ((tmp_sorun | length) > 0)
                    else (host_part_result.msg | default('Per-host ZIP olusturulamadi'))
                  )
                )
              }}
        changed_when: false
        when: not (single_host | bool)

      rescue:
        - name: "Hata kaydedilir (host ayakta kalir)"
          ansible.builtin.set_fact:
            host_blocked_reason: >-
              {{ ansible_failed_result.msg | default('Bu host uzerinde is tamamlanamadi.') }}

        - name: "Coklu-host: hata host sonucu olarak kaydedilir (toplayicidan sessizce dusmesin)"
          ansible.builtin.set_fact:
            host_logx_result:
              host: "{{ inventory_hostname | upper }}"
              status: error
              error: "{{ host_blocked_reason }}"
              part_filename: ''
              size_bytes: 0
              per_file_status: "{{ per_file_status | default([]) }}"
              tmp_dir: ''
              tmp_adaylar: "{{ tmp_adaylar | default([]) }}"
          when: not (single_host | bool)
      always:
        - name: "Okuma kullanicisinin ise ozel gecici dizinini temizle"
          become: true
          become_user: "{{ logx_legacy_user | default('was') }}"
          become_method: dzdo
          ansible.builtin.file:
            path: "{{ was_tmp_dir }}"
            state: absent
          when: ((was_tmp_aday | default({})).olusturan | default('')) == 'was'
          failed_when: false
          changed_when: false

        - name: "Baglanan kullanicinin actigi ise ozel gecici dizini temizle"
          ansible.builtin.file:
            path: "{{ was_tmp_dir }}"
            state: absent
          when: ((was_tmp_aday | default({})).olusturan | default('')) == 'baglanan'
          failed_when: false
          changed_when: false

- name: "LogX v2 - Tek-host birlesik artifact sonucunu yayinla"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    source_hosts: "{{ selected_files | map(attribute='host') | unique | list }}"
    source_host: "{{ selected_files | map(attribute='host') | unique | list | first }}"

  tasks:
    - name: "Sonucu yayinla (tek-host) — sonuc yoksa SENTETIK failed"
      ansible.builtin.set_stats:
        data:
          logx_result: >-
            {{
              hostvars[source_host].host_logx_result
              if (hostvars[source_host].host_logx_result is defined)
              else {
                'overall_status': 'failed',
                'hosts': [{
                  'host': source_host,
                  'status': 'error',
                  'error': (hostvars[source_host].host_blocked_reason
                            | default('Kaynak host transfer sonucu olusturulamadi.')),
                  'files': [],
                }],
              }
            }}
        per_host: false
      when: source_hosts | length == 1

    - name: "Kaynak host sonucunun olustugunu dogrula (tek-host)"
      ansible.builtin.assert:
        that:
          - hostvars[source_host].host_logx_result is defined
        fail_msg: >-
          Kaynak host transfer sonucu olusturulamadi: {{ source_host }}
          {{ '— ' ~ hostvars[source_host].host_blocked_reason
             if hostvars[source_host].host_blocked_reason is defined else '' }}
      when: source_hosts | length == 1


- name: "LogX v2 - Coklu-host per-host ZIP'leri tek arsivde birlestir"
  hosts: "{{ selected_files | map(attribute='host') | unique | list }}"
  gather_facts: false
  become: false
  run_once: true

  vars:
    source_hosts: "{{ selected_files | map(attribute='host') | unique | list }}"
    parts_dir: "{{ staging_dir }}/{{ archive_name | regex_replace('[.]zip$', '') }}__parts"
    staging_archive_path: "{{ staging_dir }}/{{ archive_name }}"

  tasks:
    - name: "Mevcut per-host parca ZIP'lerini bul (coklu-host)"
      ansible.builtin.find:
        paths: "{{ parts_dir }}"
        patterns: "*.zip"
        recurse: false
        file_type: file
      register: part_files
      when: source_hosts | length > 1
      changed_when: false
      failed_when: false

    - name: "Per-host ZIP'leri tek arsivde birlestir (coklu-host)"
      community.general.archive:
        path: "{{ part_files.files | map(attribute='path') | list }}"
        dest: "{{ staging_archive_path }}"
        format: zip
        mode: "0775"
        force_archive: true
      register: combined_archive_result
      when:
        - source_hosts | length > 1
        - (part_files.files | default([]) | length) > 0
      ignore_errors: true

    - name: "Birlesik arsivin bilgisini al (coklu-host)"
      ansible.builtin.stat:
        path: "{{ staging_archive_path }}"
        follow: true
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: combined_archive_stat
      when:
        - source_hosts | length > 1
        - combined_archive_result is defined
        - combined_archive_result is not skipped
        - not (combined_archive_result.failed | default(false))
      changed_when: false
      failed_when: false

    - name: "Gecici parca dizinini temizle (best-effort, coklu-host)"
      ansible.builtin.file:
        path: "{{ parts_dir }}"
        state: absent
      when:
        - source_hosts | length > 1
        - combined_archive_stat is defined
        - combined_archive_stat.stat is defined
        - combined_archive_stat.stat.exists | default(false)
      failed_when: false
      changed_when: false

    - name: "Birlesik arsivin durumunu kaydet (yayini sonraki localhost play'i yapar)"
      ansible.builtin.set_fact:
        logx_cok_host_arsiv:
          mevcut: >-
            {{
              combined_archive_stat is defined
              and combined_archive_stat.stat is defined
              and (combined_archive_stat.stat.exists | default(false))
            }}
          boyut: >-
            {{
              (combined_archive_stat.stat.size | default(0) | int)
              if (combined_archive_stat is defined and combined_archive_stat.stat is defined)
              else 0
            }}
          parca_sayisi: "{{ part_files.files | default([]) | length }}"
          hata: >-
            {{
              (combined_archive_result.msg | default(''))
              if (combined_archive_result is defined and (combined_archive_result.failed | default(false)))
              else (
                ('Parca dizini aranamadi: ' ~ (part_files.msg | default('erisilemedi')))
                if (part_files is defined and part_files is unreachable)
                else ''
              )
            }}
      when: source_hosts | length > 1


- name: "LogX v2 - Coklu-host birlesik sonucu yayinla (toplayici kosmadiysa SENTETIK failed)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    cok_kaynaklar: "{{ selected_files | map(attribute='host') | unique | list }}"
    cok_bildirenler: >-
      {{
        cok_kaynaklar
        | map('extract', hostvars, 'host_logx_result')
        | select('defined')
        | selectattr('host', 'defined')
        | list
      }}
    cok_arsiv: >-
      {{
        cok_kaynaklar
        | map('extract', hostvars, 'logx_cok_host_arsiv')
        | select('defined')
        | list
        | first
        | default({}, true)
      }}
    cok_arsiv_var: "{{ cok_arsiv.mevcut | default(false) | bool }}"
    cok_staging_arsivi: "{{ staging_dir }}/{{ archive_name }}"
    cok_tum_hostlar: "{{ cok_bildirenler + (cok_eksikler | default([])) }}"

  tasks:
    - name: "Sonuc bildirmeyen kaynak hostlari unreachable olarak ekle (coklu-host)"
      ansible.builtin.set_fact:
        cok_eksikler: >-
          {{
            (cok_eksikler | default([]))
            + [{
                'host': item,
                'status': 'unreachable',
                'error': 'sonuc bildirmedi',
                'part_filename': '',
                'size_bytes': 0,
                'per_file_status': [],
              }]
          }}
      loop: >-
        {{
          []
          if (cok_kaynaklar | length) < 2
          else (
            cok_kaynaklar
            | map('upper')
            | reject('in', cok_bildirenler | map(attribute='host') | map('upper') | list)
            | list
          )
        }}
      when: cok_kaynaklar | length > 1

    - name: "Coklu-host birlesik sonucu yayinla (logx_result) - sonuc yoksa SENTETIK failed"
      ansible.builtin.set_stats:
        data:
          logx_result:
            overall_status: >-
              {{
                'failed'
                if not (cok_arsiv_var | bool)
                else (
                  'success'
                  if (
                    (cok_tum_hostlar | rejectattr('status', 'equalto', 'ok') | list | length) == 0
                    and (cok_bildirenler
                          | map(attribute='per_file_status') | flatten
                          | selectattr('status', 'equalto', 'error') | list | length) == 0
                  )
                  else 'partial'
                )
              }}
            staged_path: "{{ cok_staging_arsivi if (cok_arsiv_var | bool) else '' }}"
            filename: "{{ archive_name }}"
            size_bytes: "{{ (cok_arsiv.boyut | default(0) | int) if (cok_arsiv_var | bool) else 0 }}"
            is_fallback: false
            hosts: "{{ cok_tum_hostlar }}"
            error: >-
              {{
                ''
                if (cok_arsiv_var | bool)
                else (
                  'Coklu-host toplayici calismadi; birlesik arsiv olusturulmadi.'
                  if (cok_arsiv | length) == 0
                  else (
                    'Birlesik arsiv olusturulamadi: '
                    ~ (
                        cok_arsiv.hata
                        if (cok_arsiv.hata | default('') | length) > 0
                        else (
                          'hicbir kaynak hosttan parca ZIP gelmedi (host sebepleri hosts[].error alaninda)'
                          if ((cok_arsiv.parca_sayisi | default(0) | int) == 0)
                          else 'birlesik arsiv dogrulanamadi'
                        )
                      )
                  )
                )
              }}
        per_host: false
      when: cok_kaynaklar | length > 1

    - name: "Coklu-host toplayici sonuc uretmediyse isi BASARISIZ yap"
      ansible.builtin.fail:
        msg: >-
          Coklu-host toplayici calismadi; logx_result SENTETIK failed olarak yayinlandi.
          Kaynak hostlar: {{ cok_kaynaklar | join(', ') }}.
      when:
        - cok_kaynaklar | length > 1
        - (cok_arsiv | length) == 0
