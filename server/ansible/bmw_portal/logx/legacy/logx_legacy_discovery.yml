---
- name: "LogX v2 — Legacy log dosyası keşfi"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  become: true
  become_user: "{{ logx_legacy_user | default('was') }}"
  become_method: dzdo
  strategy: free
  ignore_unreachable: true

  vars:
    ansible_pipelining: true
    legacy_log_roots:
      - /vhosting
      - /vhosting8

  tasks:
    - block:
      - name: "Önce app'a ait EAR klasörlerini bul (daraltılmış keşif)"
        ansible.builtin.find:
          paths: "{{ legacy_log_roots }}"
          recurse: true
          file_type: directory
          patterns: "{{ app_name }}*.ear"
          use_regex: false
          follow: false
        register: found_ear_dirs
        ignore_errors: true
        changed_when: false

      - name: "EAR altındaki mevcut log/logs dizinlerini bul (stat döngüsü olmadan)"
        ansible.builtin.find:
          paths: "{{ found_ear_dirs.files | default([]) | map(attribute='path') | unique | list }}"
          recurse: false
          file_type: directory
          patterns:
            - log
            - logs
          use_regex: false
          follow: false
        register: found_log_dirs
        when: (found_ear_dirs.files | default([]) | length) > 0
        ignore_errors: true
        changed_when: false

      - name: "EAR bulunamadıysa boş log dizin listesi oluştur"
        ansible.builtin.set_fact:
          found_log_dirs:
            failed: false
            files: []
        when: (found_ear_dirs.files | default([]) | length) == 0

      - name: "Var olan log dizinlerini listele"
        ansible.builtin.set_fact:
          existing_log_dirs: >-
            {{
              found_log_dirs.files
              | default([])
              | map(attribute='path')
              | unique
              | list
            }}

      - name: "Sadece ilgili log dizinlerinde dosyaları bul"
        ansible.builtin.find:
          paths: "{{ existing_log_dirs }}"
          recurse: true
          file_type: file
          patterns: "*"
          follow: false
        register: found_files
        when: (existing_log_dirs | default([]) | length) > 0
        ignore_errors: true
        changed_when: false

      - name: "Hiç log dizini yoksa boş sonuç oluştur"
        ansible.builtin.set_fact:
          found_files:
            failed: false
            files: []
        when: (existing_log_dirs | default([]) | length) == 0

      - name: "Sonuçları uygulama adına ve log/logs path segmentine göre filtrele (find'ın kendi path/size/mtime dict'leri korunur)"
        ansible.builtin.set_fact:
          matched_files: >-
            {{
              found_files.files | default([])
              | selectattr('path', 'search', '/(log|logs)/')
              | selectattr('path', 'search', app_name)
              | list
            }}

      - name: "Keşif ölçüm sorunlarını topla (find hatası, erişilemeyen host, okunamayan yol)"
        ansible.builtin.set_fact:
          kesif_sorunlari: >-
            {{
              (kesif_sorunlari | default([]))
              + (
                  [{
                    'tur': ('unreachable' if (item.sonuc is unreachable) else 'error'),
                    'metin': (
                      item.gorev ~ ': '
                      ~ (
                          (item.sonuc.msg | default('erisilemedi'))
                          if (item.sonuc is unreachable)
                          else (
                            (
                              (item.sonuc.msg | default(''))
                              ~ ' '
                              ~ ((item.sonuc.module_stderr | default(''))[:300])
                            ) | trim
                            if (item.sonuc is failed)
                            else (
                              'okunamayan ' ~ (kesif_atlanan | length) ~ ' yol: '
                              ~ ((kesif_atlanan | map(attribute='key') | list)[:5] | join(', '))
                              ~ ' (ilk sebep: ' ~ ((kesif_atlanan | first)['value']) ~ ')'
                            )
                          )
                        )
                      ~ ' (kosan: ' ~ (logx_legacy_user | default('was')) ~ ')'
                    ),
                  }]
                  if (
                    item.sonuc is failed
                    or item.sonuc is unreachable
                    or (kesif_atlanan | length) > 0
                  )
                  else []
                )
            }}
        vars:
          kesif_kok_yok: >-
            {{
              item.sonuc.skipped_paths | default({}) | dict2items
              | selectattr('key', 'in', item.kokler)
              | selectattr('value', 'search', 'is not a directory')
              | map(attribute='key')
              | list
            }}
          kesif_atlanan: >-
            {{
              item.sonuc.skipped_paths | default({}) | dict2items
              | rejectattr('key', 'in', kesif_kok_yok)
              | list
            }}
        loop:
          - gorev: "Önce app'a ait EAR klasörlerini bul (daraltılmış keşif)"
            sonuc: "{{ found_ear_dirs }}"
            kokler: "{{ legacy_log_roots }}"
          - gorev: "EAR altındaki mevcut log/logs dizinlerini bul (stat döngüsü olmadan)"
            sonuc: "{{ found_log_dirs }}"
            kokler: []
          - gorev: "Sadece ilgili log dizinlerinde dosyaları bul"
            sonuc: "{{ found_files }}"
            kokler: []
        loop_control:
          label: "{{ item.gorev }}"

      - name: "Sonucu bu host için yapılandır"
        ansible.builtin.set_fact:
          host_result:
            host: "{{ inventory_hostname | upper }}"
            status: >-
              {{
                'ok'
                if (kesif_sorunlari | default([]) | length) == 0
                else (
                  'unreachable'
                  if (kesif_sorunlari | default([]) | selectattr('tur', 'equalto', 'unreachable') | list | length) > 0
                  else 'error'
                )
              }}
            error: "{{ kesif_sorunlari | default([]) | map(attribute='metin') | join(' | ') }}"
            files: "{{ (matched_files | default([])) if (kesif_sorunlari | default([]) | length) == 0 else [] }}"

      - name: "Bu host'u sonuç grubuna ekle (aggregation için)"
        ansible.builtin.group_by:
          key: logx_discovered
        changed_when: false

      rescue:
        - name: "Hata kaydedilir (host ayakta kalir)"
          ansible.builtin.set_fact:
            host_blocked_reason: >-
              {{ ansible_failed_result.msg | default('Bu host uzerinde is tamamlanamadi.') }}

        - name: "Hata host sonucu olarak kaydedilir (toplayicidan sessizce dusmesin)"
          ansible.builtin.set_fact:
            host_result:
              host: "{{ inventory_hostname | upper }}"
              status: error
              error: "{{ host_blocked_reason }} (kosan: {{ logx_legacy_user | default('was') }})"
              files: []

        - name: "Bu host'u sonuç grubuna ekle (rescue)"
          ansible.builtin.group_by:
            key: logx_discovered
          changed_when: false

- name: "LogX v2 — Legacy keşif sonuçlarını birleştir (tek artifact)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  run_once: true

  vars:
    bildiren_hostlar: >-
      {{
        groups['logx_discovered'] | default([])
        | map('extract', hostvars, 'host_result')
        | select('defined')
        | list
      }}
    hedef_terimler: >-
      {{
        (
          target_hosts
          if (target_hosts is defined and target_hosts is sequence and target_hosts is not string)
          else ((target_hosts | default('all') | string).split(','))
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
    hedef_hostlar: >-
      {{
        (
          (hedef_terimler | select('in', groups) | map('extract', groups) | flatten)
          + (hedef_terimler | reject('in', groups) | list)
        )
        | map('upper')
        | unique
        | list
      }}
    envanter_hostlari: "{{ groups['all'] | default([]) | map('upper') | list }}"
    aggregated_hosts: "{{ bildiren_hostlar + (bildirmeyen_hostlar | default([])) }}"

  tasks:
    - name: "Hedeflenip sonuç bildirmeyen hostları unreachable olarak ekle"
      ansible.builtin.set_fact:
        bildirmeyen_hostlar: >-
          {{
            (bildirmeyen_hostlar | default([]))
            + [{
                'host': item,
                'status': 'unreachable',
                'error': (
                  'sonuc bildirmedi'
                  if (item in envanter_hostlari)
                  else 'sonuc bildirmedi (AWX envanterinde eslesmedi)'
                ),
                'files': [],
              }]
          }}
      loop: >-
        {{
          hedef_hostlar
          | reject('in', bildiren_hostlar | map(attribute='host') | map('upper') | list)
          | list
        }}

    - name: "Birleşik sonucu tek artifact olarak yayınla (logx_result)"
      ansible.builtin.set_stats:
        data:
          logx_result:
            overall_status: >-
              {{
                'failed'
                if ((aggregated_hosts | selectattr('status', 'equalto', 'ok') | list | length) == 0)
                else (
                  'success'
                  if ((aggregated_hosts | rejectattr('status', 'equalto', 'ok') | list | length) == 0)
                  else 'partial'
                )
              }}
            hosts: "{{ aggregated_hosts }}"
        per_host: false
        aggregate: false

    - name: "Hicbir host basarili sonuc bildirmediyse isi BASARISIZ yap"
      ansible.builtin.fail:
        msg: >-
          Kesif tamamlanamadi — hicbir host basarili sonuc bildirmedi
          ({{ aggregated_hosts | length }} host). Sebep icin artifact'taki hosts[].error
          alanina, yukaridaki "Hata kaydedilir" gorevine ve host'larin erisilebilirligine bakin.
      when: (aggregated_hosts | selectattr('status', 'equalto', 'ok') | list | length) == 0
