---
# nginx_console_fetch.yml — Portal > Nginx Hub: secilen nginx sunucularinin konfigurasyon
# agacini + dosya iceriklerini + sertifikalarini SALT OKUNUR doker, GBLABT02 uzerinden /sw'ye
# yazar (Portal ayni mount'u dogrudan okur). Ayrinti: README.md.
#
# extra_vars (Portal gonderir):
#   target_hosts: ["GBNGXP40", "GBNGXP41"]   (opsiyonel; BOS/YOK -> tum nginx filosu envanterden
#                                              kesfedilir: dbo.Inventory.nginx_version dolu olanlar,
#                                              nginx_audit / nginx_metadata ile AYNI betik)
#   console_dir:  /sw/BMW_PORTAL/nginx_console   (raw/<HOST>.txt buraya; varsayilan bu)
#   requester:    kullanici adi (gunluk)
#
# NEDEN add_host: AWX `limit` yalniz template'te "prompt on launch" aciksa calisir (bkz. Portal
# notlari) — host secimi playbook icinde yapilir.
# NEDEN GBLABT02: envanter DB'sine erisen kesif betigi orada kosar; /sw mount da orada
# (nginx sunucularinda /sw YOK) — nginx_audit ile ayni desen.
#
# Sure: host basina birkac saniye; TUM filo (yuzlerce nginx) 30-40 dk surebilir - Portal
# ekranindaki "Yenile" secili hostlari gonderir; zamanlanmis gece kosusu target_hosts'suz
# calisir (tum filo).

- name: "--- [Play] Hedef sunucular - verilen liste ya da envanterden kesif ---"
  hosts: GBLABT02
  gather_facts: no
  vars:
    console_dir: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}"
  tasks:
    - name: --- [Task] Cikti dizini ---
      ansible.builtin.file:
        path: "{{ console_dir }}/raw"
        state: directory
        mode: '0777'
      ignore_errors: true

    # target_hosts verilmediyse: nginx_audit.yml / nginx_metadata ile AYNI kesif
    # (bmw_nginx/nginx_metadata/files/get_nginx_hosts.py -> dbo.Inventory, nginx_version dolu).
    - name: --- [Task] Envanter kesfi (target_hosts bos) ---
      when: (target_hosts | default([]) | length) == 0
      block:
        - name: --- [Task] Host kesif script'ini kopyala ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.copy:
            src: ../../bmw_nginx/nginx_metadata/files/get_nginx_hosts.py
            dest: /vhosting/scripts/get_nginx_hosts.py
            mode: '0755'

        - name: --- [Task] Envanterden nginx hostlarini sor ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.command: python3 /vhosting/scripts/get_nginx_hosts.py
          register: nginx_known_hosts_result
          changed_when: false
      always:
        - name: --- [Task] Host kesif script'ini kaldir ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.file:
            path: /vhosting/scripts/get_nginx_hosts.py
            state: absent
          failed_when: false

    - name: --- [Task] Hedef listesi ---
      ansible.builtin.set_fact:
        console_targets: >-
          {{ ((target_hosts | default([]) | length) > 0)
             | ternary(target_hosts | default([]), nginx_known_hosts_result.stdout_lines | default([]))
             | map('trim') | map('upper') | reject('equalto', '') | unique | list }}

    - name: --- [Task] Hedef yoksa DUR ---
      ansible.builtin.fail:
        msg: >-
          Hedef sunucu yok: target_hosts bos ve envanter kesfi 0 host dondurdu (muhtemelen
          middleware_inventory henuz calismadi). "all"a dusup tum filoyu taramak yerine duruyoruz.
      when: (console_targets | length) == 0

    - name: --- [Task] add_host ---
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: nginx_console_targets
      loop: "{{ console_targets }}"
      loop_control:
        label: "{{ item }}"

    - name: --- [Task] Ozet ---
      ansible.builtin.debug:
        msg: "{{ console_targets | length }} sunucu ({{ 'verilen liste' if (target_hosts | default([]) | length) > 0 else 'envanter kesfi' }}) -> {{ console_dir }}/raw"

- name: --- [Play] Konfigurasyon + sertifika dokumu ---
  hosts: nginx_console_targets
  gather_facts: no
  ignore_unreachable: true
  vars:
    console_dir: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}"
  tasks:
    - name: --- [Task] Dokum ---
      block:
        - name: --- [Task] Dokum betigini kopyala ---
          ansible.builtin.copy:
            src: files/nginx_console_dump.sh
            dest: /tmp/nginx_console_dump.sh
            mode: '0755'

        # www: nginx dosyalari ve sertifikalar bu kullanicinin; diger nginx isleriyle ayni.
        - name: --- [Task] Dokumu al (www, salt okunur) ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.command: /bin/bash /tmp/nginx_console_dump.sh
          register: dump_out
          changed_when: false

        - name: --- [Task] /sw'ye yaz (GBLABT02 uzerinden) ---
          ansible.builtin.copy:
            content: "{{ dump_out.stdout }}\n"
            dest: "{{ console_dir }}/raw/{{ inventory_hostname | upper }}.txt"
            mode: '0666'
          delegate_to: GBLABT02
          when: (dump_out.stdout | default('') | length) > 0

        - name: --- [Task] Sonuc ---
          ansible.builtin.set_fact:
            console_fetch_ok: "{{ (dump_out.stdout | default('') | length) > 0 }}"
      rescue:
        - name: --- [Task] Hata kaydi ---
          ansible.builtin.set_fact:
            console_fetch_ok: false
            console_fetch_error: "{{ ansible_failed_result.msg | default('dokum alinamadi') }}"
      always:
        - name: --- [Task] Betigi temizle ---
          ansible.builtin.file:
            path: /tmp/nginx_console_dump.sh
            state: absent
          failed_when: false

- name: --- [Play] Toplayici ---
  hosts: localhost
  gather_facts: no
  become: false
  tasks:
    # Ulasilamayan host'ta console_fetch_ok HIC yok -> default(false); rescue'da error dolu.
    - name: --- [Task] Sonuc listesi ---
      ansible.builtin.set_fact:
        fetch_results: >-
          {{ (fetch_results | default([])) + [ {
               'host': item,
               'ok': (hostvars[item].console_fetch_ok | default(false) | bool),
               'error': (hostvars[item].console_fetch_error | default('unreachable' if hostvars[item].console_fetch_ok is not defined else ''))
             } ] }}
      loop: "{{ groups['nginx_console_targets'] }}"
      loop_control:
        label: "{{ item }}"

    - name: --- [Task] set_stats ---
      ansible.builtin.set_stats:
        data:
          nginx_console_fetch_result:
            hosts: "{{ fetch_results | default([]) }}"
            ok_count: "{{ fetch_results | default([]) | selectattr('ok') | list | length }}"

    - name: --- [Task] Hic host dokulemediyse basarisiz ---
      ansible.builtin.fail:
        msg: "Hicbir sunucudan dokum alinamadi: {{ fetch_results | default([]) }}"
      when: (fetch_results | default([]) | selectattr('ok') | list | length) == 0
