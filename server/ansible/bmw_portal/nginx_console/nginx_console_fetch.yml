---
# nginx_console_fetch.yml — Portal > Nginx Hub: secilen nginx sunucularinin konfigurasyon
# agacini + dosya iceriklerini + sertifikalarini SALT OKUNUR doker, GBLABT02 uzerinden /sw'ye
# yazar (Portal ayni mount'u dogrudan okur). Ayrinti: README.md.
#
# extra_vars (Portal gonderir):
#   target_hosts: ["GBNGXP40", "GBNGXP41"]   (opsiyonel; BOS/YOK -> tum nginx filosu envanterden
#                                              kesfedilir: dbo.Inventory.nginx_version dolu olanlar,
#                                              nginx_audit / nginx_metadata ile AYNI betik)
#   console_dir:  /sw/BMW_PORTAL/nginx_console   (raw/<HOST>.txt buraya; varsayilan bu)
#   requester:    kullanici adi (gunluk)
#   force_full:   true -> parmak izi ne derse desin dokumu al (Portal'daki "Yenile" boyle gonderir);
#                 yok/false (zamanlanmis kosu) -> conf.d/conf agacinin parmak izi (boyut+mtime+yol)
#                 sunucudaki son dokumun parmak iziyle ayniysa dokum ve /sw kopyasi ATLANIR.
#
# SIK TARAMA (kullanici, 2026-09-19: "en az yarim saatte bir tum sunucular"): her kosuda host
# basina 1 kisa SSH komutu (parmak izi) — dokum/kopya yalniz DEGISEN sunucuda. Ansible'in asil
# maliyeti gorev basina SSH turu oldugu icin ayrica AWX template'inde Forks 50+ yapilmali
# (varsayilan 5 -> 311 sunucu 5'erli dalgalar halinde gider, o yuzden 30-40 dk).
#
# NEDEN add_host: AWX `limit` yalniz template'te "prompt on launch" aciksa calisir (bkz. Portal
# notlari) — host secimi playbook icinde yapilir.
# NEDEN GBLABT02: envanter DB'sine erisen kesif betigi orada kosar; /sw mount da orada
# (nginx sunucularinda /sw YOK) — nginx_audit ile ayni desen.
#
# Sure: host basina birkac saniye; TUM filo (yuzlerce nginx) 30-40 dk surebilir - Portal
# ekranindaki "Yenile" secili hostlari gonderir; zamanlanmis gece kosusu target_hosts'suz
# calisir (tum filo).

- name: "--- [Play] Hedef sunucular - verilen liste ya da envanterden kesif ---"
  hosts: GBLABT02
  gather_facts: no
  vars:
    console_dir: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}"
  tasks:
    - name: --- [Task] Cikti dizini ---
      ansible.builtin.file:
        path: "{{ console_dir }}/raw"
        state: directory
        mode: '0777'
      ignore_errors: true

    # target_hosts verilmediyse: nginx_audit.yml / nginx_metadata ile AYNI kesif
    # (bmw_nginx/nginx_metadata/files/get_nginx_hosts.py -> dbo.Inventory, nginx_version dolu).
    - name: --- [Task] Envanter kesfi (target_hosts bos) ---
      when: (target_hosts | default([]) | length) == 0
      block:
        - name: --- [Task] Host kesif script'ini kopyala ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.copy:
            src: ../../bmw_nginx/nginx_metadata/files/get_nginx_hosts.py
            dest: /vhosting/scripts/get_nginx_hosts.py
            mode: '0755'

        - name: --- [Task] Envanterden nginx hostlarini sor ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.command: python3 /vhosting/scripts/get_nginx_hosts.py
          register: nginx_known_hosts_result
          changed_when: false
      always:
        - name: --- [Task] Host kesif script'ini kaldir ---
          become: true
          become_method: dzdo
          become_user: was
          ansible.builtin.file:
            path: /vhosting/scripts/get_nginx_hosts.py
            state: absent
          failed_when: false

    - name: --- [Task] Hedef listesi ---
      ansible.builtin.set_fact:
        console_targets: >-
          {{ ((target_hosts | default([]) | length) > 0)
             | ternary(target_hosts | default([]), nginx_known_hosts_result.stdout_lines | default([]))
             | map('trim') | map('upper') | reject('equalto', '') | unique | list }}

    - name: --- [Task] Hedef yoksa DUR ---
      ansible.builtin.fail:
        msg: >-
          Hedef sunucu yok: target_hosts bos ve envanter kesfi 0 host dondurdu (muhtemelen
          middleware_inventory henuz calismadi). "all"a dusup tum filoyu taramak yerine duruyoruz.
      when: (console_targets | length) == 0

    - name: --- [Task] add_host ---
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: nginx_console_targets
      loop: "{{ console_targets }}"
      loop_control:
        label: "{{ item }}"

    - name: --- [Task] Ozet ---
      ansible.builtin.debug:
        msg: "{{ console_targets | length }} sunucu ({{ 'verilen liste' if (target_hosts | default([]) | length) > 0 else 'envanter kesfi' }}) -> {{ console_dir }}/raw"

- name: --- [Play] Konfigurasyon + sertifika dokumu ---
  hosts: nginx_console_targets
  gather_facts: no
  ignore_unreachable: true
  vars:
    console_dir: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}"
  tasks:
    - name: --- [Task] Dokum ---
      block:
        # 1) Parmak izi: conf.d + conf agacinin (boyut, mtime, yol) ozeti ve son dokumun izi.
        #    TEK kisa komut; degismemis sunucuda asagidaki agir adimlar hic kosmaz.
        - name: --- [Task] Parmak izi (degisiklik var mi?) ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.shell: |
            cur="$( (find /usr/nginx/conf.d /usr/nginx/conf -type f -printf '%s %T@ %p\n' 2>/dev/null | sort | sha256sum | cut -c1-64) )"
            last="$(cat /var/tmp/.nginx_console_fp 2>/dev/null)"
            echo "FP|${cur}|${last}"
          register: fp_out
          changed_when: false

        - name: --- [Task] Dokum gerekli mi ---
          ansible.builtin.set_fact:
            fp_cur: "{{ (fp_out.stdout_lines | default([]) | select('match', '^FP\\|') | list | last | default('FP||')).split('|')[1] }}"
            fp_last: "{{ (fp_out.stdout_lines | default([]) | select('match', '^FP\\|') | list | last | default('FP||')).split('|')[2] | default('') }}"
        - name: --- [Task] Karar ---
          ansible.builtin.set_fact:
            need_dump: "{{ (force_full | default(false) | bool) or (fp_cur | length) == 0 or fp_cur != fp_last }}"

        - name: --- [Task] Dokum betigini kopyala ---
          ansible.builtin.copy:
            src: files/nginx_console_dump.sh
            dest: /tmp/nginx_console_dump.sh
            mode: '0755'
          when: need_dump | bool

        # www: nginx dosyalari ve sertifikalar bu kullanicinin; diger nginx isleriyle ayni.
        - name: --- [Task] Dokumu al (www, salt okunur) ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.command: /bin/bash /tmp/nginx_console_dump.sh
          register: dump_out
          changed_when: false
          when: need_dump | bool

        - name: --- [Task] /sw'ye yaz (GBLABT02 uzerinden) ---
          ansible.builtin.copy:
            content: "{{ dump_out.stdout }}\n"
            dest: "{{ console_dir }}/raw/{{ inventory_hostname | upper }}.txt"
            mode: '0666'
          delegate_to: GBLABT02
          # GBLABT02'ye ayni anda forks kadar oturum -> sshd MaxSessions (10) asilir:
          # "mux_client_request_session: session request failed" (kullanici, 2026-09-21). En cok 6 eszamanli.
          throttle: 6
          when: (need_dump | bool) and (dump_out.stdout | default('') | length) > 0

        # Basarili dokumdan sonra parmak izi sunucuda saklanir (bir sonraki kosu karsilastirir).
        - name: --- [Task] Parmak izini kaydet ---
          become: true
          become_method: dzdo
          become_user: www
          ansible.builtin.copy:
            content: "{{ fp_cur }}"
            dest: /var/tmp/.nginx_console_fp
            mode: '0644'
          when: (need_dump | bool) and (dump_out.stdout | default('') | length) > 0
          changed_when: false

        - name: --- [Task] Sonuc ---
          ansible.builtin.set_fact:
            console_fetch_ok: "{{ (not (need_dump | bool)) or ((dump_out.stdout | default('') | length) > 0) }}"
            console_fetch_skipped: "{{ not (need_dump | bool) }}"
      rescue:
        - name: --- [Task] Hata kaydi ---
          ansible.builtin.set_fact:
            console_fetch_ok: false
            console_fetch_error: "{{ ansible_failed_result.msg | default('dokum alinamadi') }}"
      always:
        - name: --- [Task] Betigi temizle ---
          ansible.builtin.file:
            path: /tmp/nginx_console_dump.sh
            state: absent
          failed_when: false

- name: --- [Play] Toplayici ---
  hosts: localhost
  gather_facts: no
  become: false
  tasks:
    # Ulasilamayan host'ta console_fetch_ok HIC yok -> default(false); rescue'da error dolu.
    - name: --- [Task] Sonuc listesi ---
      ansible.builtin.set_fact:
        fetch_results: >-
          {{ (fetch_results | default([])) + [ {
               'host': item,
               'ok': (hostvars[item].console_fetch_ok | default(false) | bool),
               'skipped': (hostvars[item].console_fetch_skipped | default(false) | bool),
               'error': (hostvars[item].console_fetch_error | default('unreachable' if hostvars[item].console_fetch_ok is not defined else ''))
             } ] }}
      loop: "{{ groups['nginx_console_targets'] }}"
      loop_control:
        label: "{{ item }}"

    # SON GORULME (2026-09-22): parmak izi degismeyen sunucuda dokum yeniden yazilmaz, Portal da
    # "Online"i dokum mtime'indan turetiyordu -> konfigurasyonu degismeyen her sunucu 2 gun sonra
    # Offline gorunuyordu. Ulasilan (ok) her host icin raw/_seen.json'a zaman damgasi yazilir;
    # secili host yenilemesi digerlerini silmesin diye mevcut dosya okunup BIRLESTIRILIR.
    - name: --- [Task] Son gorulme dosyasini oku (_seen.json) ---
      ansible.builtin.slurp:
        src: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}/raw/_seen.json"
      delegate_to: GBLABT02
      register: seen_raw
      failed_when: false

    - name: --- [Task] Son gorulme - onceki kayitlar ---
      ansible.builtin.set_fact:
        seen_prev: "{{ ((seen_raw.content | default('e30=')) | b64decode | from_json).hosts | default({}) }}"
      ignore_errors: true

    - name: --- [Task] Son gorulme yaz (_seen.json) ---
      vars:
        seen_now: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        seen_hosts: "{{ fetch_results | default([]) | selectattr('ok') | map(attribute='host') | map('upper') | list }}"
        seen_new: "{{ dict(seen_hosts | zip(seen_hosts | map('regex_replace', '^.*$', seen_now) | list)) }}"
      ansible.builtin.copy:
        content: "{{ {'at': seen_now, 'hosts': ((seen_prev | default({})) if (seen_prev | default({})) is mapping else {}) | combine(seen_new)} | to_nice_json }}\n"
        dest: "{{ console_dir | default('/sw/BMW_PORTAL/nginx_console') }}/raw/_seen.json"
        mode: '0666'
      delegate_to: GBLABT02
      when: (seen_hosts | length) > 0
      failed_when: false

    - name: --- [Task] set_stats ---
      ansible.builtin.set_stats:
        data:
          nginx_console_fetch_result:
            hosts: "{{ fetch_results | default([]) }}"
            ok_count: "{{ fetch_results | default([]) | selectattr('ok') | list | length }}"
            dumped_count: "{{ fetch_results | default([]) | selectattr('ok') | rejectattr('skipped') | list | length }}"
            skipped_count: "{{ fetch_results | default([]) | selectattr('skipped') | list | length }}"

    - name: --- [Task] Hic host dokulemediyse basarisiz ---
      ansible.builtin.fail:
        msg: "Hicbir sunucudan dokum alinamadi: {{ fetch_results | default([]) }}"
      when: (fetch_results | default([]) | selectattr('ok') | list | length) == 0
