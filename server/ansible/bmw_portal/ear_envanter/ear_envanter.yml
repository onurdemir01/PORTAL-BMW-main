---
# ear_envanter.yml — Portal > Server Hub > Uygulama Envanteri: /vhosting ve /vhosting8 altindaki
# EAR/WAR uygulamalarini SALT OKUNUR tarar (teknoloji, surum, JSP/TLD/JAR sayilari, istenirse
# ls -lrtiR benzeri agac). Sonuc host basina tek dosya olarak GBLABT02 uzerinden /sw'ye yazilir;
# Portal ayni mount'u okuyup DB'ye alir. Ayrinti: README.md.
#
# extra_vars (Portal gonderir):
#   hedefler:              ["APPSRV01", "APPSRV02"]  (Portal kipi; bir PARTI, en cok ear_parti_siniri)
#   ear_kip:               OZET | TAM               (OZET: dosya basina stat yok; TAM: + agac)
#   ear_kosu_no:           12                       (Portal kosu numarasi; dizin adi)
#   ear_parti_no:          3                        (Portal parti numarasi)
#   ear_dizin:             /sw/BMW_PORTAL/ear_envanter
#   ear_okuma_kullanicisi: was                      (dzdo ile; bos -> become YOK)
#   ear_kokler:            "/vhosting:/vhosting8"
#   ear_sure:              300   (betik ici yumusak butce, sn)
#   ear_zaman_asimi:       600   (Ansible gorev zaman asimi, sn: kesin sinir)
#   ear_sinir_uygulama:    25000 / ear_sinir_host: 200000 / ear_arsiv_mb: 64
#   ear_baglanti_kontrol:  false (FAZ A: yapilandirilmis JVM / WAS portlarina ESTABLISHED baglanti goruntusu; Admin acar)
#   ear_baglanti_ornek:    3     (ornek sayisi) / ear_baglanti_ara: 10 (ornekler arasi sn)
#   ear_was_kokler:        "/opt/IBM/WebSphere/AppServer:/usr/IBM/WebSphere/AppServer"  (WebSphere serverindex.xml)
#   ear_deployment_kontrol: false (FAZ 2: calisan JVM'lerin deployment durumu, JBoss CLI; Admin acar)
#   ear_dep_zaman:         15    (CLI cagrisi basina sn) / ear_dep_sure: 180 (host butcesi, sn)
#   ear_web_kontrol:       false (FAZ W: web katmani - Apache / IHS config, soketler, IP'ler, log ozeti; Admin acar)
#   ear_web_okuma_kullanicisi: ""  (Faz W okuma kimligi, dzdo; bos -> ear_okuma_kullanicisi)
#   ear_web_kokler:        "/usr/IBMIHS:/etc/httpd:..."  (aday kurulum kokleri; calisanlar ps'ten bulunur)
#   ear_web_hc:            "hc.html,hc.jsp"  (saglik kontrolu dosya adlari: "gercek istek" sayilmaz)
#   ear_web_gun:           7     (log penceresi, gun) / ear_web_log_mb: 256 (log okuma butcesi) / ear_web_sure: 240
#   requester:             kullanici adi (gunluk)
#
# FAZ 2 (2026-11-06, istege bagli): ikinci `raw` files/deployment_oku.sh'i `bash -s` ile calistirir
# (yalniz ps + JBoss CLI read-children-resources; salt okunur). Ciktisi ayni ham dosyaya tarama
# paketinden SONRA eklenir. ear_deployment_kontrol verilmezse calismaz (her calisan JVM bir CLI sureci).
#
# FAZ W (2026-11-07, istege bagli): ucuncu `raw` files/web_tara.py'yi `python3 -B -` ile calistirir. httpd
# ikilisini CALISTIRMAZ, calisan web sunucusuna istek ATMAZ; config / log dosyalarini okur, soketleri
# /proc/net/tcp'den, IP'leri `ip -o addr show` ile alir. Ciktisi ayni ham dosyaya, onceki bloklardan SONRA
# eklenir. ear_web_kontrol verilmezse calismaz.
#
# HEDEFTE NE CALISIR: tek `raw` gorevi (Faz 2 / Faz W aciksa onlar da, salt okunur `raw`). Yorumlayici aranir (python3, yoksa RHEL 8
# platform-python), betik files/ear_tara.py ACIK METIN olarak heredoc ile stdin'den verilir
# (`python3 -B -`): hedefe dosya kopyalanmaz, modul gonderilmez, bytecode yazilmaz.
# Betik dosya icerigi okumaz (yalniz zip arsivlerinin merkez dizini), hicbir sey yazmaz/silmez.
#
# IKI KIP (2026-11-05):
#   PORTAL KIPI: `hedefler` verilir (Portal her zaman verir). Hedefler add_host ile eklenir (AWX
#     `limit` yalniz template'te "prompt on launch" aciksa calisir; nginx_console_fetch deseni).
#     Cikti <ear_dizin>/kosu-<ear_kosu_no>/raw.
#   LIMIT KIPI: AWX'ten elle; `hedefler` YOK, sunucular AWX Limit alanindan (envanter host'lari).
#     Limit bossa is ilk play'de durur: tum envanter taranmaz. Cikti
#     <ear_dizin>/awx-<awx_job_id>/raw (awx_job_id'yi AWX verir); Portal bu isleri bulup yeni kosu
#     olarak alir. Dosya / host adi envanter adinin kisa hali (alan adi atilir), BUYUK harf.
# TUZAK: Limit DOLUYKEN `hosts: localhost` play'leri atlanir (Ansible limit'i localhost'a da
# uygular; `all` yazilsa bile). Portal kipinde Limit dolu olursa is hicbir sey taramadan
# "successful" biter; Portal bu yuzden Limit alani dolu sablonla baslatmaz.
# NEDEN GBLABT02: /sw mount orada; hedeflerde /sw yok. throttle 6: sshd MaxSessions (10).
# AWX template: Variables "prompt on launch" ACIK, Limit BOS ("prompt on launch" ACIK), Forks 50.

- name: "--- [Play] Girdi, hedefler ve cikti dizini ---"
  hosts: localhost
  gather_facts: no
  tasks:
    # Limit dolu olsaydi bu play hic calismazdi; buraya hedefler'siz gelmek Limit'in BOS oldugu demek.
    - name: "--- [Task] Sunucu secimi ---"
      ansible.builtin.fail:
        msg: "Sunucu secilmedi: AWX'te Limit alanina taranacak sunucu adlarini yaz. Limit bosken tum envanter TARANMAZ."
      when: hedefler is not defined

    - name: "--- [Task] Girdi dogrulama ---"
      ansible.builtin.assert:
        that:
          - hedefler is defined
          - hedefler is sequence
          - hedefler is not string
          - (hedefler | length) > 0
          - (hedefler | length) <= (ear_parti_siniri | default(100) | int)
          - (hedefler | select('match', '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$') | list | length) == (hedefler | length)
          - (ear_kip | default('OZET')) in ['OZET', 'TAM']
          - (ear_kosu_no | default('') | string) is match('^[0-9]{1,9}$')
          - (ear_parti_no | default('') | string) is match('^[0-9]{1,6}$')
          - (ear_okuma_kullanicisi | default('was') | string) is match('^([a-z_][a-z0-9_-]{0,31})?$')
          - (ear_kokler | default('/vhosting:/vhosting8')) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
          - (ear_dizin | default('/sw/BMW_PORTAL/ear_envanter')) is match('^/[A-Za-z0-9_][A-Za-z0-9._/-]*$')
          - "'..' not in (ear_dizin | default('/sw/BMW_PORTAL/ear_envanter'))"
          - (ear_web_okuma_kullanicisi | default('') | string) is match('^([a-z_][a-z0-9_-]{0,31})?$')
          - (ear_web_kokler | default('/usr/IBMIHS') | string) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
          - (ear_web_hc | default('hc.html,hc.jsp') | string) is match('^[A-Za-z0-9._-]{1,64}(,[A-Za-z0-9._-]{1,64}){0,19}$')
          - (ear_was_kokler | default('/opt/IBM/WebSphere/AppServer') | string) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
        fail_msg: "Gecersiz girdi: hedefler / ear_kip / ear_kosu_no / ear_parti_no / ear_okuma_kullanicisi / ear_kokler / ear_dizin / Faz W girdileri"

    - name: "--- [Task] Hedefleri ekle ---"
      ansible.builtin.add_host:
        name: "{{ item | upper }}"
        groups: ear_hedefler
      loop: "{{ hedefler }}"
      changed_when: false

    - name: "--- [Task] Cikti dizini (GBLABT02) ---"
      ansible.builtin.file:
        path: "{{ ear_dizin | default('/sw/BMW_PORTAL/ear_envanter') }}/kosu-{{ ear_kosu_no }}/raw"
        state: directory
        mode: '0770'
      delegate_to: "{{ ear_yazici_host | default('GBLABT02') }}"

# Portal kipinde localhost'ta tum gorevler atlanir; Limit kipinde run_once ile tek kez.
- name: "--- [Play] Limit kipi: girdi ve cikti dizini ---"
  hosts: "{{ 'localhost' if hedefler is defined else 'all' }}"
  gather_facts: no
  tasks:
    - name: "--- [Task] Limit kipi girdi dogrulama ---"
      ansible.builtin.assert:
        that:
          - (awx_job_id | default('') | string) is match('^[0-9]{1,9}$')
          - (ear_kip | default('OZET')) in ['OZET', 'TAM']
          - (ear_okuma_kullanicisi | default('was') | string) is match('^([a-z_][a-z0-9_-]{0,31})?$')
          - (ear_kokler | default('/vhosting:/vhosting8')) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
          - (ear_dizin | default('/sw/BMW_PORTAL/ear_envanter')) is match('^/[A-Za-z0-9_][A-Za-z0-9._/-]*$')
          - "'..' not in (ear_dizin | default('/sw/BMW_PORTAL/ear_envanter'))"
          - (ear_web_okuma_kullanicisi | default('') | string) is match('^([a-z_][a-z0-9_-]{0,31})?$')
          - (ear_web_kokler | default('/usr/IBMIHS') | string) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
          - (ear_web_hc | default('hc.html,hc.jsp') | string) is match('^[A-Za-z0-9._-]{1,64}(,[A-Za-z0-9._-]{1,64}){0,19}$')
          - (ear_was_kokler | default('/opt/IBM/WebSphere/AppServer') | string) is match('^(/[A-Za-z0-9._/-]+)(:/[A-Za-z0-9._/-]+)*$')
        fail_msg: "Gecersiz girdi (Limit kipi): awx_job_id (AWX disinda elle ver) / ear_kip / ear_okuma_kullanicisi / ear_kokler / ear_dizin / Faz W girdileri"
      run_once: true
      when: hedefler is not defined

    - name: "--- [Task] Cikti dizini (Limit kipi, GBLABT02) ---"
      ansible.builtin.file:
        path: "{{ ear_dizin | default('/sw/BMW_PORTAL/ear_envanter') }}/awx-{{ awx_job_id }}/raw"
        state: directory
        mode: '0770'
      delegate_to: "{{ ear_yazici_host | default('GBLABT02') }}"
      run_once: true
      when: hedefler is not defined

- name: "--- [Play] Salt okunur tarama ---"
  hosts: "{{ 'ear_hedefler' if hedefler is defined else 'all' }}"
  gather_facts: no
  ignore_unreachable: true
  strategy: free
  vars:
    ear_okuyan: "{{ ear_okuma_kullanicisi | default('was') }}"
    ear_web_okuyan: "{{ ear_web_okuma_kullanicisi | default('', true) or ear_okuyan }}"
    ear_alt_dizin: "{{ ('kosu-' ~ ear_kosu_no) if hedefler is defined else ('awx-' ~ awx_job_id) }}"
    # Limit kipinde envanter adi FQDN olabilir: Portal (MWAppsInventory) kisa adi BUYUK harf bilir.
    ear_host_adi: "{{ (inventory_hostname if hedefler is defined else (inventory_hostname.split('.')[0] if inventory_hostname is match('[A-Za-z]') else inventory_hostname)) | regex_replace('[^A-Za-z0-9._-]', '_') | upper }}"
    ear_cikti_dosyasi: "{{ ear_dizin | default('/sw/BMW_PORTAL/ear_envanter') }}/{{ ear_alt_dizin }}/raw/{{ ear_host_adi }}.out"
  tasks:
    # TUZAK 3 (playbook-jinja-traps): tum hostlar dusse de toplayici play'e ulasilmali; yoksa
    # set_stats HIC yayinlanmaz. Kopya no_log altinda (icerik AWX olayina yazilmasin) oldugu icin
    # sebep sansurlenir; durum asamadan cikarilir: paket alindiysa YAZILAMADI, degilse HATA.
    - name: "--- [Block] Tarama ---"
      block:
        - name: "--- [Task] Tara (salt okunur; hedefe dosya yazilmaz) ---"
          become: "{{ (ear_okuyan | length) > 0 }}"
          become_method: dzdo
          become_user: "{{ ear_okuyan if (ear_okuyan | length) > 0 else omit }}"
          ansible.builtin.raw: |
            P=""; for c in python3 /usr/libexec/platform-python; do command -v "$c" >/dev/null 2>&1 && { P="$c"; break; }; done
            [ -n "$P" ] || { echo "@@EAR_PYTHON_YOK@@"; exit 0; }
            EAR_KIP={{ ear_kip | default('OZET') | quote }} EAR_KOKLER={{ ear_kokler | default('/vhosting:/vhosting8') | quote }} EAR_SURE={{ ear_sure | default(300) | int }} EAR_SINIR_UYGULAMA={{ ear_sinir_uygulama | default(25000) | int }} EAR_SINIR_HOST={{ ear_sinir_host | default(200000) | int }} EAR_ARSIV_MB={{ ear_arsiv_mb | default(64) | int }} EAR_WAS={{ ear_was_kokler | default('/opt/IBM/WebSphere/AppServer:/usr/IBM/WebSphere/AppServer') | quote }} EAR_BAGLANTI={{ '1' if (ear_baglanti_kontrol | default(false) | bool) else '0' }} EAR_BAGLANTI_ORNEK={{ ear_baglanti_ornek | default(3) | int }} EAR_BAGLANTI_ARA={{ ear_baglanti_ara | default(10) | int }} LC_ALL=C PYTHONIOENCODING=utf-8:surrogateescape "$P" -B - <<'EAR_TARA_SON'
            {{ lookup('ansible.builtin.file', 'files/ear_tara.py') }}
            EAR_TARA_SON
          register: ear_tarama
          timeout: "{{ ear_zaman_asimi | default(600) | int }}"
          changed_when: false
          failed_when: false
          no_log: true

        - name: "--- [Task] Sonucu siniflandir ---"
          ansible.builtin.set_fact:
            ear_ozet:
              host: "{{ ear_host_adi }}"
              paket: "{{ '@@EAR_ENVANTER_BITTI@@' in (ear_tarama.stdout | default('')) }}"
              durum: >-
                {{ 'ULASILAMADI' if (ear_tarama.unreachable | default(false) | bool)
                   else 'SONUC' if '@@EAR_ENVANTER_BITTI@@' in (ear_tarama.stdout | default(''))
                   else 'PYTHON_YOK' if '@@EAR_PYTHON_YOK@@' in (ear_tarama.stdout | default(''))
                   else 'ZAMAN_ASIMI' if ('timed out' in (ear_tarama.msg | default('') | lower) or 'timeout' in (ear_tarama.msg | default('') | lower))
                   else 'KIMLIK_GECISI_YOK' if ('dzdo' in ((ear_tarama.msg | default('')) ~ (ear_tarama.stderr | default('')) ~ (ear_tarama.module_stderr | default(''))) | lower)
                   else 'HATA' }}
              rc: "{{ ear_tarama.rc | default(-1) }}"
              bayt: "{{ ear_tarama.stdout | default('') | length }}"
              hata: "{{ ((ear_tarama.msg | default('')) ~ ' ' ~ (ear_tarama.stderr | default(''))) | trim | truncate(300, true, '') }}"
          no_log: true

        # FAZ 2: yalniz istenirse ve tarama paketi alindiysa. Atlanirsa ear_deployment.stdout yok.
        - name: "--- [Task] Deployment durumu (Faz 2; salt okunur JBoss CLI) ---"
          become: "{{ (ear_okuyan | length) > 0 }}"
          become_method: dzdo
          become_user: "{{ ear_okuyan if (ear_okuyan | length) > 0 else omit }}"
          ansible.builtin.raw: |
            command -v bash >/dev/null 2>&1 || { printf '@@EAR_DEPLOYMENT_BASLA@@\n@@JVM@@ - - BASH_YOK\n@@EAR_DEPLOYMENT_BITTI@@\n'; exit 0; }
            EAR_DEP_ZAMAN={{ ear_dep_zaman | default(15) | int }} EAR_DEP_SURE={{ ear_dep_sure | default(180) | int }} LC_ALL=C bash -s <<'EAR_DEPLOYMENT_SON'
            {{ lookup('ansible.builtin.file', 'files/deployment_oku.sh') }}
            EAR_DEPLOYMENT_SON
          register: ear_deployment
          timeout: "{{ (ear_dep_sure | default(180) | int) + 60 }}"
          changed_when: false
          failed_when: false
          no_log: true
          when:
            - ear_deployment_kontrol | default(false) | bool
            - ear_ozet.paket | bool

        - name: "--- [Task] Web katmani (Faz W; salt okunur config / soket / IP / log ozeti) ---"
          become: "{{ (ear_web_okuyan | length) > 0 }}"
          become_method: dzdo
          become_user: "{{ ear_web_okuyan if (ear_web_okuyan | length) > 0 else omit }}"
          ansible.builtin.raw: |
            P=""; for c in python3 /usr/libexec/platform-python; do command -v "$c" >/dev/null 2>&1 && { P="$c"; break; }; done
            [ -n "$P" ] || { echo "@@EAR_WEB_PYTHON_YOK@@"; exit 0; }
            EAR_WEB_KOKLER={{ ear_web_kokler | default('/usr/IBMIHS:/opt/IBM/HTTPServer:/usr/IBM/HTTPServer:/etc/httpd:/opt/rh/httpd24/root/etc/httpd:/opt/jbcs-httpd24-2.4/httpd') | quote }} EAR_WEB_HC={{ ear_web_hc | default('hc.html,hc.jsp') | quote }} EAR_WEB_GUN={{ ear_web_gun | default(7) | int }} EAR_WEB_LOG_MB={{ ear_web_log_mb | default(256) | int }} EAR_WEB_SURE={{ ear_web_sure | default(240) | int }} LC_ALL=C PYTHONIOENCODING=utf-8:surrogateescape "$P" -B - <<'EAR_WEB_SON'
            {{ lookup('ansible.builtin.file', 'files/web_tara.py') }}
            EAR_WEB_SON
          register: ear_web
          timeout: "{{ (ear_web_sure | default(240) | int) + 120 }}"
          changed_when: false
          failed_when: false
          no_log: true
          when:
            - ear_web_kontrol | default(false) | bool
            - ear_ozet.paket | bool
        - name: "--- [Task] /sw'ye yaz (GBLABT02 uzerinden) ---"
          ansible.builtin.copy:
            content: "{{ ear_tarama.stdout }}{{ ear_deployment.stdout | default('') }}{{ ear_web.stdout | default('') }}"
            dest: "{{ ear_cikti_dosyasi }}"
            mode: '0644'
          delegate_to: "{{ ear_yazici_host | default('GBLABT02') }}"
          throttle: 6
          when: ear_ozet.paket | bool
          no_log: true
      rescue:
        - name: "--- [Task] Hata kaydi ---"
          ansible.builtin.set_fact:
            ear_ozet:
              host: "{{ ear_host_adi }}"
              paket: false
              durum: "{{ 'YAZILAMADI' if (ear_ozet is defined and (ear_ozet.paket | default(false) | bool)) else 'HATA' }}"
              rc: -1
              bayt: 0
              hata: "{{ (ansible_failed_result.msg | default('tarama sirasinda hata')) | truncate(300, true, '') }}"

# Limit kipinde localhost play'i atlanir: toplayici limit'teki hostlarda run_once ile kosar.
- name: "--- [Play] Toplayici ---"
  hosts: "{{ 'localhost' if hedefler is defined else 'all' }}"
  gather_facts: no
  vars:
    ear_toplanan: "{{ (groups['ear_hedefler'] | default([])) if hedefler is defined else ansible_play_hosts_all }}"
  tasks:
    # Ulasilamayan host'ta ear_ozet HIC yok -> ULASILAMADI.
    - name: "--- [Task] Sonuc listesi ---"
      ansible.builtin.set_fact:
        ear_sonuclar: >-
          {{ (ear_sonuclar | default([])) + [ hostvars[item].ear_ozet | default({
               'host': ((item if hedefler is defined else (item.split('.')[0] if item is match('[A-Za-z]') else item)) | regex_replace('[^A-Za-z0-9._-]', '_') | upper),
               'paket': false, 'durum': 'ULASILAMADI', 'rc': -1, 'bayt': 0, 'hata': 'unreachable' }) ] }}
      loop: "{{ ear_toplanan }}"
      loop_control:
        label: "{{ item }}"
      run_once: true

    - name: "--- [Task] set_stats ---"
      ansible.builtin.set_stats:
        data:
          ear_envanter_result:
            kosu_no: "{{ ear_kosu_no | default(0) | int }}"
            parti_no: "{{ ear_parti_no | default(0) | int }}"
            kip: "{{ ear_kip | default('OZET') }}"
            # 2: Limit kipi. Portal AWX'ten elle baslatilan isi yalniz kaynak AWX ise alir.
            playbook_surum: 2
            kaynak: "{{ 'PORTAL' if hedefler is defined else 'AWX' }}"
            awx_job_id: "{{ awx_job_id | default(0) | int }}"
            limit: "{{ ansible_limit | default('') }}"
            beklenen: "{{ (hedefler | length) if hedefler is defined else (ear_toplanan | length) }}"
            sonuc_alinan: "{{ ear_sonuclar | default([]) | selectattr('paket') | list | length }}"
            hostlar: "{{ ear_sonuclar | default([]) }}"
      run_once: true

    - name: "--- [Task] Hic sonuc yoksa basarisiz ---"
      ansible.builtin.fail:
        msg: "Hicbir sunucudan envanter alinamadi. Sonuclar: {{ ear_sonuclar | default([]) | map(attribute='durum') | list }}"
      when: (ear_sonuclar | default([]) | selectattr('paket') | list | length) == 0
      run_once: true
