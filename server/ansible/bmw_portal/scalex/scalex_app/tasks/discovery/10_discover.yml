---
# Tek cluster icin kesif. `files/scalex_runner.sh` betigini `SCALEX_PHASE=discover`
# ile calistirir — mutasyon yolundaki oturum acma / `oc` yolu bulma / kubeconfig
# mantiginin AYNISI kullanilir, ikinci bir kopya yoktur.

- name: "DISCOVER | Read cluster {{ scalex_target.cluster }}"
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/files/scalex_runner.sh"
    executable: /bin/bash
  environment:
    SCALEX_PHASE: "discover"
    DISCOVERY_MODE: "{{ discovery_mode_effective }}"
    CLUSTER: "{{ scalex_target.cluster }}"
    JUMP_SERVER: >-
      {{ scalex_target.jump_label ~ (' -> ' ~ scalex_target.physical_host if scalex_target.physical_host != scalex_target.jump_label else '') }}
    API_URL: "{{ scalex_target.api_url }}"
    OCP_USERNAME: "{{ username }}"
    OCP_PASSWORD: "{{ lookup('ansible.builtin.vars', scalex_target.credential) }}"
    OCP_OC_PATHS: "{{ scalex_target.oc_paths | join(':') }}"
    TLS_VERIFY: "{{ scalex_target.tls_verify | bool | string | lower }}"
    NS: "{{ oc_namespace }}"
    # TEK ISTE COK NAMESPACE. `NS` KALIYOR (eski paket ve mutasyon yolu onu
    # okuyor); `NS_LIST` yalnizca EKLENIYOR ve bos geldiginde betik listeyi
    # `NS`ten turetir — yani eski davranis birebir korunur.
    #
    # KAZANC: AWX sabit maliyeti (kuyruk + SSH + `oc login`) IS BASINA odenir.
    # Uc namespace ayri ayri kosturuldugunda o maliyet UC KEZ odeniyordu ve `oc`
    # cagrilarini sifira indirsen bile ~18 sn taban kaliyordu.
    NS_LIST: "{{ oc_namespaces_effective | join(',') }}"
    APP_RAW: "{{ target_app_list | join(',') }}"
    # CANLI YOKLAMA LISTESI — yalnizca `state` kesfinde dolu gelir. Portal, o
    # namespace icin AYNASINDA kayitli uygulamalarin adlarini gonderir; betik her
    # biri icin bir `LIVE` satiri basar (istenen/mevcut/hazir replica).
    #
    # `APP_RAW`DAN AYRI: `APP_RAW` ConfigMap listelemesini de suzuyor. Bu listeyle
    # suzseydik cluster'da durdurulmus ama portalda kaydi OLMAYAN uygulamalar
    # (`unknown_to_portal`) gorunmez olurdu — sapma tespitinin YARISI kaybolurdu.
    SCALEX_LIVE_PROBE_APPS: "{{ scalex_live_probe_apps | default('') }}"
    # CLUSTER YETENEK ONBELLEGI — olceklenebilir CRD listesi.
    #
    # Bu liste cluster duzeyidir ve aylarca degismez; portal onu DB'de tutuyor.
    # Dolu geldiginde betik ~50 `oc get --raw` cagrisini TAMAMEN atlar.
    #
    # BOS GECMEK GUVENLIDIR: betik eski yola duser ve listeyi kendisi hesaplar
    # (fail-safe). Portal onbellek yok/bayat/okunamadi durumlarinda bilerek bos
    # gonderir — "onbellek yok"u "CRD yok" saymak, olceklenebilir operator
    # nesnelerini SESSIZCE listeden dusurmek olurdu.
    #
    # CLUSTER BASINA: oncelik BU cluster'in kendi kaydindadir. Sozlukte yoksa
    # `scalex_extra_kinds_fallback` gelir — ve o deger, portal sozluk gonderdiyse
    # BILEREK bos olur (bkz. 01_prepare.yml "Resolve per-cluster capability
    # cache"): baska bir cluster'in listesiyle sinirlanmak, bu cluster'in kendi
    # CRD'lerini sessizce dusurmek olurdu.
    #
    # `default(x)` BOOLEAN DEGIL: yalnizca ANAHTAR YOKSA geriye dusulur.
    SCALEX_EXTRA_KINDS: "{{ scalex_cluster_kinds_effective[scalex_target.cluster] | default(scalex_extra_kinds_fallback) }}"
    # "TARANDI AMA BOS" — BOS LISTEDEN AYRI BIR HAL.
    #
    # `SCALEX_EXTRA_KINDS=''` betik tarafinda "onbellek YOK" demek ve ~50
    # `oc get --raw` cagrisini yeniden kosturur. Oysa portal "bu cluster tarandi,
    # olceklenebilir EKSTRA CRD YOK" da diyebiliyor ve bu bilgi tam olarak o
    # cagrilari atlatan bilgi. Sozlukte ANAHTARIN VARLIGI bunu soyler: portal
    # yalnizca GUVENILIR bir kaydi olan cluster'i sozluge koyar.
    #
    # AYRI DEGISKEN, ORTAK DEGERE ISARET KOYMAK DEGIL: `'-'` gibi bir isaret
    # degeri ESKI bir pakette gercek bir tip adi sanilirdi. Tanimadigi bir ortam
    # degiskenini ise eski paket sessizce YOK SAYAR.
    SCALEX_EXTRA_KINDS_SCANNED: "{{ 'yes' if (scalex_target.cluster in scalex_cluster_kinds_effective) else 'no' }}"
    # Kesifte islem YOK. Betik `discover` fazinda `ACTION` aramaz; yine de bos
    # gecmek, degiskenin tanimsiz kalmasindan iyidir (`set -u` ile calisiyor).
    ACTION: ""
    WORKLOAD_KIND: "auto"
    JOB_ID: "{{ job_id }}"
    CREATED_BY: "{{ username }}"
  delegate_to: "{{ scalex_target.runtime_host }}"
  register: _discovery_result
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  no_log: true

- name: "DISCOVER | Collect sanitized rows"
  ansible.builtin.set_fact:
    _cluster_rows: >-
      {{ (_discovery_result.stdout_lines | default([]))
         | select('match', '^[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;[^;]*;.*$')
         | list }}

# `rescue` ULASILAMAYAN HOST'U YAKALAMAZ; `ignore_unreachable` + burada acik
# kontrol sart. Bu tuzak bu depoda uretimde yasandi.
- name: "DISCOVER | Record transport/runtime failure"
  ansible.builtin.set_fact:
    _cluster_rows: >-
      {{ _cluster_rows + [
        scalex_target.cluster ~ ';' ~ scalex_target.jump_label ~ ';-;-;RUNNER;FAIL;Discovery could not complete because of SSH/transport/shell/runtime failure'
      ] }}
    _failed_clusters: "{{ _failed_clusters + [scalex_target.cluster] }}"
  when:
    - (_discovery_result.unreachable | default(false)) or ((_discovery_result.rc | default(0) | int) != 0)

- name: "DISCOVER | Record empty runner response"
  ansible.builtin.set_fact:
    _cluster_rows: >-
      {{ _cluster_rows + [
        scalex_target.cluster ~ ';' ~ scalex_target.jump_label ~ ';-;-;RUNNER;FAIL;Discovery returned no structured result rows'
      ] }}
    _failed_clusters: "{{ _failed_clusters + [scalex_target.cluster] }}"
  when:
    - not (_discovery_result.unreachable | default(false))
    - (_discovery_result.rc | default(0) | int) == 0
    - _cluster_rows | length == 0

# Betik icinde FAIL uretmis (or. RBAC reddi) bir cluster da BASARISIZ sayilir:
# portal `failed_clusters` listesini kullanicinin "hangi cluster okunamadi"
# sorusunu yanitlamak icin kullaniyor.
- name: "DISCOVER | Mark cluster failed when the runner reported a FAIL row"
  ansible.builtin.set_fact:
    _failed_clusters: "{{ _failed_clusters + [scalex_target.cluster] }}"
  when:
    - scalex_target.cluster not in _failed_clusters
    - _cluster_rows | select('search', ';FAIL;') | list | length > 0

- name: "DISCOVER | Append cluster rows"
  ansible.builtin.set_fact:
    _discovery_rows: "{{ _discovery_rows + _cluster_rows }}"
